rigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour WE, on attend notamment des traces telles que : cartographie des compétences, affectations, organisation d'équipes, mécanismes d'échange.","**La distinction importante.** Un risque typique serait de distribuer les rôles sans tenir compte des capacités réelles. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Comprendre l’environnement de travail"],["02 · Organiser","Développer autonomie et collaboration"],["03 · Appliquer","Déployer le soutien aux équipes"],["04 · Vérifier","Mesurer et ajuster l’engagement"]],"story":"**Mission terrain.** Une équipe porte un service critique sans compétence de relais. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Ajuster les rôles, développer les compétences et prévoir la continuité. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Une équipe porte un service critique sans compétence de relais. » Quelle réponse est la plus défendable ?","choices":["Ajuster les rôles, développer les compétences et prévoir la continuité.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Distribuer les rôles sans tenir compte des capacités réelles."],"correct":0,"why":"La bonne décision répond au problème constaté : Ajuster les rôles, développer les compétences et prévoir la continuité. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["WE","Autonomisation des équipes"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Matrice de compétences, affectations et coordination","Traces d'exécution : Cartographie des compétences, affectations, organisation d'équipes, mécanismes d'échange.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":31,"evidenceContrast":["Des conditions de travail adaptées sont suivies à partir de retours et de résultats.","Une enquête d’engagement n’aboutit à aucun changement observable."],"levelFr":{"1":"Identifier des besoins importants pour l’engagement du personnel","2":"Agir sur les conditions de travail et l’autonomie, suivre les résultats","3":"Déployer une approche organisationnelle d’engagement et évaluer les améliorations"}},"duration":25,"isExpanded":true,"en":{"title":"Workforce Empowerment","summary":"Enable the workforce to achieve goals through capacity, roles and support","kicker":"From process intent to verifiable outcomes: Workforce Empowerment","paragraphs":["**The business problem.** Enable the workforce to achieve goals through capacity, roles and support. In a realistic organization, this means deciding which outcomes must improve and which people or teams are responsible. The goal is not to produce paperwork for an auditor: it is to make the activity reliable when circumstances change.","**A concrete example.** A critical service depends on one person with no trained backup. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** Map required competencies, distribute authority, build backups and monitor workforce capability. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for skill matrix, delegation record, succession plan. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** assigning roles without checking actual ability and coverage."],"steps":[["01 · Define","Identify roles and required capabilities"],["02 · Prepare","Provide support and decision authority"],["03 · Perform","Build resilience through backups"],["04 · Review","Review workload and competence"]],"story":"**Case file — fictional organization.** A critical service depends on one person with no trained backup. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to map required competencies, distribute authority, build backups and monitor workforce capability. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the WE problem described in the case?","choices":["Document the intention without changing how the team works.","Map required competencies, distribute authority, build backups and monitor workforce capability","Declare full maturity because the process has an owner."],"correct":1,"why":"Workforce Empowerment requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["empowerment","Giving people capability and authority to act effectively"],["single point of failure","One person or resource whose loss can halt essential work"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual WE process.","Dated artifacts show the practice performed: Skill matrix, delegation record, succession plan.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous skill matrix, delegation record, succession plan tied to real work.","Weaker: assigning roles without checking actual ability and coverage; no trace of consistent use."],"levelFr":{"1":"Begin addressing workforce empowerment, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable workforce empowerment work. For example: Provide support and decision authority; build resilience through backups.","3":"Use a shared organizational approach to workforce empowerment; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets."},"scenario":"A critical service depends on one person with no trained backup","pitfall":"Assigning roles without checking actual ability and coverage","action":"Map required competencies, distribute authority, build backups and monitor workforce capability","evidence":"Skill matrix, delegation record, succession plan"}}],"foundations":[{"id":"F01","title":"CMMI : valeur et objectifs","topic":"Fondations","duration":18,"summary":"La finalité du CMMI est l’amélioration mesurable des performances métiers. Un niveau n’est pas une fin en soi.","bullets":["Lier chaque initiative à une valeur métier observable.","Distinguer capacité de processus et performance réelle.","Commencer par les difficultés opérationnelles avant les artefacts."],"challenge":"Un directeur veut obtenir ML3 sans changer les pratiques. Quel risque majeur identifies-tu ?","answer":"L’objectif devient cosmétique : le résultat d’évaluation ne remplace pas une amélioration effective.","deep":{"kicker":"Améliorer la capacité, pas collectionner des badges","paragraphs":["Le CMMI est une façon structurée de relier les pratiques de travail aux résultats de l'entreprise. On part d'un problème concret — retards répétés, défauts, reprises coûteuses — puis on se demande quels comportements et mécanismes rendent ce résultat probable.","Une équipe peut livrer un excellent produit une fois grâce à des personnes héroïques. La question CMMI est plus exigeante : l'organisation peut-elle reproduire ce résultat malgré un changement de projet, de client ou d'équipe ? Ce déplacement, de la réussite occasionnelle vers la capacité durable, est essentiel.","Une amélioration est utile lorsqu'elle sert un objectif d'entreprise : fiabilité de livraison, qualité perçue, coût des retouches, stabilité d'un service ou maîtrise du risque. Une pratique sans objectif ni usage observable devient de la bureaucratie. Une note de maturité peut aider à mesurer le chemin parcouru, mais ne remplace pas ce résultat."],"steps":[["Observer","Formuler une difficulté réelle : 25 % des livraisons dépassent le délai prévu."],["Relier","Identifier les pratiques qui contribuent à ces retards : estimation, planification, suivi."],["Agir","Choisir des changements accessibles et des responsables identifiés."],["Mesurer","Comparer les livraisons sur plusieurs cycles, vérifier l’effet et ajuster."]],"story":"Entreprise fictive Solis : sur 10 livraisons, 4 dépassent leur date. Le comité impose un nouveau modèle de compte rendu. Trois mois plus tard, les retards sont identiques. Le document ne traitait pas les estimations irréalistes ni les dépendances mal identifiées.","lesson":"La valeur n’est pas le nombre de documents déployés, mais l’évolution vérifiable du résultat et la solidité des pratiques sous-jacentes.","question":"Une direction annonce « atteindre ML3 » comme seul objectif. Quel premier changement proposes-tu ?","choices":["Fixer un objectif de performance et relier les pratiques à ce résultat.","Rédiger trente procédures avant de consulter les équipes.","Afficher un badge ML3 dans les présentations internes."],"correct":0,"why":"Une ambition de maturité doit être soutenue par des objectifs métier, des pratiques réellement utilisées et des résultats vérifiés.","glossary":[["Capacité","Aptitude durable d’un processus à produire des résultats attendus."],["Performance","Résultat observé : qualité, délais, coûts, risque ou valeur."]]},"isExpanded":true,"en":{"title":"Why CMMI creates business value","summary":"CMMI focuses on repeatable business outcomes rather than badges.","kicker":"Why CMMI creates business value","paragraphs":["**Core idea.** CMMI focuses on repeatable business outcomes rather than badges. This distinction is critical when studying CMMI because the same word can refer to knowledge, an implemented process, or an externally assessed result. Begin by identifying which kind of claim is being made.","**Scenario.** A company introduces another reporting form while delivery delays remain unchanged. Consider what could be verified independently: what happened, who participated, what the records show and which expectations apply. An attractive chart or ambitious statement is not by itself conclusive.","**Working method.** Define a business outcome, identify weak processes, run an improvement and measure its effect. When assessing a situation, explicitly separate assumptions, observed facts, open questions and recommended actions. Think in terms of repeatability and business value.","**Common misunderstanding.** A maturity target without performance goals becomes a paperwork exercise. During preparation, use this distinction when reading question stems and interpreting whether a proposed answer concerns a person, a process, a project or an organizational unit."],"steps":[["01 · Frame","Start with a measurable business problem"],["02 · Explore","Connect performance to working practices"],["03 · Apply","Design a practical improvement"],["04 · Verify","Review impact over multiple cycles"]],"story":"**Fictional case.** A company introduces another reporting form while delivery delays remain unchanged. You must identify what can genuinely be concluded and what evidence would still be required.","lesson":"Define a business outcome, identify weak processes, run an improvement and measure its effect. An educational exercise offers practice, but cannot issue a formal certification or organizational rating.","question":"Which approach is most consistent with the lesson “Why CMMI creates business value”?","choices":["Trust the claim because someone senior approved it.","Define a business outcome, identify weak processes, run an improvement and measure its effect.","Ignore the scope and focus only on the score."],"correct":1,"why":"CMMI focuses on repeatable business outcomes rather than badges. Apply the principle to observable facts, documented reasoning and the correct assessment subject.","glossary":[["claim","A statement that must be supported before it can be treated as an established finding."],["scope","The people, activities, processes and boundaries covered by an analysis."],["corroboration","Confirming a finding through independent, consistent sources."]],"levelFr":{},"scenario":"A company introduces another reporting form while delivery delays remain unchanged.","pitfall":"A maturity target without performance goals becomes a paperwork exercise.","action":"Define a business outcome, identify weak processes, run an improvement and measure its effect."}},{"id":"F02","title":"Architecture : catégories, CA et PA","topic":"Fondations","duration":18,"summary":"Le modèle regroupe des pratiques dans des Practice Areas (PA), elles-mêmes organisées en Capability Areas (CA) et catégories.","bullets":["Une PA désigne un domaine de pratique cohérent.","Les Practice Group Levels sont progressifs à l’intérieur d’une PA.","Ne pas confondre une liste de PA avec les exigences d’une vue de maturité."],"challenge":"Pourquoi ne suffit-il pas de « cocher » 31 PA ?","answer":"La portée, la vue du modèle, les niveaux requis et les preuves de déploiement déterminent ce qui est évalué.","deep":{"kicker":"Naviguer dans l’architecture du modèle","paragraphs":["Le guide v4.0 organise le modèle du plus général au plus opérationnel. Les catégories rassemblent des Capability Areas (CA), elles-mêmes constituées de Practice Areas (PA). Chaque PA comprend des groupes de pratiques par niveau. Ce sont des niveaux de détail différents : ils ne se remplacent pas.","Exemple : « Planning » (PLAN) est une PA liée à la planification et à la gestion du travail. Elle s’insère dans une Capability Area, puis dans une catégorie. Une pratique précise explique ce qu’il faut réaliser au niveau étudié ; la seule appellation PLAN n’en donne pas la preuve.","Les domaines CMMI (Development, Services, Data, People, Security, Safety, Suppliers, Virtual et le cœur commun) permettent d’adapter les vues à des situations différentes. On n’applique pas mécaniquement l’ensemble des 31 PA à toute unité sans tenir compte de la vue et du périmètre pertinents."],"steps":[["Catégorie","Grand regroupement : faire, gérer, permettre ou améliorer."],["Capability Area","Capacité organisationnelle ciblée par plusieurs PA."],["Practice Area","Ensemble cohérent de pratiques : exemple CM, PLAN ou PQA."],["Pratiques","Activités attendues et groupes de niveau dans le modèle intégral."]],"story":"Une équipe dit « nous avons couvert les 31 PA » parce qu’elle a renseigné une ligne pour chaque sigle dans Excel. Aucun propriétaire, preuve d’exécution ou référentiel applicable n’est précisé.","lesson":"Un tableau des PA est une carte pour s’orienter ; il ne constitue ni une application des pratiques, ni une couverture officielle du périmètre.","question":"Dans « catégorie → CA → PA → pratique », quel élément est le plus précis ?","choices":["La catégorie.","La pratique.","La Capability Area."],"correct":1,"why":"La pratique est le niveau opérationnel. Le modèle complet détaille les exigences et leurs précisions, contrairement au guide résumé.","glossary":[["CA","Capability Area : capacité métier ou organisationnelle regroupant des PA."],["PA","Practice Area : ensemble cohérent de pratiques."],["Vue du modèle","Sélection appropriée à un contexte, domaine et périmètre."]]},"isExpanded":true,"en":{"title":"Model architecture: categories, capability areas and practice areas","summary":"Learn how categories, capability areas, practice areas and practices relate.","kicker":"Model architecture: categories, capability areas and practice areas","paragraphs":["**Core idea.** Learn how categories, capability areas, practice areas and practices relate. This distinction is critical when studying CMMI because the same word can refer to knowledge, an implemented process, or an externally assessed result. Begin by identifying which kind of claim is being made.","**Scenario.** A team claims full CMMI coverage because it has listed all PA acronyms in a spreadsheet. Consider what could be verified independently: what happened, who participated, what the records show and which expectations apply. An attractive chart or ambitious statement is not by itself conclusive.","**Working method.** Identify the appropriate model view and interpret the different components before gathering evidence. When assessing a situation, explicitly separate assumptions, observed facts, open questions and recommended actions. Think in terms of repeatability and business value.","**Common misunderstanding.** A list of abbreviations is not proof that applicable practices are performed. During preparation, use this distinction when reading question stems and interpreting whether a proposed answer concerns a person, a process, a project or an organizational unit."],"steps":[["01 · Frame","Identify the organizational context"],["02 · Explore","Choose the applicable model view"],["03 · Apply","Navigate category → CA → PA → practice"],["04 · Verify","Connect a practice to observed work"]],"story":"**Fictional case.** A team claims full CMMI coverage because it has listed all PA acronyms in a spreadsheet. You must identify what can genuinely be concluded and what evidence would still be required.","lesson":"Identify the appropriate model view and interpret the different components before gathering evidence. An educational exercise offers practice, but cannot issue a formal certification or organizational rating.","question":"Which approach is most consistent with the lesson “Model architecture: categories, capability areas and practice areas”?","choices":["Trust the claim because someone senior approved it.","Identify the appropriate model view and interpret the different components before gathering evidence.","Ignore the scope and focus only on the score."],"correct":1,"why":"Learn how categories, capability areas, practice areas and practices relate. Apply the principle to observable facts, documented reasoning and the correct assessment subject.","glossary":[["claim","A statement that must be supported before it can be treated as an established finding."],["scope","The people, activities, processes and boundaries covered by an analysis."],["corroboration","Confirming a finding through independent, consistent sources."]],"levelFr":{},"scenario":"A team claims full CMMI coverage because it has listed all PA acronyms in a spreadsheet.","pitfall":"A list of abbreviations is not proof that applicable practices are performed.","action":"Identify the appropriate model view and interpret the different components before gathering evidence."}},{"id":"F03","title":"Niveaux 1 à 5","topic":"Fondations","duration":18,"summary":"L’évolution va de l’initiative incomplète à l’amélioration quantitative et continue ; une organisation n’atteint pas ML3 uniquement en rédigeant des processus.","bullets":["ML1 : imprévisible ; ML2 : géré par projet.","ML3 : standards organisationnels et adaptation contrôlée.","ML4 : maîtrise quantitative ; ML5 : optimisation basée sur les résultats."],"challenge":"Une équipe utilise le standard commun, mais l’organisation n’analyse jamais son efficacité. Suffisant pour ML5 ?","answer":"Non : optimiser requiert analyse quantitative et amélioration durable.","deep":{"kicker":"Comprendre les niveaux sans confondre les échelles","paragraphs":["Il faut distinguer le niveau d’un groupe de pratiques au sein d’une PA et le niveau de maturité évalué pour une unité organisationnelle. Les groupes de pratiques progressent : les niveaux supérieurs supposent la mise en œuvre de ce qui précède. Un niveau de maturité porte, lui, sur un ensemble défini de PA et de groupes de pratiques.","En termes pédagogiques : au niveau 1 une initiative démarre, au niveau 2 le travail est piloté, au niveau 3 des processus organisationnels adaptés structurent l’exécution, au niveau 4 la maîtrise quantitative devient importante et au niveau 5 l’optimisation s’appuie sur les données.","Attention : ce raccourci ne constitue pas une méthode de notation. Une équipe exemplaire ne prouve pas seule la maturité d’une unité organisationnelle ; une grande quantité de chiffres ne constitue pas nécessairement un pilotage quantitatif fiable."],"steps":[["Niveau 1","Actions initiales, parfois incomplètes et dépendantes des personnes."],["Niveau 2","Gestion du travail, suivi d’objectifs et pratiques répétables."],["Niveau 3","Processus organisationnels standardisés, adaptés et enrichis par les projets."],["Niveaux 4–5","Décisions quantitatives et optimisation maîtrisée des processus."]],"story":"Trois équipes possèdent la même procédure de planification. Deux l’appliquent, la troisième non ; aucune ne documente les adaptations ni ne remonte ses apprentissages. Le manuel seul ne démontre pas un niveau avancé.","lesson":"La progression porte sur l’institutionnalisation des pratiques, leurs preuves et leur portée — pas seulement sur le volume documentaire.","question":"Une entreprise possède 40 KPI et publie un reporting mensuel. Peut-on en déduire ML4 ?","choices":["Oui, tout reporting chiffré prouve la maîtrise quantitative.","Non, il faut examiner méthodes quantitatives, décisions, processus et périmètre.","Oui, si les KPI sont en couleur."],"correct":1,"why":"Le niveau 4 demande davantage que des graphiques : une gestion quantitative liée aux objectifs et aux pratiques concernées.","glossary":[["PG","Practice Group : ensemble évolutif de pratiques de niveau donné."],["ML","Maturity Level : résultat d’une évaluation de maturité sur un périmètre déterminé."]]},"isExpanded":true,"en":{"title":"Maturity and practice group levels","summary":"Understand the distinction between organizational maturity ratings and progressive practice groups.","kicker":"Maturity and practice group levels","paragraphs":["**Core idea.** Understand the distinction between organizational maturity ratings and progressive practice groups. This distinction is critical when studying CMMI because the same word can refer to knowledge, an implemented process, or an externally assessed result. Begin by identifying which kind of claim is being made.","**Scenario.** Three teams share a written procedure, but one never follows it. Consider what could be verified independently: what happened, who participated, what the records show and which expectations apply. An attractive chart or ambitious statement is not by itself conclusive.","**Working method.** Check how expectations build across practice group levels and whether organizational use is consistent. When assessing a situation, explicitly separate assumptions, observed facts, open questions and recommended actions. Think in terms of repeatability and business value.","**Common misunderstanding.** Do not infer a maturity level from the existence of templates or KPIs. During preparation, use this distinction when reading question stems and interpreting whether a proposed answer concerns a person, a process, a project or an organizational unit."],"steps":[["01 · Frame","Recognize initial performance"],["02 · Explore","Identify managed work"],["03 · Apply","Evaluate organizational standardization"],["04 · Verify","Examine quantitative control and optimization"]],"story":"**Fictional case.** Three teams share a written procedure, but one never follows it. You must identify what can genuinely be concluded and what evidence would still be required.","lesson":"Check how expectations build across practice group levels and whether organizational use is consistent. An educational exercise offers practice, but cannot issue a formal certification or organizational rating.","question":"Which approach is most consistent with the lesson “Maturity and practice group levels”?","choices":["Trust the claim because someone senior approved it.","Check how expectations build across practice group levels and whether organizational use is consistent.","Ignore the scope and focus only on the score."],"correct":1,"why":"Understand the distinction between organizational maturity ratings and progressive practice groups. Apply the principle to observable facts, documented reasoning and the correct assessment subject.","glossary":[["claim","A statement that must be supported before it can be treated as an established finding."],["scope","The people, activities, processes and boundaries covered by an analysis."],["corroboration","Confirming a finding through independent, consistent sources."]],"levelFr":{},"scenario":"Three teams share a written procedure, but one never follows it.","pitfall":"Do not infer a maturity level from the existence of templates or KPIs.","action":"Check how expectations build across practice group levels and whether organizational use is consistent."}},{"id":"F04","title":"Évaluation d’entreprise ou certification ?","topic":"Fondations","duration":24,"summary":"Une appraisal porte sur une unité organisationnelle et son fonctionnement ; un examen personnel valide des connaissances.","bullets":["Appraisal : périmètre, projets, entretiens et preuves.","Certification individuelle : formation, examen et conditions propres.","Le simulateur de ce site est un outil d’entraînement, pas une évaluation officielle."],"challenge":"Peut-on déclarer ML3 parce que l’entraînement affiche 90 % ?","answer":"Non : seul un appraisal officiel peut établir une note reconnue.","deep":{"kicker":"Deux parcours, deux types de preuves, deux résultats","paragraphs":["Une certification individuelle et une évaluation d’entreprise répondent à des questions différentes. Pour une personne : « maîtrise-t-elle les notions et les compétences prévues par ce parcours de formation ? » Pour une entreprise : « les pratiques applicables sont-elles effectivement mises en œuvre dans le périmètre évalué ? »","Le parcours individuel peut demander une formation préalable, un examen et parfois une expérience spécifique. Le guide officiel d’août 2026 présente les certifications Practitioner, Professional et les parcours avancés Instructor ou Lead Appraiser, avec leurs exigences distinctes. Ces parcours ne délivrent pas à eux seuls une note de maturité à l’organisation.","Lors d’une appraisal, il faut définir une unité organisationnelle, une portée, les projets ou fonctions concernés et les règles d’évaluation applicables. L’équipe d’évaluation examine des éléments de travail, des échanges avec les acteurs et la cohérence des pratiques observées. Un résultat reconnu dépend d’un processus officiel, pas d’un score de quiz.","Dans cette plateforme, tes exercices simulent des raisonnements d’appraisal. Un score de 90 % signifie que tu réponds correctement aux questions proposées ici. Il ne signifie ni que ton entreprise est ML3, ni que tu es personnellement certifié."],"steps":[["Définir la cible","Examen personnel ou appraisal organisationnel ?"],["Définir les règles","Formation et épreuve d’un côté ; portée et méthode officielle de l’autre."],["Apporter des preuves","Connaissances évaluées ou pratiques de travail observables."],["Obtenir un résultat","Credential individuel ou résultat d’appraisal officiel."]],"story":"NovaTech a 50 développeurs. Son responsable qualité obtient 98 % sur CMMI Academy. Pourtant, deux équipes n’utilisent aucun suivi des changements, la troisième n’a pas d’archives de revues et la direction ne suit aucun objectif commun. Le niveau de connaissance du responsable ne prouve rien sur ces pratiques.","lesson":"Le score de formation appartient à la personne ; la performance et les preuves concernent l’unité organisationnelle. Aucune de ces deux dimensions ne remplace l’autre.","question":"L’entreprise veut annoncer « Nous sommes ML3 » après le succès du responsable qualité à un examen. Quel est le diagnostic ?","choices":["Annonce valable : un examen individuel suffit.","Annonce non justifiée : il faut une appraisal officielle du périmètre retenu.","Annonce valable après avoir rempli une auto-grille interne."],"correct":1,"why":"Un examen valide des connaissances individuelles ; un appraisal reconnu évalue une unité organisationnelle selon les modalités officielles.","glossary":[["Appraisal","Évaluation structurée de pratiques organisationnelles sur un périmètre défini."],["Credential","Certification individuelle assortie de conditions précises."],["Unité organisationnelle","Périmètre opérationnel dont les pratiques sont étudiées."]]},"isExpanded":true,"en":{"title":"Organizational appraisal versus personal certification","summary":"Distinguish the assessment of an organizational unit from an individual knowledge examination.","kicker":"Organizational appraisal versus personal certification","paragraphs":["**Core idea.** Distinguish the assessment of an organizational unit from an individual knowledge examination. This distinction is critical when studying CMMI because the same word can refer to knowledge, an implemented process, or an externally assessed result. Begin by identifying which kind of claim is being made.","**Scenario.** A learner scores 95% in a practice app and claims the employer has reached Maturity Level 3. Consider what could be verified independently: what happened, who participated, what the records show and which expectations apply. An attractive chart or ambitious statement is not by itself conclusive.","**Working method.** Separate the subject, eligible evidence, required process and outcome of each pathway. When assessing a situation, explicitly separate assumptions, observed facts, open questions and recommended actions. Think in terms of repeatability and business value.","**Common misunderstanding.** A quiz score cannot create a recognized organizational maturity rating. During preparation, use this distinction when reading question stems and interpreting whether a proposed answer concerns a person, a process, a project or an organizational unit."],"steps":[["01 · Frame","Identify the subject being evaluated"],["02 · Explore","Clarify the scope and prerequisites"],["03 · Apply","Distinguish knowledge from implementation evidence"],["04 · Verify","Recognize who may issue a formal rating"]],"story":"**Fictional case.** A learner scores 95% in a practice app and claims the employer has reached Maturity Level 3. You must identify what can genuinely be concluded and what evidence would still be required.","lesson":"Separate the subject, eligible evidence, required process and outcome of each pathway. An educational exercise offers practice, but cannot issue a formal certification or organizational rating.","question":"Which approach is most consistent with the lesson “Organizational appraisal versus personal certification”?","choices":["Trust the claim because someone senior approved it.","Separate the subject, eligible evidence, required process and outcome of each pathway.","Ignore the scope and focus only on the score."],"correct":1,"why":"Distinguish the assessment of an organizational unit from an individual knowledge examination. Apply the principle to observable facts, documented reasoning and the correct assessment subject.","glossary":[["claim","A statement that must be supported before it can be treated as an established finding."],["scope","The people, activities, processes and boundaries covered by an analysis."],["corroboration","Confirming a finding through independent, consistent sources."]],"levelFr":{},"scenario":"A learner scores 95% in a practice app and claims the employer has reached Maturity Level 3.","pitfall":"A quiz score cannot create a recognized organizational maturity rating.","action":"Separate the subject, eligible evidence, required process and outcome of each pathway."}},{"id":"F05","title":"Preuves : document, entretien, observation","topic":"Méthode d’audit","duration":18,"summary":"L’auditeur recoupe les affirmations avec des traces vérifiables et représentatives des activités.","bullets":["Chercher des preuves datées et représentatives des unités du périmètre.","Vérifier l’exécution réelle avec les équipes.","Distinguer « existe » de « est appliqué et utile »."],"challenge":"Une procédure jamais utilisée est-elle une preuve solide d’application ?","answer":"Non : c’est une intention documentaire, pas une démonstration de pratique déployée.","deep":{"kicker":"Ne jamais confondre document, usage et résultat","paragraphs":["Une preuve de processus peut prendre plusieurs formes complémentaires : une définition approuvée, un livrable réel daté, un enregistrement de décision, une démonstration et des explications concordantes des personnes qui travaillent au quotidien. Aucune catégorie ne doit être confondue avec une garantie universelle.","Un document prouve surtout qu’une intention a été écrite. Pour évaluer l’implantation de la pratique, on cherche les traces d’exécution : plans utilisés, versions approuvées, retours d’anomalies traitées, décisions et actions clôturées. Les entretiens permettent de comprendre si les rôles décrits correspondent à l’usage réel.","La représentativité est essentielle : deux dossiers parfaits triés sur le volet ne démontrent pas un fonctionnement cohérent sur dix équipes. Inversement, une preuve isolée insuffisante peut inviter à poursuivre les vérifications plutôt qu’à condamner une organisation."],"steps":[["Déclaration","« Nous faisons une revue chaque semaine. »"],["Document","Une procédure explique comment ces revues devraient se dérouler."],["Exécution","Comptes rendus réels, participants, décisions et suites identifiées."],["Recoupement","Entretien et vérification de l’application sur plusieurs échantillons."]],"story":"La société Ilex produit une politique qualité signée il y a trois ans. Dans quatre projets inspectés, aucune revue n’est enregistrée. Les équipes disent ne pas connaître la procédure. La politique existe, mais la mise en œuvre n’est pas démontrée.","lesson":"Toujours séparer l’existence d’un dispositif de son utilisation effective, puis rechercher des preuves convergentes et représentatives.","question":"Quelle combinaison soutient le mieux l’application d’un processus ?","choices":["Une procédure signée uniquement.","Des exemples datés sur plusieurs projets, des entretiens cohérents et des résultats.","Une promesse de mise en place au trimestre prochain."],"correct":1,"why":"Le recoupement de traces et d’entretiens aide à distinguer les intentions, les usages et leurs effets.","glossary":[["Artefact","Livrable ou trace de travail conservée."],["Triangulation","Recherche de cohérence entre plusieurs sources de preuve."]]},"isExpanded":true,"en":{"title":"Objective evidence and triangulation","summary":"Develop an evidence-based way to examine actual practices.","kicker":"Objective evidence and triangulation","paragraphs":["**Core idea.** Develop an evidence-based way to examine actual practices. This distinction is critical when studying CMMI because the same word can refer to knowledge, an implemented process, or an externally assessed result. Begin by identifying which kind of claim is being made.","**Scenario.** A manager claims reviews occur, but records and project interviews are inconsistent. Consider what could be verified independently: what happened, who participated, what the records show and which expectations apply. An attractive chart or ambitious statement is not by itself conclusive.","**Working method.** Combine artifacts, interviews and observations while considering representativeness and context. When assessing a situation, explicitly separate assumptions, observed facts, open questions and recommended actions. Think in terms of repeatability and business value.","**Common misunderstanding.** One presentation or assertion rarely supports organization-wide implementation. During preparation, use this distinction when reading question stems and interpreting whether a proposed answer concerns a person, a process, a project or an organizational unit."],"steps":[["01 · Frame","State an explicit evaluation question"],["02 · Explore","Collect artifacts and observations"],["03 · Apply","Cross-check interviews and records"],["04 · Verify","Record supported findings and open questions"]],"story":"**Fictional case.** A manager claims reviews occur, but records and project interviews are inconsistent. You must identify what can genuinely be concluded and what evidence would still be required.","lesson":"Combine artifacts, interviews and observations while considering representativeness and context. An educational exercise offers practice, but cannot issue a formal certification or organizational rating.","question":"Which approach is most consistent with the lesson “Objective evidence and triangulation”?","choices":["Trust the claim because someone senior approved it.","Combine artifacts, interviews and observations while considering representativeness and context.","Ignore the scope and focus only on the score."],"correct":1,"why":"Develop an evidence-based way to examine actual practices. Apply the principle to observable facts, documented reasoning and the correct assessment subject.","glossary":[["claim","A statement that must be supported before it can be treated as an established finding."],["scope","The people, activities, processes and boundaries covered by an analysis."],["corroboration","Confirming a finding through independent, consistent sources."]],"levelFr":{},"scenario":"A manager claims reviews occur, but records and project interviews are inconsistent.","pitfall":"One presentation or assertion rarely supports organization-wide implementation.","action":"Combine artifacts, interviews and observations while considering representativeness and context."}},{"id":"F06","title":"Portée et échantillonnage","topic":"Méthode d’audit","duration":18,"summary":"Le niveau déclaré dépend du périmètre retenu, des projets sélectionnés et du modèle applicable.","bullets":["Définir l’unité organisationnelle évaluée.","Préparer une liste représentative de projets et services.","Ne pas généraliser un seul projet exemplaire à toute l’entreprise."],"challenge":"Pourquoi l’équipe pilote ne suffit-elle pas à prouver la maturité globale ?","answer":"La diffusion dans le périmètre doit être démontrée sur un échantillon cohérent.","deep":{"kicker":"Le périmètre avant la conclusion","paragraphs":["Avant de comparer une organisation au modèle, il faut savoir exactement quelle partie est concernée : sites, équipes, types de travaux, projets et services. Le résultat d’une unité définie ne vaut pas automatiquement pour toutes les filiales d’un groupe.","L’échantillonnage permet de sélectionner des cas représentatifs selon les règles de l’appraisal applicable. On cherche des pratiques observables dans des contextes différents, avec des projets anciens et récents, des équipes plus ou moins grandes et des situations ordinaires.","Un pilote modèle peut montrer la faisabilité d’une méthode, pas son déploiement global. Une enquête bien conçue cherche les écarts entre les pratiques déclarées et celles qui s’appliquent réellement dans le périmètre."],"steps":[["Délimiter","Identifier l’unité et les activités incluses."],["Sélectionner","Choisir les projets et fonctions conformément à la méthode applicable."],["Contraster","Comparer résultats, documents et entretiens dans le périmètre."],["Conclure","Ne généraliser qu’au périmètre réellement étudié."]],"story":"Un groupe de trois agences présente un projet pilote exceptionnel de l’agence centrale. Dans les deux autres agences, les plans ne sont jamais mis à jour. Le pilote seul ne peut soutenir une conclusion pour les trois agences.","lesson":"L’appraisal produit un constat relatif à une portée définie ; l’échantillon doit permettre une conclusion défendable pour cette portée.","question":"Le projet pilote est irréprochable. Quelle suite est la plus judicieuse ?","choices":["Conclure à la maturité de toutes les équipes.","Examiner la représentativité du pilote et les autres parties du périmètre.","Retirer les projets difficiles de l’inventaire sans justification."],"correct":1,"why":"Une pratique solide isolée n’est pas une preuve de déploiement organisationnel.","glossary":[["Portée","Frontières de l’unité et des activités évaluées."],["Échantillon","Sélection d’éléments et acteurs examinés selon une méthode d’évaluation."]]},"isExpanded":true,"en":{"title":"Appraisal scope and sampling","summary":"Know why organizational boundaries and project sampling matter.","kicker":"Appraisal scope and sampling","paragraphs":["**Core idea.** Know why organizational boundaries and project sampling matter. This distinction is critical when studying CMMI because the same word can refer to knowledge, an implemented process, or an externally assessed result. Begin by identifying which kind of claim is being made.","**Scenario.** A company selects only its best-performing pilot and describes the result as company-wide. Consider what could be verified independently: what happened, who participated, what the records show and which expectations apply. An attractive chart or ambitious statement is not by itself conclusive.","**Working method.** Define the organizational unit, model view and representative work under the applicable method. When assessing a situation, explicitly separate assumptions, observed facts, open questions and recommended actions. Think in terms of repeatability and business value.","**Common misunderstanding.** An appraisal conclusion must not be generalized beyond its valid scope. During preparation, use this distinction when reading question stems and interpreting whether a proposed answer concerns a person, a process, a project or an organizational unit."],"steps":[["01 · Frame","Define organizational boundaries"],["02 · Explore","Identify work and applicable practices"],["03 · Apply","Plan a representative sample"],["04 · Verify","Disclose limitations and context"]],"story":"**Fictional case.** A company selects only its best-performing pilot and describes the result as company-wide. You must identify what can genuinely be concluded and what evidence would still be required.","lesson":"Define the organizational unit, model view and representative work under the applicable method. An educational exercise offers practice, but cannot issue a formal certification or organizational rating.","question":"Which approach is most consistent with the lesson “Appraisal scope and sampling”?","choices":["Trust the claim because someone senior approved it.","Define the organizational unit, model view and representative work under the applicable method.","Ignore the scope and focus only on the score."],"correct":1,"why":"Know why organizational boundaries and project sampling matter. Apply the principle to observable facts, documented reasoning and the correct assessment subject.","glossary":[["claim","A statement that must be supported before it can be treated as an established finding."],["scope","The people, activities, processes and boundaries covered by an analysis."],["corroboration","Confirming a finding through independent, consistent sources."]],"levelFr":{},"scenario":"A company selects only its best-performing pilot and describes the result as company-wide.","pitfall":"An appraisal conclusion must not be generalized beyond its valid scope.","action":"Define the organizational unit, model view and representative work under the applicable method."}},{"id":"F07","title":"Non-conformités et actions correctives","topic":"Méthode d’audit","duration":18,"summary":"Toute lacune doit mener à une action proportionnée et suivie jusqu’à sa vérification.","bullets":["Décrire précisément le fait observé et l’exigence concernée.","Nommer responsable, date cible et preuve attendue.","Recontrôler après correction pour éviter les fermetures artificielles."],"challenge":"Un ticket « corrigé » sans vérification suffit-il ?","answer":"Non : on attend une preuve que la correction fonctionne et reste efficace.","deep":{"kicker":"Transformer les écarts en apprentissage","paragraphs":["Un écart apparaît quand le comportement observé ne correspond pas à l’approche attendue pour le périmètre étudié. Il faut le décrire avec précision avant de lancer une correction : constat, contexte, preuve, cause possible et effet sur l’objectif de performance.","Corriger un symptôme ne garantit pas que le problème ne reviendra pas. Exemple : fermer un ticket de défaut logiciel résout parfois l’incident immédiat, mais n’empêche pas sa réapparition si la cause est un processus de validation incomplet.","Une action corrective utile a un responsable, une échéance, une vérification et, si nécessaire, une analyse de cause. L’efficacité se démontre après mise en œuvre : taux de répétition, échantillons de livrables, résultat d’un contrôle ou observation du processus."],"steps":[["Constater","Décrire un écart factuel et son impact."],["Analyser","Séparer cause apparente et cause profonde."],["Corriger","Assigner une action vérifiable avec une échéance."],["Vérifier","Mesurer la non-récurrence et ajuster si besoin."]],"story":"Une équipe corrige dix fois la même erreur de configuration en production. Chaque ticket est marqué « résolu ». Le suivi mensuel montre pourtant les mêmes erreurs : l’action corrige le résultat, pas les mécanismes de déploiement.","lesson":"La clôture administrative n’équivaut pas à une efficacité démontrée. La boucle de vérification est indispensable.","question":"Quand une action corrective peut-elle être considérée comme efficace ?","choices":["Lorsqu’un responsable dit qu’elle est terminée.","Quand son effet a été vérifié selon des critères appropriés.","Dès qu’une réunion a eu lieu."],"correct":1,"why":"Une action appliquée doit encore être évaluée ; sinon elle peut simplement déplacer ou masquer l’écart.","glossary":[["Écart","Différence entre l’état observé et une attente déterminée."],["Action corrective","Action destinée à éliminer la cause d’un problème identifié."]]},"isExpanded":true,"en":{"title":"Findings, corrective action and verification","summary":"Turn a justified finding into a sustained improvement.","kicker":"Findings, corrective action and verification","paragraphs":["**Core idea.** Turn a justified finding into a sustained improvement. This distinction is critical when studying CMMI because the same word can refer to knowledge, an implemented process, or an externally assessed result. Begin by identifying which kind of claim is being made.","**Scenario.** A gap is closed in a tracking tool without demonstrating any effective corrective change. Consider what could be verified independently: what happened, who participated, what the records show and which expectations apply. An attractive chart or ambitious statement is not by itself conclusive.","**Working method.** Describe the finding, investigate its causes, implement an action and recheck its effectiveness. When assessing a situation, explicitly separate assumptions, observed facts, open questions and recommended actions. Think in terms of repeatability and business value.","**Common misunderstanding.** Ticket closure is not the same as verified remediation. During preparation, use this distinction when reading question stems and interpreting whether a proposed answer concerns a person, a process, a project or an organizational unit."],"steps":[["01 · Frame","State the observed deviation"],["02 · Explore","Analyze root causes and impact"],["03 · Apply","Implement proportionate corrections"],["04 · Verify","Verify the action in real work"]],"story":"**Fictional case.** A gap is closed in a tracking tool without demonstrating any effective corrective change. You must identify what can genuinely be concluded and what evidence would still be required.","lesson":"Describe the finding, investigate its causes, implement an action and recheck its effectiveness. An educational exercise offers practice, but cannot issue a formal certification or organizational rating.","question":"Which approach is most consistent with the lesson “Findings, corrective action and verification”?","choices":["Trust the claim because someone senior approved it.","Describe the finding, investigate its causes, implement an action and recheck its effectiveness.","Ignore the scope and focus only on the score."],"correct":1,"why":"Turn a justified finding into a sustained improvement. Apply the principle to observable facts, documented reasoning and the correct assessment subject.","glossary":[["claim","A statement that must be supported before it can be treated as an established finding."],["scope","The people, activities, processes and boundaries covered by an analysis."],["corroboration","Confirming a finding through independent, consistent sources."]],"levelFr":{},"scenario":"A gap is closed in a tracking tool without demonstrating any effective corrective change.","pitfall":"Ticket closure is not the same as verified remediation.","action":"Describe the finding, investigate its causes, implement an action and recheck its effectiveness."}},{"id":"F08","title":"Statistiques et haut niveau de maturité","topic":"Maturité avancée","duration":18,"summary":"La maîtrise quantitative nécessite des définitions opérationnelles fiables, des données et des analyses capables d’orienter des décisions.","bullets":["Distinguer simple reporting et analyse statistique.","Utiliser des baselines et objectifs de qualité et de performance.","Mesurer l’effet des améliorations sur les résultats métier."],"challenge":"Dix graphiques de vélocité suffisent-ils à prouver ML4 ?","answer":"Non : le contrôle quantitatif exige des méthodes adaptées aux objectifs et une interprétation exploitable.","deep":{"kicker":"Des mesures, puis des décisions quantitatives fiables","paragraphs":["Un tableau de bord décrit des résultats ; une démarche quantitative cherche à comprendre, prévoir et piloter des performances à partir de mesures définies. Les objectifs de qualité et de performance doivent guider les choix d’indicateurs et de méthodes.","Il faut distinguer un changement réel d’un changement de définition. Si une entreprise retire des incidents de son calcul, la baisse apparente ne prouve aucune amélioration. Les données doivent être comparables, interprétables et reliées au contexte de production.","À haut niveau de maturité, les techniques statistiques et quantitatives jouent un rôle important dans la gestion et l’optimisation des processus pertinents. La maîtrise quantitative ne se déduit pas du simple nombre de graphiques, ni de l’emploi d’un logiciel de reporting."],"steps":[["Objectif","Réduire l’incertitude sur les délais de livraison."],["Mesures fiables","Définir la durée, la population et les règles de collecte."],["Analyse","Observer tendances, variation et capacité de prévision selon des méthodes adaptées."],["Décision","Ajuster un processus puis vérifier l’impact sur l’objectif."]],"story":"Une direction annonce une baisse de 40 % du temps de résolution. En réalité, les incidents complexes ont été exclus de la métrique. Le reporting est séduisant, mais il ne permet pas une conclusion fiable sur l’amélioration.","lesson":"Il faut pouvoir expliquer d’où viennent les mesures, pourquoi elles sont comparables et quelle décision elles permettent.","question":"Quel élément distingue le mieux un pilotage quantitatif d’un reporting décoratif ?","choices":["Des tableaux colorés mis à jour chaque heure.","Des mesures définies, des analyses adaptées et des décisions reliées à des objectifs.","Au moins trente indicateurs quelle que soit leur utilité."],"correct":1,"why":"Des méthodes quantitatives pertinentes servent à comprendre et améliorer des processus au regard d’objectifs de performance.","glossary":[["Baseline de performance","Base de référence issue de données comparables."],["QPPO","Objectif de qualité et de performance des processus."]]},"isExpanded":true,"en":{"title":"Quantitative management and high maturity","summary":"Recognize what makes quantitative process management more than reporting.","kicker":"Quantitative management and high maturity","paragraphs":["**Core idea.** Recognize what makes quantitative process management more than reporting. This distinction is critical when studying CMMI because the same word can refer to knowledge, an implemented process, or an externally assessed result. Begin by identifying which kind of claim is being made.","**Scenario.** An organization shows dozens of charts but cannot explain sources, variation or decisions. Consider what could be verified independently: what happened, who participated, what the records show and which expectations apply. An attractive chart or ambitious statement is not by itself conclusive.","**Working method.** Define measurable objectives, ensure data quality, analyze variation and use results to guide improvement. When assessing a situation, explicitly separate assumptions, observed facts, open questions and recommended actions. Think in terms of repeatability and business value.","**Common misunderstanding.** Having many KPIs alone does not establish high maturity. During preparation, use this distinction when reading question stems and interpreting whether a proposed answer concerns a person, a process, a project or an organizational unit."],"steps":[["01 · Frame","Set quality and performance objectives"],["02 · Explore","Build reliable operational definitions"],["03 · Apply","Analyze stability and variation"],["04 · Verify","Select and evaluate process improvements"]],"story":"**Fictional case.** An organization shows dozens of charts but cannot explain sources, variation or decisions. You must identify what can genuinely be concluded and what evidence would still be required.","lesson":"Define measurable objectives, ensure data quality, analyze variation and use results to guide improvement. An educational exercise offers practice, but cannot issue a formal certification or organizational rating.","question":"Which approach is most consistent with the lesson “Quantitative management and high maturity”?","choices":["Trust the claim because someone senior approved it.","Define measurable objectives, ensure data quality, analyze variation and use results to guide improvement.","Ignore the scope and focus only on the score."],"correct":1,"why":"Recognize what makes quantitative process management more than reporting. Apply the principle to observable facts, documented reasoning and the correct assessment subject.","glossary":[["claim","A statement that must be supported before it can be treated as an established finding."],["scope","The people, activities, processes and boundaries covered by an analysis."],["corroboration","Confirming a finding through independent, consistent sources."]],"levelFr":{},"scenario":"An organization shows dozens of charts but cannot explain sources, variation or decisions.","pitfall":"Having many KPIs alone does not establish high maturity.","action":"Define measurable objectives, ensure data quality, analyze variation and use results to guide improvement."}},{"id":"F09","title":"L’examen Practitioner : format officiel 2026","topic":"Fondations","duration":30,"summary":"Comprendre le format de 120 questions en 4 heures, la pondération des domaines, la formation préalable et les règles de l’examen.","bullets":["120 questions à choix multiple et 4 heures ; domaines pondérés.","Une formation Building Organizational Capability est un prérequis au Practitioner.","Aucun examen blanc indépendant ne garantit la réussite de l’examen réel."],"challenge":"Pourquoi réviser 90 % de questions sur des PA Development serait un mauvais plan de préparation ?","answer":"Le référentiel d’examen 2026 attribue 50 % à Core + Virtual, et 15 % à Development ; un entraînement non pondéré peut laisser des lacunes majeures.","deep":{"kicker":"Planifier ta préparation à partir du programme officiel","paragraphs":["**Ce qui est officiellement connu.** Le guide CMMI Credentialing Guide for Practitioners, publié en août 2026, indique un examen Practitioner composé de 120 questions à choix multiple pour une durée de quatre heures. La préparation porte sur le modèle, ses composants, les Practice Areas, les pratiques, leurs objectifs et la valeur des appraisals. Il s’agit d’un cadre officiel connu au moment de cette révision ; les conditions de 2027 devront être recontrôlées.","**Les domaines ne se valent pas en volume.** Core et Virtual représentent 50 % du sujet ; Development 15 % ; Services 15 % ; Security et Safety 5 % ; Suppliers 5 % ; Data 5 % ; People 5 %. Étudier uniquement la PA de ton métier ne couvre donc pas l’examen : les pratiques Core s’appliquent aussi dans plusieurs contextes métier.","**Conditions et déroulement.** La formation Building Organizational Capability précède l’éligibilité au Practitioner. Le guide 2026 décrit un examen non surveillé avec accès au modèle sous licence et aux notes personnelles selon les règles applicables ; l’accès à d’autres ressources en ligne et à l’IA pendant l’épreuve est interdit. Ne confonds pas « open model » et « Internet libre ».","**Préparation efficace.** Apprends d’abord les concepts anglais, entraîne-toi au rappel actif, révise tes erreurs, puis simule des questions à plusieurs degrés de difficulté. Le guide fournit des questions d’exemple officielles, mais les anciens sujets complets ne sont pas publiés. Une application indépendante ne peut ni certifier une personne, ni délivrer un résultat officiel."],"steps":[["01 · Comprendre","Lire les objectifs, la structure du modèle et les règles de l’examen."],["02 · Planifier","Répartir son temps selon le blueprint : 50/15/15/5/5/5/5."],["03 · S’exercer","Travailler les questions en anglais en alternant rappel et applications."],["04 · Vérifier","Passer un examen simulé de 120 questions en 240 minutes, puis analyser les lacunes."]],"story":"Une candidate révise exclusivement les domaines Development et utilise des simulateurs de 20 questions sans chronomètre. Lorsqu’elle voit la répartition officielle, elle réalise qu’elle a très peu étudié les pratiques Core et le vocabulaire des appraisals.","lesson":"Pour couvrir le programme, construire un plan fondé sur les sept sections officielles, avec des contrôles réguliers de compréhension, des séances en anglais et un entraînement long. La formation officielle requise ne peut pas être remplacée par cette plateforme.","question":"Quelle méthode correspond le mieux à la préparation du Practitioner selon le guide de 2026 ?","choices":["Se concentrer sur un seul domaine et compter sur l’intuition.","Réviser l’ensemble du programme, vérifier les conditions officielles et s’entraîner sur des questions en anglais.","Supposer que 70 % est le score officiel minimum annoncé."],"correct":1,"why":"Le guide publie une répartition et des modalités de préparation, mais ne publie pas de seuil universel de réussite. Le candidat doit remplir les prérequis et apprendre l’ensemble du programme.","glossary":[["Blueprint","Répartition des compétences et domaines d’un examen."],["Open-model examination","Examen autorisant une consultation encadrée du modèle sous licence."],["Prerequisite","Condition à satisfaire avant une étape de certification."]]},"isExpanded":true,"en":{"title":"CMMI Practitioner exam: 2026 format and preparation","summary":"Understand the 120-question, four-hour exam, weighted domains, training prerequisite and exam rules.","kicker":"Align practice with the official exam content areas","paragraphs":["**Published 2026 format.** The official CMMI Credentialing Guide for Practitioners describes 120 multiple-choice questions and a four-hour session. The scope includes model components, Practice Areas, practices, business value and the purpose of an appraisal. Confirm any changes before sitting an exam in 2027.","**Content weights.** Core and Virtual make up 50% of the content. Development represents 15% and Services 15%. Security and Safety, Suppliers, Data and People contribute 5% each. Focusing exclusively on the domain you use at work will not prepare you for this distribution.","**Prerequisites and permitted resources.** Building Organizational Capability is required before the Practitioner examination. The published 2026 guide describes the exam as non-proctored and open-model: access to your licensed model and personal course notes is allowed, but other online sources, assistance and generative AI are prohibited while taking the official exam. Always consult current rules.","**Build readiness.** Use retrieval practice, review errors with explanations, revisit confusing distinctions, and take timed simulations in English. The guide contains an official sample set, but it is intended as familiarization, not a set of past exam papers or a guarantee of readiness."],"steps":[["01 · Review","Read the applicable content outline and official exam rules."],["02 · Allocate","Split study time across the seven weighted content areas."],["03 · Practise","Use English vocabulary, example scenarios and retrieval practice."],["04 · Measure","Attempt a 120-question, four-hour mock session and study the gaps."]],"story":"**Case file.** A candidate studies only Development topics and regularly passes untimed 20-question quizzes. The official content weights show that this approach neglects most Core and Virtual knowledge.","lesson":"A robust plan balances all official content areas, includes the mandatory training, and distinguishes independently authored simulations from official assessment material.","question":"Which approach best follows the published Practitioner exam information?","choices":["Study only the domain used in your current role.","Study the weighted content areas, meet the prerequisite and rehearse the format in English.","Treat a practice-test score as a formal certification."],"correct":1,"why":"The official guide describes the prerequisites, content weights and exam format, but no practice app can issue an ISACA/CMMI Institute credential.","glossary":[["Exam content outline","A specification of the knowledge areas assessed by an exam."],["Open-model examination","A supervised or unsupervised test format permitting only specific model resources as described by the current rules."],["Prerequisite","A condition that must be fulfilled before examination eligibility."]],"levelFr":{}}}],"cases":[{"id":"C01","title":"Le document fantôme","topic":"Audit de processus","description":"Une politique qualité de 2024 est signée mais aucun projet ne peut citer son usage.","rating":"Preuve insuffisante","action":"Documenter un écart et rechercher des traces d’application.","reason":"La publication prouve l’existence, pas l’implémentation.","en":{"title":"The ghost policy","description":"A quality policy is signed but none of the reviewed projects can explain when it is used.","action":"Record the gap and seek dated evidence that the process is applied.","reason":"Interpret the case using corroborated, relevant evidence. A single record can be strong for a sampled activity without proving the whole organizational unit is consistently covered."}},{"id":"C02","title":"Le projet vedette","topic":"Échantillonnage","description":"Un projet exemplaire utilise tous les processus, les huit autres ignorent le référentiel.","rating":"Preuve insuffisante","action":"Élargir l’échantillon et vérifier le déploiement organisationnel.","reason":"La bonne pratique isolée ne démontre pas une capacité stable à l’échelle du périmètre.","en":{"title":"The showcase project","description":"One excellent project follows procedures while eight comparable projects do not.","action":"Expand sampling and investigate organizational deployment.","reason":"Interpret the case using corroborated, relevant evidence. A single record can be strong for a sampled activity without proving the whole organizational unit is consistently covered."}},{"id":"C03","title":"Les chiffres maquillés","topic":"Mesure","description":"Le taux de défauts annoncé diminue parce que l’équipe a changé discrètement sa définition.","rating":"Preuve insuffisante","action":"Vérifier définitions opérationnelles et comparabilité historique.","reason":"Une mesure sans définition stable ne permet pas de conclure.","en":{"title":"Unreliable improvement numbers","description":"The defect rate appears lower only because its definition changed without disclosure.","action":"Review the operational definitions and historical comparability.","reason":"Interpret the case using corroborated, relevant evidence. A single record can be strong for a sampled activity without proving the whole organizational unit is consistently covered."}},{"id":"C04","title":"Le risque orphelin","topic":"Risques","description":"Le registre contient 40 risques sans propriétaires, dates ni traitement.","rating":"Preuve partielle","action":"Attribuer, prioriser et suivre les réponses avec preuves.","reason":"La présence d’un tableau ne démontre pas la maîtrise.","en":{"title":"Risks without owners","description":"Forty risks are logged without responsible people, actions or review dates.","action":"Assign owners, prioritize exposure and review responses.","reason":"Interpret the case using corroborated, relevant evidence. A single record can be strong for a sampled activity without proving the whole organizational unit is consistently covered."}},{"id":"C05","title":"La décision orale","topic":"Décisions","description":"Une architecture coûteuse a été choisie sans comparaison documentée.","rating":"Preuve insuffisante","action":"Établir critères, alternatives et justification du choix.","reason":"La traçabilité des décisions réduit les biais et favorise l’apprentissage.","en":{"title":"Undocumented decision","description":"A costly architecture is selected without recorded alternatives or decision criteria.","action":"Establish alternatives, criteria and the rationale for selection.","reason":"Interpret the case using corroborated, relevant evidence. A single record can be strong for a sampled activity without proving the whole organizational unit is consistently covered."}},{"id":"C06","title":"Les rétros sans suite","topic":"Amélioration","description":"Chaque sprint donne dix actions d’amélioration mais aucune n’est suivie.","rating":"Preuve partielle","action":"Relier chaque action à un responsable et à une vérification de résultat.","reason":"Une intention répétée n’est pas une amélioration vérifiée.","en":{"title":"Actions nobody follows","description":"Each retrospective creates action items; none are assigned or revisited.","action":"Track action owners and effectiveness checks.","reason":"Interpret the case using corroborated, relevant evidence. A single record can be strong for a sampled activity without proving the whole organizational unit is consistently covered."}},{"id":"C07","title":"Le fournisseur invisible","topic":"Fournisseurs","description":"Le contrat existe mais aucune revue de performance ni réception n’est faite.","rating":"Preuve partielle","action":"Définir les critères d’acceptation et les revues régulières.","reason":"L’accord doit aussi être effectivement piloté.","en":{"title":"Unmanaged supplier","description":"A contract exists, but deliveries are never formally accepted or reviewed.","action":"Agree acceptance criteria and monitor supplier performance.","reason":"Interpret the case using corroborated, relevant evidence. A single record can be strong for a sampled activity without proving the whole organizational unit is consistently covered."}},{"id":"C08","title":"Le plan de secours","topic":"Continuité","description":"La cellule de crise possède un plan de reprise jamais testé.","rating":"Preuve partielle","action":"Planifier un exercice et documenter les leçons apprises.","reason":"Tester la capacité de reprise compte autant que rédiger le plan.","en":{"title":"An untested recovery plan","description":"A continuity plan exists but has never been tested with the critical operation.","action":"Run a rehearsal and record problems and corrective improvements.","reason":"Interpret the case using corroborated, relevant evidence. A single record can be strong for a sampled activity without proving the whole organizational unit is consistently covered."}},{"id":"C09","title":"La baseline perdue","topic":"Configuration","description":"Impossible d’expliquer quelle version a été remise au client.","rating":"Preuve insuffisante","action":"Reconstituer et sécuriser l’identification des éléments livrés.","reason":"La gestion de configuration porte sur l’intégrité des livrables.","en":{"title":"Lost release baseline","description":"The project team cannot identify which controlled version was provided to the customer.","action":"Reconstruct delivery configuration and institute configuration controls.","reason":"Interpret the case using corroborated, relevant evidence. A single record can be strong for a sampled activity without proving the whole organizational unit is consistently covered."}},{"id":"C10","title":"Les compétences fantômes","topic":"Personnes","description":"Les employés ont assisté à une formation mais échouent à utiliser la procédure.","rating":
