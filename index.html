</style></head><body><div id="root"></div><script>window.CMMI_DATA={"version":"4.0","basis":"Quick Reference Guide CMMI v4.0 (2026) ; Adoption Guide Credentials (2024, historique)","areas":[{"id":"CAR","title":"Analyse causale et résolution","domain":"CORE","page":6,"goal":"Comprendre pourquoi un résultat survient, agir sur ses causes puis mesurer l'effet.","evidence":"Analyses de causes, décisions d'action, retours d'expérience, suivi des récidives.","pitfall":"S'arrêter au symptôme ou attribuer les problèmes à des personnes.","scenario":"Trois incidents similaires reviennent après chaque livraison.","response":"Rechercher les causes communes, formaliser l'action préventive et vérifier son efficacité.","symptom":"Défauts répétitifs malgré la correction de tickets","expected":"Analyse causale et prévention documentée","domainName":"Fondamentaux","lesson":["Pourquoi : Comprendre pourquoi un résultat survient, agir sur ses causes puis mesurer l'effet.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Analyses de causes, décisions d'action, retours d'expérience, suivi des récidives.","Erreur fréquente : S'arrêter au symptôme ou attribuer les problèmes à des personnes.","Situation pratique : Trois incidents similaires reviennent après chaque livraison. Réponse attendue : Rechercher les causes communes, formaliser l'action préventive et vérifier son efficacité."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces.","3":"La pratique s’appuie sur un standard organisationnel adapté et capitalisé.","4":"Le pilotage s’appuie sur des techniques quantitatives appropriées.","5":"Les techniques quantitatives orientent l’optimisation continue."},"officialPracticeCount":11,"source":"Guide CMMI v4.0 (2026), p. 6","deep":{"kicker":"Apprendre à faire vivre analyse causale et résolution dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — défauts répétitifs malgré la correction de tickets — elle doit aller au-delà des intentions. Cette Practice Area aide à comprendre pourquoi un résultat survient, agir sur ses causes puis mesurer l'effet.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA CAR n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour CAR, on attend notamment des traces telles que : analyses de causes, décisions d'action, retours d'expérience, suivi des récidives.","**La distinction importante.** Un risque typique serait de s'arrêter au symptôme ou attribuer les problèmes à des personnes. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Sélectionner le problème récurrent"],["02 · Organiser","Chercher les causes corroborées"],["03 · Appliquer","Tester et documenter les actions"],["04 · Vérifier","Mesurer la baisse de récurrence"]],"story":"**Mission terrain.** Trois incidents similaires reviennent après chaque livraison. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Rechercher les causes communes, formaliser l'action préventive et vérifier son efficacité. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Trois incidents similaires reviennent après chaque livraison. » Quelle réponse est la plus défendable ?","choices":["Rechercher les causes communes, formaliser l'action préventive et vérifier son efficacité.","Faire signer une nouvelle procédure sans vérifier son utilisation.","S'arrêter au symptôme ou attribuer les problèmes à des personnes."],"correct":0,"why":"La bonne décision répond au problème constaté : Rechercher les causes communes, formaliser l'action préventive et vérifier son efficacité. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["CAR","Analyse causale et résolution"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Analyse causale et prévention documentée","Traces d'exécution : Analyses de causes, décisions d'action, retours d'expérience, suivi des récidives.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":6,"evidenceContrast":["Une analyse relie trois incidents à la même erreur de contrôle, puis la fréquence baisse après modification du pipeline.","Une liste de bugs corrigés n’identifie pas de cause commune."],"levelFr":{"1":"Choisir les résultats problématiques et commencer à traiter leurs causes","2":"Sélectionner les résultats à analyser et engager les réponses aux causes","3":"Adopter une méthode organisationnelle d’analyse, consigner les actions et partager les pistes d’amélioration","4":"Utiliser la statistique pour examiner les causes et les effets des actions","5":"Optimiser les solutions et processus à l’échelle de l’organisation à l’aide d’analyses quantitatives"}},"duration":25,"isExpanded":true,"en":{"title":"Causal Analysis and Resolution","summary":"Identify why selected results occur and prevent unwanted recurrence","kicker":"From process intent to verifiable outcomes: Causal Analysis and Resolution","paragraphs":["**The business problem.** Identify why selected results occur and prevent unwanted recurrence. In a realistic organization, this means deciding which outcomes must improve and which people or teams are responsible. The goal is not to produce paperwork for an auditor: it is to make the activity reliable when circumstances change.","**A concrete example.** Recurring defects keep returning after releases. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** Analyze a representative sample, test potential causes, implement a preventive change, and track recurrence. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for cause analysis records, action log, trend chart. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** treating symptoms instead of finding verified underlying causes."],"steps":[["01 · Define","Select a recurring outcome"],["02 · Prepare","Gather facts and validate root causes"],["03 · Perform","Implement a measurable preventive action"],["04 · Review","Review recurrence trends and effectiveness"]],"story":"**Case file — fictional organization.** Recurring defects keep returning after releases. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to analyze a representative sample, test potential causes, implement a preventive change, and track recurrence. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the CAR problem described in the case?","choices":["Document the intention without changing how the team works.","Analyze a representative sample, test potential causes, implement a preventive change, and track recurrence","Declare full maturity because the process has an owner."],"correct":1,"why":"Causal Analysis and Resolution requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["root cause","An underlying contributor that explains why a result occurs"],["recurrence","The reappearance of a similar unwanted result"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual CAR process.","Dated artifacts show the practice performed: Cause analysis records, action log, trend chart.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous cause analysis records, action log, trend chart tied to real work.","Weaker: treating symptoms instead of finding verified underlying causes; no trace of consistent use."],"levelFr":{"1":"Begin addressing causal analysis and resolution, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable causal analysis and resolution work. For example: Gather facts and validate root causes; implement a measurable preventive action.","3":"Use a shared organizational approach to causal analysis and resolution; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets.","4":"Apply suitable quantitative or statistical methods to understand and control performance of causal analysis and resolution activities.","5":"Use statistically supported learning to optimize causal analysis and resolution practices across the organizational unit."},"scenario":"Recurring defects keep returning after releases","pitfall":"Treating symptoms instead of finding verified underlying causes","action":"Analyze a representative sample, test potential causes, implement a preventive change, and track recurrence","evidence":"Cause analysis records, action log, trend chart"}},{"id":"CM","title":"Gestion de configuration","domain":"CORE","page":7,"goal":"Conserver l'intégrité des livrables, versions et modifications autorisées.","evidence":"Inventaire des éléments, versions de référence, approbations de changement, audits de configuration.","pitfall":"Confondre dépôt Git et gestion complète des configurations.","scenario":"Une version publiée contient une dépendance non approuvée.","response":"Identifier la baseline concernée, tracer le changement et vérifier la conformité de la livraison.","symptom":"Livraisons non reproductibles","expected":"Baseline approuvée et historique des modifications","domainName":"Fondamentaux","lesson":["Pourquoi : Conserver l'intégrité des livrables, versions et modifications autorisées.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Inventaire des éléments, versions de référence, approbations de changement, audits de configuration.","Erreur fréquente : Confondre dépôt Git et gestion complète des configurations.","Situation pratique : Une version publiée contient une dépendance non approuvée. Réponse attendue : Identifier la baseline concernée, tracer le changement et vérifier la conformité de la livraison."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces."},"officialPracticeCount":7,"source":"Guide CMMI v4.0 (2026), p. 7","deep":{"kicker":"Apprendre à faire vivre gestion de configuration dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — livraisons non reproductibles — elle doit aller au-delà des intentions. Cette Practice Area aide à conserver l'intégrité des livrables, versions et modifications autorisées.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA CM n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour CM, on attend notamment des traces telles que : inventaire des éléments, versions de référence, approbations de changement, audits de configuration.","**La distinction importante.** Un risque typique serait de confondre dépôt Git et gestion complète des configurations. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Identifier les éléments à maîtriser"],["02 · Organiser","Créer une baseline approuvée"],["03 · Appliquer","Contrôler les demandes de modification"],["04 · Vérifier","Auditer la configuration livrée"]],"story":"**Mission terrain.** Une version publiée contient une dépendance non approuvée. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Identifier la baseline concernée, tra ent to verifiable outcomes: Configuration Management","paragraphs":["**The business problem.** Maintain the integrity and traceability of controlled work products. In a realistic organization, this means deciding which outcomes must improve and which people or teams are responsible. The goal is not to produce paperwork for an auditor: it is to make the activity reliable when circumstances change.","**A concrete example.** An unapproved library version reaches production. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** Identify controlled items, establish an approved baseline, review change requests and audit releases. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for baseline register, approved change records, configuration audit. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** assuming a Git repository alone guarantees configuration integrity."],"steps":[["01 · Define","Identify controlled items and owners"],["02 · Prepare","Establish reviewed baselines"],["03 · Perform","Authorize and trace change requests"],["04 · Review","Audit delivered configurations"]],"story":"**Case file — fictional organization.** An unapproved library version reaches production. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to identify controlled items, establish an approved baseline, review change requests and audit releases. The conclusion must be limited to what the evidence actually establishes. ent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous data catalog, ownership matrix, retention rules tied to real work.","Weaker: keeping data without owners, metadata or governance; no trace of consistent use."],"levelFr":{"1":"Begin addressing data management, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable data management work. For example: Define architecture and metadata; control data lifecycle activities.","3":"Use a shared organizational approach to data management; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets."},"scenario":"Two departments define the same metric differently","pitfall":"Keeping data without owners, metadata or governance","action":"Agree on data definitions, designate stewards, implement lifecycle rules and review compliance","evidence":"Data catalog, ownership matrix, retention rules"}},{"id":"DQ","title":"Qualité des données","domain":"DATA","page":8,"goal":"Contrôler la fiabilité, la précision et l'aptitude des données à leur usage.","evidence":"Règles de qualité, résultats de contrôles, anomalies, opérations de nettoyage et mesure des progrès.","pitfall":"Croire que plus de données signifie automatiquement de meilleures décisions.","scenario":"Un tableau de bord inclut des doublons et des valeurs obsolètes.","response":"Définir des seuils de qualité, nettoyer les données et contrôler la récurrence.","symptom":"Décisions fondées sur des données incohérentes","expected":"Critères de qualité et rapport de contrôles","domainName":"Données","lesson":["Pourquoi : Contrôler la fiabilité, la précision et l'aptitude des données à leur usage.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Règles de qualité, résultats de contrôles, anomalies, opérations de nettoyage teps":[["01 · Cadrer","Définir les critères de qualité"],["02 · Organiser","Mesurer erreurs et doublons"],["03 · Appliquer","Nettoyer et traiter les causes"],["04 · Vérifier","Contrôler l’évolution de la qualité"]],"story":"**Mission terrain.** Un tableau de bord inclut des doublons et des valeurs obsolètes. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Définir des seuils de qualité, nettoyer les données et contrôler la récurrence. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Un tableau de bord inclut des doublons et des valeurs obsolètes. » Quelle réponse est la plus défendable ?","choices":["Définir des seuils de qualité, nettoyer les données et contrôler la récurrence.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Croire que plus de données signifie automatiquement de meilleures décisions."],"correct":0,"why":"La bonne décision répond au problème constaté : Définir des seuils de qualité, nettoyer les données et contrôler la récurrence. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["DQ","Qualité des données"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Critères de qualité et rapport de contrôles","Traces d'exécution : Règles de qualité, résultats de contrôles, anomalies, opérations de nettoyage et mesure des progrès.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":8,"evidenceContrast":["Les doublons sont mesurés chaque semaine, nettoyés et les règles sont ajustées après analyse.","La correction ponctuelle d’un fichier ne maintient pas la qualité."],"levelFr":{"1":"Identifier des critères de qualité et effectuer des nettoyages","2":"Définir des règles de nettoyage et suivre une méthode documentée de qualité","3":"Évaluer la qualité par une approche organisationnelle et améliorer les résultats"}},"duration":25,"isExpanded":true,"en":{"title":"Data Quality","summary":"Make data sufficiently accurate, complete and fit for its intended use","kicker":"From process intent to verifiable outcomes: Data Quality","paragraphs":["**The business problem.** Make data sufficiently accurate, complete and fit for its intended use. In a realistic organization, this means deciding which outcomes must improve and which people or teams are responsible. The goal is not to produce paperwork for an auditor: it is to make the activity reliable when circumstances change.","**A concrete example.** A KPI dashboard includes duplicates and obsolete records. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** Define quality dimensions and acceptance criteria, cleanse records and monitor defects over time. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for quality rules, validation reports, cleansing log. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** measuring volume rather than suitability of data."],"steps":[["01 · Define","Define quality requirements"],["02 · Prepare","Assess data against criteria"],["03 · Perform","Resolve duplicates and defects"],["04 · Review","Monitor quality and refine controls"]],"story":"**Case file — fictional organization.** A KPI dashboard includes duplicates and obsolete records. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to define quality dimensions and acceptance criteria, cleanse records and monitor defects over time. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the DQ problem described in the case?","choices":["Document the intention without changing how the team works.","Define quality dimensions and acceptance criteria, cleanse records and monitor defects over time","Declare full maturity because the process has an owner."],"correct":1,"why":"Data Quality requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["data cleansing","Correcting or removing data that fails defined quality rules"],["fitness for use","Whether data quality supports the specific decision or purpose"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual DQ process.","Dated artifacts show the practice performed: Quality rules, validation reports, cleansing log.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous quality rules, validation reports, cleansing log tied to real work.","Weaker: measuring volume rather than suitability of data; no trace of consistent use."],"levelFr":{"1":"Begin addressing data quality, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable data quality work. For example: Assess data against criteria; resolve duplicates and defects.","3":"Use a shared organizational approach to data quality; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets."},"scenario":"A KPI dashboard includes duplicates and obsolete records","pitfall":"Measuring volume rather than suitability of data","action":"Define quality dimensions and acceptance criteria, cleanse records and monitor defects over time","evidence":"Quality rules, validation reports, cleansing log"}},{"id":"DAR","title":"Analyse et résolution des décisions","domain":"CORE","page":9,"goal":"Choisir entre des alternatives selon des critères explicites et tracés.","evidence":"Critères pondérés, alternatives, procès-verbaux de décision, analyses comparatives.","pitfall":"Choisir une solution avant d'avoir défini les critères.","scenario":"Le directeur choisit un fournisseur uniquement sur intuition.","response":"Comparer des options sur des critères validés et documenter le choix.","symptom":"Choix majeurs sans justification objective","expected":"Matrice de décision et comparaison des alternatives","domainName":"Fondamentaux","lesson":["Pourquoi : Choisir entre des alternatives selon des critères explicites et tracés.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Critères pondérés, alternatives, procès-verbaux de décision, analyses comparatives.","Erreur fréquente : Choisir une solution avant d'avoir défini les critères.","Situation pratique : Le directeur choisit un fournisseur uniquement sur intuition. Réponse attendue : Comparer des options sur des critères validés et documenter le choix."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces.","3":"La pratique s’appuie sur un standard organisationnel adapté et capitalisé."},"officialPracticeCount":8,"source":"Guide CMMI v4.0 (2026), p. 9","deep":{"kicker":"Apprendre à faire vivre analyse et résolution des décisions dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — choix majeurs sans justification objective — elle doit aller au-delà des intentions. Cette Practice Area aide à choisir entre des alternatives selon des critères explicites et tracés.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA DAR n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour DAR, on attend notamment des traces telles que : critères pondérés, alternatives, procès-verbaux de décision, analyses comparatives.","**La distinction importante.** Un risque typique serait de choisir une solution avant d'avoir défini les critères. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Énoncer la décision à prendre"],["02 · Organiser","Définir critères et alternatives"],["03 · Appliquer","Comparer et arbitrer explicitement"],["04 · Vérifier","Consigner le choix et ses motifs"]],"story":"**Mission terrain.** Le directeur choisit un fournisseur uniquement sur intuition. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Comparer des options sur des critères validés et documenter le choix. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Le directeur choisit un fournisseur uniquement sur intuition. » Quelle réponse est la plus défendable ?","choices":["Comparer des options sur des critères validés et documenter le choix.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Choisir une solution avant d'avoir défini les critères."],"correct":0,"why":"La bonne décision répond au problème constaté : Comparer des options sur des critères validés et documenter le choix. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["DAR","Analyse et résolution des décisions"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Matrice de décision et comparaison des alternatives","Traces d'exécution : Critères pondérés, alternatives, procès-verbaux de décision, analyses comparatives.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":9,"evidenceContrast":["Le comité valide des critères avant de comparer trois fournisseurs et archive les motifs du choix.","Le fournisseur préféré a été choisi avant la définition des critères."],"levelFr":{"1":"Identifier les options et rendre une décision","2":"Formaliser critères, règles et techniques de comparaison pour choisir","3":"Déployer une approche commune de décision tenant compte des responsabilités"}},"duration":25,"isExpanded":true,"en":{"title":"Decision Analysis and Resolution","summary":"Use explicit criteria to compare options and document important decisions","kicker":"From process intent to verifiable outcomes: Decision Analysis and Resolution","paragraphs":["**The business problem.** Use explicit criteria to compare options and document important decisions. In a realistic organization, this means deciding which outcomes must improve and which people or teams are responsible. The goal is not to produce paperwork for an auditor: it is to make the activity reliable when circumstances change.","**A concrete example.** A manager selects a supplier without an alternatives review. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** State the decision problem, define weighted criteria, assess alternatives and retain the rationale. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for decision record, criteria and scores, trade-off analysis. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** selecting the preferred option before establishing criteria."],"steps":[["01 · Define","Frame the decision and constraints"],["02 · Prepare","Set criteria before evaluating options"],["03 · Perform","Compare credible alternatives"],["04 · Review","Record rationale and results"]],"story":"**Case file — fictional organization.** A manager selects a supplier without an alternatives review. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to state the decision problem, define weighted criteria, assess alternatives and retain the rationale. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the DAR problem described in the case?","choices":["Document the intention without changing how the team works.","State the decision problem, define weighted criteria, assess alternatives and retain the rationale","Declare full maturity because the process has an owner."],"correct":1,"why":"Decision Analysis and Resolution requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["trade-off","A choice that improves one factor at the cost of another"],["decision criteria","Agreed factors used to evaluate possible options"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual DAR process.","Dated artifacts show the practice performed: Decision record, criteria and scores, trade-off analysis.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous decision record, criteria and scores, trade-off analysis tied to real work.","Weaker: selecting the preferred option before establishing criteria; no trace of consistent use."],"levelFr":{"1":"Begin addressing decision analysis and resolution, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable decision analysis and resolution work. For example: Set criteria before evaluating options; compare credible alternatives.","3":"Use a shared organizational approach to decision analysis and resolution; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets."},"scenario":"A manager selects a supplier without an alternatives review","pitfall":"Selecting the preferred option before establishing criteria","action":"State the decision problem, define weighted criteria, assess alternatives and retain the rationale","evidence":"Decision record, criteria and scores, trade-off analysis"}},{"id":"ESAF","title":"Sécurité des personnes et des systèmes","domain":"SAF","page":9,"goal":"Identifier puis maîtriser les risques de sûreté fonctionnelle et physique.","evidence":"Registre des dangers, exigences de sûreté, évaluations et mesures de mitigation.","pitfall":"Confondre sûreté des personnes et cybersécurité.","scenario":"Un dispositif automatisé peut blesser un opérateur en cas de panne.","response":"Analyser le danger et vérifier les dispositifs qui réduisent le risque résiduel.","symptom":"Accidents possibles malgré les contrôles métiers","expected":"Évaluation des dangers et essais des contrôles de sûreté","domainName":"Sûreté","lesson":["Pourquoi : Identifier puis maîtriser les risques de sûreté fonctionnelle et physique.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Registre des dangers, exigences de sûreté, évaluations et mesures de mitigation.","Erreur fréquente : Confondre sûreté des personnes et cybersécurité.","Situation pratique : Un dispositif automatisé peut blesser un opérateur en cas de panne. Réponse attendue : Analyser le danger et vérifier les dispositifs qui réduisent le risque résiduel."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces.","3":"La pratique s’appuie sur un standard organisationnel adapté et capitalisé."},"officialPracticeCount":8,"source":"Guide CMMI v4.0 (2026), p. 9","deep":{"kicker":"Apprendre à faire vivre sécurité des personnes et des systèmes dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — accidents possibles malgré les contrôles métiers — elle doit aller au-delà des in ircumstances change.","**A concrete example.** An automated machine could injure an operator after a sensor failure. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** Identify hazardous situations, evaluate severity and exposure, engineer controls and validate them. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for hazard log, risk assessment, safety tests. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** confusing physical or functional safety with cybersecurity."],"steps":[["01 · Define","Identify safety needs and hazards"],["02 · Prepare","Prioritize hazards and tolerances"],["03 · Perform","Implement preventive safeguards"],["04 · Review","Review tests and residual risk"]],"story":"**Case file — fictional organization.** An automated machine could injure an operator after a sensor failure. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to identify hazardous situations, evaluate severity and exposure, engineer controls and validate them. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the ESAF problem described in the case?","choices":["Document the intention without changing how the team works.","Identify hazardous situations, evaluate severity and exposure, engineer controls and validate them","Declare full maturity because the process has an owner."],"correct":1,"why":"Enabling Safety requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["hazard","A potential source of harm"],["residual risk","Risk remaining after controls have been applied"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual ESAF process.","Dated artifacts show the practice performed: Hazard log, risk assessment, safety tests.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous hazard log, risk assessment, safety tests tied to real work.","Weaker: confusing physical or functional safety with cybersecurity; no trace of consistent use."],"levelFr":{"1":"Begin addressing enabling safety, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable enabling safety work. For example: Prioritize hazards and tolerances; implement preventive safeguards.","3":"Use a shared organizational approach to enabling safety; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets."},"scenario":"An automated machine could injure an operator after a sensor failure","pitfall":"Confusing physical or functional safety with cybersecurity","action":"Identify hazardous situations, evaluate severity and exposure, engineer controls and validate them","evidence":"Hazard log, risk assessment, safety tests"}},{"id":"ESEC","title":"Mise en œuvre de la sécurité","domain":"SEC","page":10,"goal":"Définir et déployer une approche cohérente de sécurité de l'organisation.","evidence":"Objectifs de sécurité, politique, contrôles, architecture et revues régulières.","pitfall":"Limiter la sécurité à l'installation d'un antivirus.","sce té se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour ESEC, on attend notamment des traces telles que : objectifs de sécurité, politique, contrôles, architecture et revues régulières.","**La distinction importante.** Un risque typique serait de limiter la sécurité à l'installation d'un antivirus. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Identifier les besoins de sécurité"],["02 · Organiser","Définir les contrôles et responsabilités"],["03 · Appliquer","Déployer l’approche dans les équipes"],["04 · Vérifier","Revoir les écarts et corriger"]],"story":"**Mission terrain.** Chaque projet applique ses propres règles d'accès sans coordination. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Établir une stratégie de sécurité commune et en évaluer l'adoption. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Chaque projet applique ses propres règles d'accès sans coordination. » Quelle réponse est la plus défendable ?","choices":["Établir une stratégie de sécurité commune et en évaluer l'adoption.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Limiter la sécurité à l'installation d'un antivirus."],"correct":0,"why":"La bonne décision répond au problème constaté : Établir une stratégie de sécurité commune et en évaluer l'adoption. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["ESEC","Mise en œuvre de la sécurité"],["Preuve de déploiement","Élément tangible qui cords, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for security policy, control assignments, control test results. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** treating antivirus software as a complete security strategy."],"steps":[["01 · Define","Define organizational security needs"],["02 · Prepare","Design a coordinated security approach"],["03 · Perform","Implement and communicate controls"],["04 · Review","Review control effectiveness"]],"story":"**Case file — fictional organization.** Different projects apply incompatible access policies. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to set security objectives, clarify roles, implement layered controls and verify their operation. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the ESEC problem described in the case?","choices":["Document the intention without changing how the team works.","Set security objectives, clarify roles, implement layered controls and verify their operation","Declare full maturity because the process has an owner."],"correct":1,"why":"Enabling Security requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["security control","A safeguard intended to reduce a defined security risk"],["defense in depth","Using multiple complementary protective layers"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual ESEC process.","Dated artifacts show the practice performed: Security policy, control assignments, control test results.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous security policy, control assignments, control test results tied to real work.","Weaker: treating antivirus software as a complete security strategy; no trace of consistent use."],"levelFr":{"1":"Begin addressing enabling security, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable enabling security work. For example: Design a coordinated security approach; implement and communicate controls.","3":"Use a shared organizational approach to enabling security; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets."},"scenario":"Different projects apply incompatible access policies","pitfall":"Treating antivirus software as a complete security strategy","action":"Set security objectives, clarify roles, implement layered controls and verify their operation","evidence":"Security policy, control assignments, control test results"}},{"id":"EVW","title":"Travail virtuel","domain":"VRT","page":10,"goal":"Organiser efficacement le travail distribué avec ses contraintes spécifiques.","evidence":"Règles de collaboration, accès distants, suivi de coordination, retours d'expérience.","pitfall":"Considérer le télétravail comme uniquement un sujet d'outils vidéo.","scenario":"Une équipe répartie sur trois fuseaux manque ses validations.","response":"Formaliser les pratiques asynchrones, responsabilités et fenêtres de décision.","symptom":"Pertes de coordination en équipe distribuée","expected":"Accords de travail distant et revue de leur efficacité","domainName":"Travail virtuel","lesson":["Pourquoi : Organiser efficacement le travail distribué avec ses contraintes spécifiques.","Dans un aud ectif de performance"],["02 · Organiser","Spécifier les mesures et leur collecte"],["03 · Appliquer","Analyser les résultats observés"],["04 · Vérifier","Décider et suivre les effets"]],"story":"**Mission terrain.** L'équipe suit vingt indicateurs sans prendre de décision. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Sélectionner des métriques reliées aux objectifs et organiser des revues d'action. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « L'équipe suit vingt indicateurs sans prendre de décision. » Quelle réponse est la plus défendable ?","choices":["Sélectionner des métriques reliées aux objectifs et organiser des revues d'action.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Mesurer la vélocité sans vérifier l'impact métier."],"correct":0,"why":"La bonne décision répond au problème constaté : Sélectionner des métriques reliées aux objectifs et organiser des revues d'action. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["MPM","Performance et mesure"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Objectifs mesurables et analyses menant à des décisions","Traces d'exécution : Définitions des métriques, tableaux de bord, dépôts de mesures, objectifs de performance.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":15,"evidenceContrast":["Des indicateurs définis conduisent à une décision traçable et l’effet est mesuré.","On rapporte des chiffres sans objectif ou action associée."],"levelFr":{"1":"Collecter des mesures utiles au travail","2":"Définir les besoins de mesure, collecter et analyser les informations pour agir","3":"Instaurer une gestion commune des mesures et des résultats de performance","4":"Exploiter statistiques et techniques quantitatives pour piloter la performance","5":"Optimiser sur la base de l’analyse des résultats de performance"}},"duration":25,"isExpanded":true,"en":{"title":"Managing Performance and Measurement","summary":"Measure what matters and use the results to improve performance","kicker":"From process intent to verifiable outcomes: Managing Performance and Measurement","paragraphs":["**The business problem.** Measure what matters and use the results to improve performance. In a realistic organization, this means deciding which outcomes must improve and which people or teams are responsible. The goal is not to produce paperwork for an auditor: it is to make the activity reliable when circumstances change.","**A concrete example.** A team reports twenty metrics but makes no decisions. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** Link business objectives to operational definitions, collect trusted data and change decisions based on trends. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for metric dictionary, baseline results, decision log. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** confusing a large dashboard with performance management."],"steps":[["01 · Define","Define measurable business outcomes"],["02 · Prepare","Specify measures and collection rules"],["03 · Perform","Analyze variation and trends"],["04 · Review","Change course and check effects"]],"story":"**Case file — fictional organization.** A team reports twenty metrics but makes no decisions. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to link business objectives to operational definitions, collect trusted data and change decisions based on trends. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the MPM problem described in the case?","choices":["Document the intention without changing how the team works.","Link business objectives to operational definitions, collect trusted data and change decisions based on trends","Declare full maturity because the process has an owner."],"correct":1,"why":"Managing Performance and Measurement requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["operational definition","Precise rules that make a measure consistently repeatable"],["leading indicator","A measure that may signal a future result"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual MPM process.","Dated artifacts show the practice performed: Metric dictionary, baseline results, decision log.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous metric dictionary, baseline results, decision log tied to real work.","Weaker: confusing a large dashboard with performance management; no trace of consistent use."],"levelFr":{"1":"Begin addressing managing performance and measurement, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable managing performance and measurement work. For example: Specify measures and collection rules; analyze variation and trends.","3":"Use a shared organizational approach to managing performance and measurement; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets.","4":"Apply suitable quantitative or statistical methods to understand and control performance of managing performance and measurement activities.","5":"Use statistically supported learning to optimize managing performance and measurement practices across the organizational unit."},"scenario":"A team reports twenty metrics but makes no decisions","pitfall":"Confusing a large dashboard with performance management","action":"Link business objectives to operational definitions, collect trusted data and change decisions based on trends","evidence":"Metric dictionary, baseline results, decision log"}},{"id":"MST","title":"Menaces et vulnérabilités de sécurité","domain":"SEC","page":16,"goal":"Identifier, hiérarchiser et traiter les menaces et faiblesses de sécurité.","evidence":"Inventaire des vulnérabilités, analyses de menaces, plans de traitement, preuves de correction.","pitfall":"Classer toutes les vulnérabilités au même niveau d'urgence.","scenario":"Un correctif critique est repoussé sans évaluation du risque.","response":"Évaluer exposition et impact, prioriser puis vérifier la remédiation.","symptom":"Failles connues non priorisées","expected":"Analyse de menace et suivi de remédiation","domainName":"Sécurité","lesson":["Pourquoi : Identifier, hiérarchiser et traiter les menaces et faiblesses de sécurité.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Inventaire des vul
