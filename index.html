</style></head><body><div id="root"></div><script>window.CMMI_DATA={"version":"4.0","basis":"Quick Reference Guide CMMI v4.0 (2026) ; Adoption Guide Credentials (2024, historique)","areas":[{"id":"CAR","title":"Analyse causale et résolution","domain":"CORE","page":6,"goal":"Comprendre pourquoi un résultat survient, agir sur ses causes puis mesurer l'effet.","evidence":"Analyses de causes, décisions d'action, retours d'expérience, suivi des récidives.","pitfall":"S'arrêter au symptôme ou attribuer les problèmes à des personnes.","scenario":"Trois incidents similaires reviennent après chaque livraison.","response":"Rechercher les causes communes, formaliser l'action préventive et vérifier son efficacité.","symptom":"Défauts répétitifs malgré la correction de tickets","expected":"Analyse causale et prévention documentée","domainName":"Fondamentaux","lesson":["Pourquoi : Comprendre pourquoi un résultat survient, agir sur ses causes puis mesurer l'effet.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Analyses de causes, décisions d'action, retours d'expérience, suivi des récidives.","Erreur fréquente : S'arrêter au symptôme ou attribuer les problèmes à des personnes.","Situation pratique : Trois incidents similaires reviennent après chaque livraison. Réponse attendue : Rechercher les causes communes, formaliser l'action préventive et vérifier son efficacité."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces.","3":"La pratique s’appuie sur un standard organisationnel adapté et capitalisé.","4":"Le pilotage s’appuie sur des techniques quantitatives appropriées.","5":"Les techniques quantitatives orientent l’optimisation continue."},"officialPracticeCount":11,"source":"Guide CMMI v4.0 (2026), p. 6","deep":{"kicker":"Apprendre à faire vivre analyse causale et résolution dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — défauts répétitifs malgré la correction de tickets — elle doit aller au-delà des intentions. Cette Practice Area aide à comprendre pourquoi un résultat survient, agir sur ses causes puis mesurer l'effet.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA CAR n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour CAR, on attend notamment des traces telles que : analyses de causes, décisions d'action, retours d'expérience, suivi des récidives.","**La distinction importante.** Un risque typique serait de s'arrêter au symptôme ou attribuer les problèmes à des personnes. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Sélectionner le problème récurrent"],["02 · Organiser","Chercher les causes corroborées"],["03 · Appliquer","Tester et documenter les actions"],["04 · Vérifier","Mesurer la baisse de récurrence"]],"story":"**Mission terrain.** Trois incidents similaires reviennent après chaque livraison. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Rechercher les causes communes, formaliser l'action préventive et vérifier son efficacité. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Trois incidents similaires reviennent après chaque livraison. » Quelle réponse est la plus défendable ?","choices":["Rechercher les causes communes, formaliser l'action préventive et vérifier son efficacité.","Faire signer une nouvelle procédure sans vérifier son utilisation.","S'arrêter au symptôme ou attribuer les problèmes à des personnes."],"correct":0,"why":"La bonne décision répond au problème constaté : Rechercher les causes communes, formaliser l'action préventive et vérifier son efficacité. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["CAR","Analyse causale et résolution"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Analyse causale et prévention documentée","Traces d'exécution : Analyses de causes, décisions d'action, retours d'expérience, suivi des récidives.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":6,"evidenceContrast":["Une analyse relie trois incidents à la même erreur de contrôle, puis la fréquence baisse après modification du pipeline.","Une liste de bugs corrigés n’identifie pas de cause commune."],"levelFr":{"1":"Choisir les résultats problématiques et commencer à traiter leurs causes","2":"Sélectionner les résultats à analyser et engager les réponses aux causes","3":"Adopter une méthode organisationnelle d’analyse, consigner les actions et partager les pistes d’amélioration","4":"Utiliser la statistique pour examiner les causes et les effets des actions","5":"Optimiser les solutions et processus à l’échelle de l’organisation à l’aide d’analyses quantitatives"}},"duration":25,"isExpanded":true},{"id":"CM","title":"Gestion de configuration","domain":"CORE","page":7,"goal":"Conserver l'intégrité des livrables, versions et modifications autorisées.","evidence":"Inventaire des éléments, versions de référence, approbations de changement, audits de configuration.","pitfall":"Confondre dépôt Git et gestion complète des configurations.","scenario":"Une version publiée contient une dépendance non approuvée.","response":"Identifier la baseline concernée, tracer le changement et vérifier la conformité de la livraison.","symptom":"Livraisons non reproductibles","expected":"Baseline approuvée et historique des modifications","domainName":"Fondamentaux","lesson":["Pourquoi : Conserver l'intégrité des livrables, versions et modifications autorisées.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Inventaire des éléments, versions de référence, approbations de changement, audits de configuration.","Erreur fréquente : Confondre dépôt Git et gestion complète des configurations.","Situation pratique : Une version publiée contient une dépendance non approuvée. Réponse attendue : Identifier la baseline concernée, tracer le changement et vérifier la conformité de la livraison."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces."},"officialPracticeCount":7,"source":"Guide CMMI v4.0 (2026), p. 7","deep":{"kicker":"Apprendre à faire vivre gestion de configuration dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — livraisons non reproductibles — elle doit aller au-delà des intentions. Cette Practice Area aide à conserver l'intégrité des livrables, versions et modifications autorisées.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA CM n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour CM, on attend notamment des traces telles que : inventaire des éléments, versions de référence, approbations de changement, audits de configuration.","**La distinction importante.** Un risque typique serait de confondre dépôt Git et gestion complète des configurations. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Identifier les éléments à maîtriser"],["02 · Organiser","Créer une baseline approuvée"],["03 · Appliquer","Contrôler les demandes de modification"],["04 · Vérifier","Auditer la configuration livrée"]],"story":"**Mission terrain.** Une version publiée contient une dépendance non approuvée. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Identifier la baseline concernée, tracer le changement et vérifier la conformité de la livraison. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Une version publiée contient une dépendance non approuvée. » Quelle réponse est la plus défendable ?","choices":["Identifier la baseline concernée, tracer le changement et vérifier la conformité de la livraison.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Confondre dépôt Git et gestion complète des configurations."],"correct":0,"why":" une application durable.","glossary":[["VV","Vérification et validation"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Tests de conformité et validation par les utilisateurs","Traces d'exécution : Plans et résultats de tests, critères, essais utilisateurs, anomalies résolues.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":30,"evidenceContrast":["La solution satisfait ses spécifications et fonctionne dans un usage représentatif.","Des tests techniques verts masquent un parcours utilisateur impossible."],"levelFr":{"1":"Effectuer des vérifications et validations initiales","2":"Préparer les critères, vérifier et valider les solutions et corriger les résultats","3":"Déployer des approches organisationnelles de vérification et validation"}},"duration":25,"isExpanded":true},{"id":"WE","title":"Autonomisation des équipes","domain":"PPL","page":31,"goal":"Adapter compétences, responsabilités et coordination aux objectifs métiers.","evidence":"Cartographie des compétences, affectations, organisation d'équipes, mécanismes d'échange.","pitfall":"Distribuer les rôles sans tenir compte des capacités réelles.","scenario":"Une équipe porte un service critique sans compétence de relais.","response":"Ajuster les rôles, développer les compétences et prévoir la continuité.","symptom":"Surcharge et responsabilités mal attribuées","expected":"Matrice de compétences, affectations et coordination","domainName":"Personnes","lesson":["Pourquoi : Adapter compétences, responsabilités et coordination aux objectifs métiers.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Cartographie des compétences, affectations, organisation d'équipes, mécanismes d'échange.","Erreur fréquente : Distribuer les rôles sans tenir compte des capacités réelles.","Situation pratique : Une équipe porte un service critique sans compétence de relais. Réponse attendue : Ajuster les rôles, développer les compétences et prévoir la continuité."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces.","3":"La pratique s’appuie sur un standard organisationnel adapté et capitalisé."},"officialPracticeCount":7,"source":"Guide CMMI v4.0 (2026), p. 31","deep":{"kicker":"Apprendre à faire vivre autonomisation des équipes dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — surcharge et responsabilités mal attribuées — elle doit aller au-delà des intentions. Cette Practice Area aide à adapter compétences, responsabilités et coordination aux objectifs métiers.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA WE n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour WE, on attend notamment des traces telles que : cartographie des compétences, affectations, organisation d'équipes, mécanismes d'échange.","**La distinction importante.** Un risque typique serait de distribuer les rôles sans tenir compte des capacités réelles. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Comprendre l’environnement de travail"],["02 · Organiser","Développer autonomie et collaboration"],["03 · Appliquer","Déployer le soutien aux équipes"],["04 · Vérifier","Mesurer et ajuster l’engagement"]],"story":"**Mission terrain.** Une équipe porte un service critique sans compétence de relais. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Ajuster les rôles, développer les compétences et prévoir la continuité. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Une équipe porte un service critique sans compétence de relais. » Quelle réponse est la plus défendable ?","choices":["Ajuster les rôles, développer les compétences et prévoir la continuité.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Distribuer les rôles sans tenir compte des capacités réelles."],"correct":0,"why":"La bonne décision répond au problème constaté : Ajuster les rôles, développer les compétences et prévoir la continuité. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["WE","Autonomisation des équipes"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Matrice de compétences, affectations et coordination","Traces d'exécution : Cartographie des compétences, affectations, organisation d'équipes, mécanismes d'échange.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":31,"evidenceContrast":["Des conditions de travail adaptées sont suivies à partir de retours et de résultats.","Une enquête d’engagement n’aboutit à aucun changement observable."],"levelFr":{"1":"Identifier des besoins importants pour l’engagement du personnel","2":"Agir sur les conditions de travail et l’autonomie, suivre les résultats","3":"Déployer une approche organisationnelle d’engagement et évaluer les améliorations"}},"duration":25,"isExpanded":true}],"foundations":[{"id":"F01","title":"CMMI : valeur et objectifs","topic":"Fondations","duration":18,"summary":"La finalité du CMMI est l’amélioration mesurable des performances métiers. Un niveau n’est pas une fin en soi.","bullets":["Lier chaque initiative à une valeur métier observable.","Distinguer capacité de processus et performance réelle.","Commencer par les difficultés opérationnelles avant les artefacts."],"challenge":"Un directeur veut obtenir ML3 sans changer les pratiques. Quel risque majeur identifies-tu ?","answer":"L’objectif devient cosmétique : le résultat d’évaluation ne remplace pas une amélioration effective.","deep":{"kicker":"Améliorer la capacité, pas collectionner des badges","paragraphs":["Le CMMI est une façon structurée de relier les pratiques de travail aux résultats de l'entreprise. On part d'un problème concret — retards répétés, défauts, reprises coûteuses — puis on se demande quels comportements et mécanismes rendent ce résultat probable.","Une équipe peut livrer un excellent produit une fois grâce à des personnes héroïques. La question CMMI est plus exigeante : l'organisation peut-elle reproduire ce résultat malgré un changement de projet, de client ou d'équipe ? Ce déplacement, de la réussite occasionnelle vers la capacité durable, est essentiel.","Une amélioration est utile lorsqu'elle sert un objectif d'entreprise : fiabilité de livraison, qualité perçue, coût des retouches, stabilité d'un service ou maîtrise du risque. Une pratique sans objectif ni usage observable devient de la bureaucratie. Une note de maturité peut aider à mesurer le chemin parcouru, mais ne remplace pas ce résultat."],"steps":[["Observer","Formuler une difficulté réelle : 25 % des livraisons dépassent le délai prévu."],["Relier","Identifier les pratiques qui contribuent à ces retards : estimation, planification, suivi."],["Agir","Choisir des changements accessibles et des responsables identifiés."],["Mesurer","Comparer les livraisons sur plusieurs cycles, vérifier l’effet et ajuster."]],"story":"Entreprise fictive Solis : sur 10 livraisons, 4 dépassent leur date. Le comité impose un nouveau modèle de compte rendu. Trois mois plus tard, les retards sont identiques. Le document ne traitait pas les estimations irréalistes ni les dépendances mal identifiées.","lesson":"La valeur n’est pas le nombre de documents déployés, mais l’évolution vérifiable du résultat et la solidité des pratiques sous-jacentes.","question":"Une direction annonce « atteindre ML3 » comme seul objectif. Quel premier changement proposes-tu ?","choices":["Fixer un objectif de performance et relier les pratiques à ce résultat.","Rédiger trente procédures avant de consulter les équipes.","Afficher un badge ML3 dans les présentations internes."],"correct":0,"why":"Une ambition de maturité doit être soutenue par des objectifs métier, des pratiques réellement utilisées et des résultats vérifiés.","glossary":[["Capacité","Aptitude durable d’un processus à produire des résultats attendus."],["Performance","Résultat observé : qualité, délais, coûts, risque ou valeur."]]},"isExpanded":true},{"id":"F02","title":"Architecture : catégories, CA et PA","topic":"Fondations","duration":18,"summary":"Le modèle regroupe des pratiques dans des Practice Areas (PA), elles-mêmes organisées en Capability Areas (CA) et catégories.","bullets":["Une PA désigne un domaine de pratique cohérent.","Les Practice Group Levels sont progressifs à l’intérieur d’une PA.","Ne pas confondre une liste de PA avec les exigences d’une vue de maturité."],"challenge":"Pourquoi ne suffit-il pas de « cocher » 31 PA ?","answer":"La portée, la vue du modèle, les niveaux requis et les preuves de déploiement déterminent ce qui est évalué.","deep":{"kicker":"Naviguer dans l’architecture du modèle","paragraphs":["Le guide v4.0 organise le modèle du plus général au plus opérationnel. Les catégories rassemblent des Capability Areas (CA), elles-mêmes constituées de Practice Areas (PA). Chaque PA comprend des groupes de pratiques par niveau. Ce sont des niveaux de détail différents : ils ne se remplacent pas.","Exemple : « Planning » (PLAN) est une PA liée à la planification et à la gestion du travail. Elle s’insère dans une Capability Area, puis dans une catégorie. Une pratique précise explique ce qu’il faut réaliser au niveau étudié ; la seule appellation PLAN n’en donne pas la preuve.","Les domaines CMMI (Development, Services, Data, People, Security, Safety, Suppliers, Virtual et le cœur commun) permettent d’adapter les vues à des situations différentes. On n’applique pas mécaniquement l’ensemble des 31 PA à toute unité sans tenir compte de la vue et du périmètre pertinents."],"steps":[["Catégorie","Grand regroupement : faire, gérer, permettre ou améliorer."],["Capability Area","Capacité organisationnelle ciblée par plusieurs PA."],["Practice Area","Ensemble cohérent de pratiques : exemple CM, PLAN ou PQA."],["Pratiques","Activités attendues et groupes de niveau dans le modèle intégral."]],"story":"Une équipe dit « nous avons couvert les 31 PA » parce qu’elle a renseigné une ligne pour chaque sigle dans Excel. Aucun propriétaire, preuve d’exécution ou référentiel applicable n’est précisé.","lesson":"Un tableau des PA est une carte pour s’orienter ; il ne constitue ni une application des pratiques, ni une couverture officielle du périmètre.","question":"Dans « catégorie → CA → PA → pratique », quel élément est le plus précis ?","choices":["La catégorie.","La pratique.","La Capability Area."],"correct":1,"why":"La pratique est le niveau opérationnel. Le modèle complet détaille les exigences et leurs précisions, contrairement au guide résumé.","glossary":[["CA","Capability Area : capacité métier ou organisationnelle regroupant des PA."],["PA","Practice Area : ensemble cohérent de pratiques."],["Vue du modèle","Sélection appropriée à un contexte, domaine et périmètre."]]},"isExpanded":true},{"id":"F03","title":"Niveaux 1 à 5","topic":"Fondations","duration":18,"summary":"L’évolution va de l’initiative incomplète à l’amélioration quantitative et continue ; une organisation n’atteint pas ML3 uniquement en rédigeant des processus.","bullets":["ML1 : imprévisible ; ML2 : géré par projet.","ML3 : standards organisationnels et adaptation contrôlée.","ML4 : maîtrise quantitative ; ML5 : optimisation basée sur les résultats."],"challenge":"Une équipe utilise le standard commun, mais l’organisation n’analyse jamais son efficacité. Suffisant pour ML5 ?","answer":"Non : optimiser requiert analyse quantitative et amélioration durable.","deep":{"kicker":"Comprendre les niveaux sans confondre les échelles","paragraphs":["Il faut distinguer le niveau d’un groupe de pratiques au sein d’une PA et le niveau de maturité évalué pour une unité organisationnelle. Les groupes de pratiques progressent : les niveaux supérieurs supposent la mise en œuvre de ce qui précède. Un niveau de maturité porte, lui, sur un ensemble défini de PA et de groupes de pratiques.","En termes pédagogiques : au niveau 1 une initiative démarre, au niveau 2 le travail est piloté, au niveau 3 des processus organisationnels adaptés structurent l’exécution, au niveau 4 la maîtrise quantitative devient importante et au niveau 5 l’optimisation s’appuie sur les données.","Attention : ce raccourci ne constitue pas une méthode de notation. Une équipe exemplaire ne prouve pas seule la maturité d’une unité organisationnelle ; une grande quantité de chiffres ne constitue pas nécessairement un pilotage quantitatif fiable."],"steps":[["Niveau 1","Actions initiales, parfois incomplètes et dépendantes des personnes."],["Niveau 2","Gestion du travail, suivi d’objectifs et pratiques répétables."],["Niveau 3","Processus organisationnels standardisés, adaptés et enrichis par les projets."],["Niveaux 4–5","Décisions quantitatives et optimisation maîtrisée des processus."]],"story":"Trois équipes possèdent la même procédure de planification. Deux l’appliquent, la troisième non ; aucune ne documente les adaptations ni ne remonte ses apprentissages. Le manuel seul ne démontre pas un niveau avancé.","lesson":"La progression porte sur l’institutionnalisation des pratiques, leurs preuves et leur portée — pas seulement sur le volume documentaire.","question":"Une entreprise possède 40 KPI et publie un reporting mensuel. Peut-on en déduire ML4 ?","choices":["Oui, tout reporting chiffré prouve la maîtrise quantitative.","Non, il faut examiner méthodes quantitatives, décisions, processus et périmètre.","Oui, si les KPI sont en couleur."],"correct":1,"why":"Le niveau 4 demande davantage que des graphiques : une gestion quantitative liée aux objectifs et aux pratiques concernées.","glossary":[["PG","Practice Group : ensemble évolutif de pratiques de niveau donné."],["ML","Maturity Level : résultat d’une évaluation de maturité sur un périmètre déterminé."]]},"isExpanded":true},{"id":"F04","title":"Évaluation d’entreprise ou certification ?","topic":"Fondations","duration":24,"summary":"Une appraisal porte sur une unité organisationnelle et son fonctionnement ; un examen personnel valide des connaissances.","bullets":["Appraisal : périmètre, projets, entretiens et preuves.","Certification individuelle : formation, examen et conditions propres.","Le simulateur de ce site est un outil d’entraînement, pas une évaluation officielle."],"challenge":"Peut-on déclarer ML3 parce que l’entraînement affiche 90 % ?","answer":"Non : seul un appraisal officiel peut établir une note reconnue.","deep":{"kicker":"Deux parcours, deux types de preuves, deux résultats","paragraphs":["Une certification individuelle et une évaluation d’entreprise répondent à des questions différentes. Pour une personne : « maîtrise-t-elle les notions et les compétences prévues par ce parcours de formation ? » Pour une entreprise : « les pratiques applicables sont-elles effectivement mises en œuvre dans le périmètre évalué ? »","Le parcours individuel peut demander une formation préalable, un examen et parfois une expérience spécifique. Le guide ISACA de 2024 distingue notamment Associate, Practitioner, Professional et Lead Appraiser. Ces parcours ne délivrent pas à eux seuls une note de maturité à l’organisation.","Lors d’une appraisal, il faut définir une unité organisationnelle, une portée, les projets ou fonctions concernés et les règles d’évaluation applicables. L’équipe d’évaluation examine des éléments de travail, des échanges avec les acteurs et la cohérence des pratiques observées. Un résultat reconnu dépend d’un processus officiel, pas d’un score de quiz.","Dans cette plateforme, tes exercices simulent des raisonnements d’appraisal. Un score de 90 % signifie que tu réponds correctement aux questions proposées ici. Il ne signifie ni que ton entreprise est ML3, ni que tu es personnellement certifié."],"steps":[["Définir la cible","Examen personnel ou appraisal organisationnel ?"],["Définir les règles","Formation et épreuve d’un côté ; portée et méthode officielle de l’autre."],["Apporter des preuves","Connaissances évaluées ou pratiques de travail observables."],["Obtenir un résultat","Credential individuel ou résultat d’appraisal officiel."]],"story":"NovaTech a 50 développeurs. Son responsable qualité obtient 98 % sur CMMI Academy. Pourtant, deux équipes n’utilisent aucun suivi des changements, la troisième n’a pas d’archives de revues et la direction ne suit aucun objectif commun. Le niveau de connaissance du responsable ne prouve rien sur ces pratiques.","lesson":"Le score de formation appartient à la personne ; la performance et les preuves concernent l’unité organisationnelle. Aucune de ces deux dimensions ne remplace l’autre.","question":"L’entreprise veut annoncer « Nous sommes ML3 » après le succès du responsable qualité à un examen. Quel est le diagnostic ?","choices":["Annonce valable : un examen individuel suffit.","Annonce non justifiée : il faut une appraisal officielle du périmètre retenu.","Annonce valable après avoir rempli une auto-grille interne."],"correct":1,"why":"Un examen valide des connaissances individuelles ; un appraisal reconnu évalue une unité organisationnelle selon les modalités officielles.","glossary":[["Appraisal","Évaluation structurée de pratiques organisationnelles sur un périmètre défini."],["Credential","Certification individuelle assortie de conditions précises."],["Unité organisationnelle","Périmètre opérationnel dont les pratiques sont étudiées."]]},"isExpanded":true},{"id":"F05","title":"Preuves : document, entretien, observation","topic":"Méthode d’audit","duration":18,"summary":"L’auditeur recoupe les affirmations avec des traces vérifiables et représentatives des activités.","bullets":["Chercher des preuves datées et représentatives des unités du périmètre.","Vérifier l’exécution réelle avec les équipes.","Distinguer « existe » de « est appliqué et utile »."],"challenge":"Une procédure jamais utilisée est-elle une preuve solide d’application ?","answer":"Non : c’est une intention documentaire, pas une démonstration de pratique déployée.","deep":{"kicker":"Ne jamais confondre document, usage et résultat","paragraphs":["Une preuve de processus peut prendre plusieurs formes complémentaires : une définition approuvée, un livrable réel daté, un enregistrement de décision, une démonstration et des explications concordantes des personnes qui travaillent au quotidien. Aucune catégorie ne doit être confondue avec une garantie universelle.","Un document prouve surtout qu’une intention a été écrite. Pour évaluer l’implantation de la pratique, on cherche les traces d’exécution : plans utilisés, versions approuvées, retours d’anomalies traitées, décisions et actions clôturées. Les entretiens permettent de comprendre si les rôles décrits correspondent à l’usage réel.","La représentativité est essentielle : deux dossiers parfaits triés sur le volet ne démontrent pas un fonctionnement cohérent sur dix équipes. Inversement, une preuve isolée insuffisante peut inviter à poursuivre les vérifications plutôt qu’à condamner une organisation."],"steps":[["Déclaration","« Nous faisons une revue chaque semaine. »"],["Document","Une procédure explique comment ces revues devraient se dérouler."],["Exécution","Comptes rendus réels, participants, décisions et suites identifiées."],["Recoupement","Entretien et vérification de l’application sur plusieurs échantillons."]],"story":"La société Ilex produit une politique qualité signée il y a trois ans. Dans quatre projets inspectés, aucune revue n’est enregistrée. Les équipes disent ne pas connaître la procédure. La politique existe, mais la mise en œuvre n’est pas démontrée.","lesson":"Toujours séparer l’existence d’un dispositif de son utilisation effective, puis rechercher des preuves convergentes et représentatives.","question":"Quelle combinaison soutient le mieux l’application d’un processus ?","choices":["Une procédure signée uniquement.","Des exemples datés sur plusieurs projets, des entretiens cohérents et des résultats.","Une promesse de mise en place au trimestre prochain."],"correct":1,"why":"Le recoupement de traces et d’entretiens aide à distinguer les intentions, les usages et leurs effets.","glossary":[["Artefact","Livrable ou trace de travail conservée."],["Triangulation","Recherche de cohérence entre plusieurs sources de preuve."]]},"isExpanded":true},{"id":"F06","title":"Portée et échantillonnage","topic":"Méthode d’audit","duration":18,"summary":"Le niveau déclaré dépend du périmètre retenu, des projets sélectionnés et du modèle applicable.","bullets":["Définir l’unité organisationnelle évaluée.","Préparer une liste représentative de projets et services.","Ne pas généraliser un seul projet exemplaire à toute l’entreprise."],"challenge":"Pourquoi l’équipe pilote ne suffit-elle pas à prouver la maturité globale ?","answer":"La diffusion dans le périmètre doit être démontrée sur un échantillon cohérent.","deep":{"kicker":"Le périmètre avant la conclusion","paragraphs":["Avant de comparer une organisation au modèle, il faut savoir exactement quelle partie est concernée : sites, équipes, types de travaux, projets et services. Le résultat d’une unité définie ne vaut pas automatiquement pour toutes les filiales d’un groupe.","L’échantillonnage permet de sélectionner des cas représentatifs selon les règles de l’appraisal applicable. On cherche des pratiques observables dans des contextes différents, avec des projets anciens et récents, des équipes plus ou moins grandes et des situations ordinaires.","Un pilote modèle peut montrer la faisabilité d’une méthode, pas son déploiement global. Une enquête bien conçue cherche les écarts entre les pratiques déclarées et celles qui s’appliquent réellement dans le périmètre."],"steps":[["Délimiter","Identifier l’unité et les activités incluses."],["Sélectionner","Choisir les projets et fonctions conformément à la méthode applicable."],["Contraster","Comparer résultats, documents et entretiens dans le périmètre."],["Conclure","Ne généraliser qu’au périmètre réellement étudié."]],"story":"Un groupe de trois agences présente un projet pilote exceptionnel de l’agence centrale. Dans les deux autres agences, les plans ne sont jamais mis à jour. Le pilote seul ne peut soutenir une conclusion pour les trois agences.","lesson":"L’appraisal produit un constat relatif à une portée définie ; l’échantillon doit permettre une conclusion défendable pour cette portée.","question":"Le projet pilote est irréprochable. Quelle suite est la plus judicieuse ?","choices":["Conclure à la maturité de toutes les équipes.","Examiner la représentativité du pilote et les autres parties du périmètre.","Retirer les projets difficiles de l’inventaire sans justification."],"correct":1,"why":"Une pratique solide isolée n’est pas une preuve de déploiement organisationnel.","glossary":[["Portée","Frontières de l’unité et des activités évaluées."],["Échantillon","Sélection d’éléments et acteurs examinés selon une méthode d’évaluation."]]},"isExpanded":true},{"id":"F07","title":"Non-conformités et actions correctives","topic":"Méthode d’audit","duration":18,"summary":"Toute lacune doit mener à une action proportionnée et suivie jusqu’à sa vérification.","bullets":["Décrire précisément le fait observé et l’exigence concernée.","Nommer responsable, date cible et preuve attendue.","Recontrôler après correction pour éviter les fermetures artificielles."],"challenge":"Un ticket « corrigé » sans vérification suffit-il ?","answer":"Non : on attend une preuve que la correction fonctionne et reste efficace.","deep":{"kicker":"Transformer les écarts en apprentissage","paragraphs":["Un écart apparaît quand le comportement observé ne correspond pas à l’approche attendue pour le périmètre étudié. Il faut le décrire avec précision avant de lancer une correction : constat, contexte, preuve, cause possible et effet sur l’objectif de performance.","Corriger un symptôme ne garantit pas que le problème ne reviendra pas. Exemple : fermer un ticket de défaut logiciel résout parfois l’incident immédiat, mais n’empêche pas sa réapparition si la cause est un processus de validation incomplet.","Une action corrective utile a un responsable, une échéance, une vérification et, si nécessaire, une analyse de cause. L’efficacité se démontre après mise en œuvre : taux de répétition, échantillons de livrables, résultat d’un contrôle ou observation du processus."],"steps":[["Constater","Décrire un écart factuel et son impact."],["Analyser","Séparer cause apparente et cause profonde."],["Corriger","Assigner une action vérifiable avec une échéance."],["Vérifier","Mesurer la non-récurrence et ajuster si besoin."]],"story":"Une équipe corrige dix fois la même erreur de configuration en production. Chaque ticket est marqué « résolu ». Le suivi mensuel montre pourtant les mêmes erreurs : l’action corrige le résultat, pas les mécanismes de déploiement.","lesson":"La clôture administrative n’équivaut pas à une efficacité démontrée. La boucle de vérification est indispensable.","question":"Quand une action corrective peut-elle être considérée comme efficace ?","choices":["Lorsqu’un responsable dit qu’elle est terminée.","Quand son effet a été vérifié selon des critères appropriés.","Dès qu’une réunion a eu lieu."],"correct":1,"why":"Une action appliquée doit encore être évaluée ; sinon elle peut simplement déplacer ou masquer l’écart.","glossary":[["Écart","Différence entre l’état observé et une attente déterminée."],["Action corrective","Action destinée à éliminer la cause d’un problème identifié."]]},"isExpanded":true},{"id":"F08","title":"Statistiques et haut niveau de maturité","topic":"Maturité avancée","duration":18,"summary":"La maîtrise quantitative nécessite des définitions opérationnelles fiables, des données et des analyses capables d’orienter des décisions.","bullets":["Distinguer simple reporting et analyse statistique.","Utiliser des baselines et objectifs de qualité et de performance.","Mesurer l’effet des améliorations sur les résultats métier."],"challenge":"Dix graphiques de vélocité suffisent-ils à prouver ML4 ?","answer":"Non : le contrôle quantitatif exige des méthodes adaptées aux objectifs et une interprétation exploitable.","deep":{"kicker":"Des mesures, puis des décisions quantitatives fiables","paragraphs":["Un tableau de bord décrit des résultats ; une démarche quantitative cherche à comprendre, prévoir et piloter des performances à partir de mesures définies. Les objectifs de qualité et de performance doivent guider les choix d’indicateurs et de méthodes.","Il faut distinguer un changement réel d’un changement de définition. Si une entreprise retire des incidents de son calcul, la baisse apparente ne prouve aucune amélioration. Les données doivent être comparables, interprétables et reliées au contexte de production.","À haut niveau de maturité, les techniques statistiques et quantitatives jouent un rôle important dans la gestion et l’optimisation des processus pertinents. La maîtrise quantitative ne se déduit pas du simple nombre de graphiques, ni de l’emploi d’un logiciel de reporting."],"steps":[["Objectif","Réduire l’incertitude sur les délais de livraison."],["Mesures fiables","Définir la durée, la population et les règles de collecte."],["Analyse","Observer tendances, variation et capacité de prévision selon des méthodes adaptées."],["Décision","Ajuster un processus puis vérifier l’impact sur l’objectif."]],"story":"Une direction annonce une baisse de 40 % du temps de résolution. En réalité, les incidents complexes ont été exclus de la métrique. Le reporting est séduisant, mais il ne permet pas une conclusion fiable sur l’amélioration.","lesson":"Il faut pouvoir expliquer d’où viennent les mesures, pourquoi elles sont comparables et quelle décision elles permettent.","question":"Quel élément distingue le mieux un pilotage quantitatif d’un reporting décoratif ?","choices":["Des tableaux colorés mis à jour chaque heure.","Des mesures définies, des analyses adaptées et des décisions reliées à des objectifs.","Au moins trente indicateurs quelle que soit leur utilité."],"correct":1,"why":"Des méthodes quantitatives pertinentes servent à comprendre et améliorer des processus au regard d’objectifs de performance.","glossary":[["Baseline de performance","Base de référence issue de données comparables."],["QPPO","Objectif de qualité et de performance des processus."]]},"isExpanded":true}],"cases":[{"id":"C01","title":"Le document fantôme","topic":"Audit de processus","description":"Une politique qualité de 2024 est signée mais aucun projet ne peut citer son usage.","rating":"Preuve insuffisante","action":"Documenter un écart et rechercher des traces d’application.","reason":"La publication prouve l’existence, pas l’implémentation."},{"id":"C02","title":"Le projet vedette","topic":"Échantillonnage","description":"Un projet exemplaire utilise tous les processus, les huit autres ignorent le référentiel.","rating":"Preuve insuffisante","action":"Élargir l’échantillon et vérifier le déploiement organisationnel.","reason":"La bonne pratique isolée ne démontre pas une capacité stable à l’échelle du périmètre."},{"id":"C03","title":"Les chiffres maquillés","topic":"Mesure","description":"Le taux de défauts annoncé diminue parce que l’équipe a changé discrètement sa définition.","rating":"Preuve insuffisante","action":"Vérifier définitions opérationnelles et comparabilité historique.","reason":"Une mesure sans définition stable ne permet pas de conclure."},{"id":"C04","title":"Le risque orphelin","topic":"Risques","description":"Le registre contient 40 risques sans propriétaires, dates ni traitement.","rating":"Preuve partielle","action":"Attribuer, prioriser et suivre les réponses avec preuves.","reason":"La présence d’un tableau ne démontre pas la maîtrise."},{"id":"C05","title":"La décision orale","topic":"Décisions","description":"Une architecture coûteuse a été choisie sans comparaison documentée.","rating":"Preuve insuffisante","action":"Établir critères, alternatives et justification du choix.","reason":"La traçabilité des décisions réduit les biais et favorise l’apprentissage."},{"id":"C06","title":"Les rétros sans suite","topic":"Amélioration","description":"Chaque sprint donne dix actions d’amélioration mais aucune n’est suivie.","rating":"Preuve partielle","action":"Relier chaque action à un responsable et à une vérification de résultat.","reason":"Une intention répétée n’est pas une amélioration vérifiée."},{"id":"C07","title":"Le fournisseur invisible","topic":"Fournisseurs","description":"Le contrat existe mais aucune revue de performance ni réception n’est faite.","rating":"Preuve partielle","action":"Définir les critères d’acceptation et les revues régulières.","reason":"L’accord doit aussi être effectivement piloté."},{"id":"C08","title":"Le plan de secours","topic":"Continuité","description":"La cellule de crise possède un plan de reprise jamais testé.","rating":"Preuve partielle","action":"Planifier un exercice et documenter les leçons apprises.","reason":"Tester la capacité de reprise compte autant que rédiger le plan."},{"id":"C09","title":"La baseline perdue","topic":"Configuration","description":"Impossible d’expliquer quelle version a été remise au client.","rating":"Preuve insuffisante","action":"Reconstituer et sécuriser l’identification des éléments livrés.","reason":"La gestion de configuration porte sur l’intégrité des livrables."},{"id":"C10","title":"Les compétences fantômes","topic":"Personnes","description":"Les employés ont assisté à une formation mais échouent à utiliser la procédure.","rating":"Preuve partielle","action":"Évaluer les acquis et offrir un accompagnement ciblé.","reason":"La présence ne prouve pas la compétence opérationnelle."},{"id":"C11","title":"Le faux niveau quatre","topic":"Maturité avancée","description":"Une équipe possède 25 KPI sans méthode de prédiction ou contrôle statistique.","rating":"Preuve partielle","action":"Aligner les QPPO, baselines et méthodes quantitatives.","reason":"Afficher des nombres n’est pas piloter quantitativement."},{"id":"C12","title":"Le client oublié","topic":"Validation","description":"Les tests techniques passent mais les utilisateurs ne parviennent pas à achever leur tâche.","rating":"Preuve partielle","action":"Organiser une validation représentative des besoins réels.","reason":"Vérification et validation répondent à deux questions complémentaires."},{"id":"C13","title":"La sécurité sur papier","topic":"Cybersécurité","description":"Le registre de vulnérabilités est complet, mais les correctifs critiques ne sont jamais appliqués.","rating":"Preuve partielle","action":"Prioriser et vérifier les remédiations selon le risque.","reason":"Identifier un risque ne démontre pas son traitement."},{"id":"C14","title":"La revue décorative","topic":"Revues","description":"Tous les tickets de revue sont validés en quelques secondes sans commentaire ni critères.","rating":"Preuve insuffisante","action":"Évaluer l’efficacité réelle des revues et suivre les défauts.","reason":"Un statut « approuvé » seul ne prouve pas une revue pertinente."},{"id":"C15","title":"La configuration traçable","topic":"Configuration","description":"Trois projets échantillonnés montrent des baselines approuvées, historiques de changement datés, décisions et audits de configuration cohérents, confirmés en entretien.","rating":"Preuve solide","action":"Conserver les échantillons et vérifier la représentativité du périmètre.","reason":"Les traces concordantes et les entretiens montrent une mise en œuvre étayée pour les projets examinés."},{"id":"C16","title":"Le pilotage utile","topic":"Mesure","description":"Chaque mois, deux équipes utilisent des métriques définies pour décider d’actions; les décisions et leurs résultats sont conservés et recoupés en entretien.","rating":"Preuve solide","action":"Vérifier la couverture du périmètre et la continuité de ce pilotage.","reason":"Des données, des décisions et des effets observables se renforcent mutuellement."},{"id":"C17","title":"Le fournisseur supervisé","topic":"Fournisseurs","description":"Les contrats de deux fournisseurs, revues trimestrielles, évaluations de livrables et traitements d’écarts sont retrouvés avec des dates et responsables.","rating":"Preuve solide","action":"Examiner si ces preuves couvrent les fournisseurs importants du périmètre.","reason":"Les accords et suivis d’exécution forment des traces convergentes."},{"id":"C18","title":"La formation vérifiée","topic":"Compétences","description":"Chaque équipe interrogée sait appliquer le nouveau processus, et les résultats d’évaluation des acquis sont reliés au plan de formation.","rating":"Preuve solide","action":"Maintenir la mesure de compétence et réexaminer les besoins lors des changements.","reason":"La connaissance démontrée complète les documents de formation."},{"id":"C19","title":"Le plan de continuité testé","topic":"Résilience","description":"Deux exercices de crise ont été effectués, avec délais de reprise mesurés, écarts documentés et actions clôturées après contre-test.","rating":"Preuve solide","action":"Valider l’actualisation du plan et son périmètre opérationnel.","reason":"Les exercices et corrections testées montrent une préparation opérationnelle."},{"id":"C20","title":"La revue effective","topic":"Qualité","description":"Les revues de pairs sont échantillonnées sur plusieurs équipes avec critères, défauts repérés et vérification des corrections avant approbation.","rating":"Preuve solide","action":"Conserver ces traces et examiner leur efficacité dans le temps.","reason":"Les revues sont décrites, exécutées et suivies sur plusieurs échantillons."}],"questions":[{"id":"CAR-ID","kind":"concept","q":"Quelle Practice Area traite principalement cette situation : « Défauts répétitifs malgré la correction de tickets » ?","options":["Infrastructure de mise en œuvre","Gestion de configuration","Résolution et prévention des incidents","Analyse causale et résolution"],"answer":3,"explanation":"La réponse est CAR : Comprendre pourquoi un résultat survient, agir sur ses causes puis mesurer l'effet.","area":"CAR","difficulty":2},{"id":"CAR-GOAL","kind":"concept","q":"Quel est l'objectif principal de « CAR — Analyse causale et résolution » ?","options":["Comprendre pourquoi un résultat survient, agir sur ses causes puis mesurer l'effet.","Conserver l'intégrité des livrables, versions et modifications autorisées.","Rendre les processus durables grâce aux ressources, compétences et contrôles.","Restaurer les services après incident et éviter les interruptions récurrentes."],"answer":0,"explanation":"L'intention de cette PA est : Comprendre pourquoi un résultat survient, agir sur ses causes puis mesurer l'effet.","area":"CAR","difficulty":1},{"id":"CAR-EVD","kind":"preuves","q":"Lors d'un appraisal portant sur « CAR », quelle preuve est la plus probante parmi ces propositions ?","options":["Analyse causale et prévention documentée","Journal d'incidents et actions de prévention","Preuves d'application régulière et accompagnement","Baseline approuvée et historique des modifications"],"answer":0,"explanation":"Preuves pertinentes : Analyses de causes, décisions d'action, retours d'expérience, suivi des récidives.","area":"CAR","difficulty":2},{"id":"CAR-SCN","kind":"situation","q":"Trois incidents similaires reviennent après chaque livraison. Quelle action est la plus appropriée ?","options":["Identifier la baseline concernée, tracer le changement et vérifier la conformité de la livraison.","Former, équiper, vérifier l'application et corriger les écarts.","Rechercher les causes communes, formaliser l'action préventive et vérifier son efficacité.","Résoudre rapidement, analyser les tendances et prévenir les répétitions."],"answer":2,"explanation":"Une réponse solide serait : Rechercher les causes communes, formaliser l'action préventive et vérifier son efficacité.","area":"CAR","difficulty":3},{"id":"CAR-PIT","kind":"piège","q":"Quelle mauvaise pratique met surtout en échec « CAR » ?","options":["Documenter un processus que personne ne suit.","Confondre dépôt Git et gestion complète des configurations.","Fermer les incidents sans rechercher les incidents répétitifs.","S'arrêter au symptôme ou attribuer les problèmes à des personnes."],"answer":3,"explanation":"Piège à éviter : S'arrêter au symptôme ou attribuer les problèmes à des personnes.","area":"CAR","difficulty":2},{"id":"CAR-DOM","kind":"cartographie","q":"Dans le guide v4.0, quel domaine porte « CAR » ?","options":["Fondamentaux","Personnes","Développement","Travail virtuel"],"answer":0,"explanation":"Domaine : Fondamentaux. Certaines PA relèvent du tronc commun.","area":"CAR","difficulty":1},{"id":"CAR-AUD","kind":"audit","q":"Dossier CAR : Trois incidents similaires reviennent après chaque livraison. Le responsable présente une politique validée mais aucune trace de l'action qu'il affirme avoir réalisée. Que faut-il faire en priorité ?","options":["Demander des exemples d’application et leur résultat, par exemple : analyse causale et prévention documentée.","Déclarer le niveau 5 sans approfondir, puisque la politique est signée.","Conserver volontairement cette situation : s'arrêter au symptôme ou attribuer les problèmes à des personnes.","Décider immédiatement de la maturité de toute l’entreprise à partir de ce seul document."],"answer":0,"explanation":"Pour CAR, la politique n’établit pas l’exécution. Chercher les traces et des entretiens qui expliquent les actions ; par exemple : Analyses de causes, décisions d'action, retours d'expérience, suivi des récidives.","area":"CAR","difficulty":3},{"id":"CM-ID","kind":"concept","q":"Quelle Practice Area traite principalement cette situation : « Livraisons non reproductibles » ?","options":["Gestion de configuration","Mise en œuvre de la sécurité","Estimation","Analyse et résolution des décisions"],"answer":0,"explanation":"La réponse est CM : Conserver l'intégrité des livrables, versions et modifications autorisées.","area":"CM","difficulty":2},{"id":"CM-GOAL","kind":"concept","q":"Quel est l'objectif principal de « CM — Gestion de configuration » ?","options":["Conserver l'intégrité des livrables, versions et modifications autorisées.","Évaluer l'ampleur, l'effort, les délais et les coûts du travail.","Choisir entre des alternatives selon des critères explicites et tracés.","Définir et déployer une approche cohérente de sécurité de l'organisation."],"answer":0,"explanation":"L'intention de cette PA est : Conserver l'intégrité des livrables, versions et modifications autorisées.","area":"CM","difficulty":1},{"id":"CM-EVD","kind":"preuves","q":"Lors d'un appraisal portant sur « CM », quelle preuve est la plus probante parmi ces propositions ?","options":["Estimation argumentée et données historiques","Matrice de décision et comparaison des alternatives","Politique et architecture de sécurité appliquées","Baseline approuvée et historique des modifications"],"answer":3,"explanation":"Preuves pertinentes : Inventaire des éléments, versions de référence, approbations de changement, audits de configuration.","area":"CM","difficulty":2},{"id":"CM-SCN","kind":"situation","q":"Une version publiée contient une dépendance non approuvée. Quelle action est la plus appropriée ?","options":["Décomposer le périmètre, estimer avec historique et expliciter l'incertitude.","Comparer des options sur des critères validés et documenter le choix.","Établir une stratégie de sécurité commune et en évaluer l'adoption.","Identifier la baseline concernée, tracer le changement et vérifier la conformité de la livraison."],"answer":3,"explanation":"Une réponse solide serait : Identifier la baseline concernée, tracer le changement et vérifier la conformité de la livraison.","area":"CM","difficulty":3},{"id":"CM-PIT","kind":"piège","q":"Quelle mauvaise pratique met surtout en échec « CM » ?","options":["Afficher une date sans hypothèses ni méthode.","Confondre dépôt Git et gestion complète des configurations.","Choisir une solution avant d'avoir défini les critères.","Limiter la sécurité à l'installation d'un antivirus."],"answer":1,"explanation":"Piège à éviter : Confondre dépôt Git et gestion complète des configurations.","area":"CM","difficulty":2},{"id":"CM-DOM","kind":"cartographie","q":"Dans le guide v4.0, quel domaine porte « CM » ?","options":["Fondamentaux","Travail virtuel","Sûreté","Développement"],"answer":0,"explanation":"Domaine : Fondamentaux. Certaines PA relèvent du tronc commun.","area":"CM","difficulty":1},{"id":"CM-AUD","kind":"audit","q":"Dossier CM : Une version publiée contient une dépendance non approuvée. Le responsable présente une politique validée mais au e des besoins réels.","Attribuer automatiquement le niveau de maturité 5.","Classer le point sans conserver de preuve ni consulter les équipes."],"answer":1,"explanation":"Vérification et validation répondent à deux questions complémentaires.","area":null,"difficulty":3},{"id":"C13-S","kind":"cas","q":"Cas « La sécurité sur papier » : Le registre de vulnérabilités est complet, mais les correctifs critiques ne sont jamais appliqués. Quelle est la meilleure décision ?","options":["Valider la conformité uniquement sur la base du document existant.","Attribuer automatiquement le niveau de maturité 5.","Prioriser et vérifier les remédiations selon le risque.","Classer le point sans conserver de preuve ni consulter les équipes."],"answer":2,"explanation":"Identifier un risque ne démontre pas son traitement.","area":null,"difficulty":3},{"id":"C14-S","kind":"cas","q":"Cas « La revue décorative » : Tous les tickets de revue sont validés en quelques secondes sans commentaire ni critères. Quelle est la meilleure décision ?","options":["Classer le point sans conserver de preuve ni consulter les équipes.","Évaluer l’efficacité réelle des revues et suivre les défauts.","Valider la conformité uniquement sur la base du document existant.","Attribuer automatiquement le niveau de maturité 5."],"answer":1,"explanation":"Un statut « approuvé » seul ne prouve pas une revue pertinente.","area":null,"difficulty":3},{"id":"C15-S","kind":"cas","q":"Cas « La configuration traçable » : Trois projets échantillonnés montrent des baselines approuvées, historiques de changement datés, décisions et audits de configuration cohérents, confirmés en entretien. Quelle est la meilleure décision ?","options":["Classer le point sans conserver de preuve ni consulter les équipes.","Attribuer automatiquement le niveau de maturité 5.","Valider la conformité uniquement sur la base du document existant.","Conserver les échantillons et vérifier la représentativité du périmètre."],"answer":3,"explanation":"Les traces concordantes et les entretiens montrent une mise en œuvre étayée pour les projets examinés.","area":null,"difficulty":3},{"id":"C16-S","kind":"cas","q":"Cas « Le pilotage utile » : Chaque mois, deux équipes utilisent des métriques définies pour décider d’actions; les décisions et leurs résultats sont conservés et recoupés en entretien. Quelle est la meilleure décision ?","options":["Attribuer automatiquement le niveau de maturité 5.","Classer le point sans conserver de preuve ni consulter les équipes.","Vérifier la couverture du périmètre et la continuité de ce pilotage.","Valider la conformité uniquement sur la base du document existant."],"answer":2,"explanation":"Des données, des décisions et des effets observables se renforcent mutuellement.","area":null,"difficulty":3},{"id":"C17-S","kind":"cas","q":"Cas « Le fournisseur supervisé » : Les contrats de deux fournisseurs, revues trimestrielles, évaluations de livrables et traitements d’écarts sont retrouvés avec des dates et responsables. Quelle est la meilleure décision ?","options":["Classer le point sans conserver de preuve ni consulter les équipes.","Examiner si ces preuves couvrent les fournisseurs importants du périmètre.","Valider la conformité uniquement sur la base du document existant.","Attribuer automatiquement le niveau de maturité 5."],"answer":1,"explanation":"Les accords et suivis d’exécution forment des traces convergentes.","area":null,"difficulty":3},{"id":"C18-S","kind":"cas","q":"Cas « La formation vérifiée » : Chaque équipe interrogée sait appliquer le nouveau processus, et les résultats d’évaluation des acquis sont reliés au plan de formation. Quelle est la meilleure décision ?","options":["Maintenir la mesure de compétence et réexaminer les besoins lors des changements.","Attribuer automatiquement le niveau de maturité 5.","Valider la conformité uniquement sur la base du document existant.","Classer le point sans conserver de preuve ni consulter les équipes."],"answer":0,"explanation" l indicateur aiderait le mieux Solis à évaluer une amélioration de sa fiabilité de livraison ?","options":["Le nombre de présentations mentionnant CMMI.","La durée du comité de pilotage.","Le pourcentage de livraisons respectant l’engagement sur plusieurs cycles.","Le nombre de nouvelles procédures téléchargées."],"answer":2,"explanation":"Un indicateur est utile lorsqu’il mesure le résultat métier visé ; il doit être défini et comparable.","area":null,"difficulty":2},{"id":"F01-3","kind":"fondations","q":"Que cherche-t-on à pérenniser grâce à l’amélioration des processus ?","options":["Le nombre de signatures sur les rapports.","La dépendance à une seule personne experte.","La capacité de reproduire de bons résultats entre équipes et projets.","La rapidité d’obtention d’un badge, indépendamment des résultats."],"answer":2,"explanation":"La capacité durable s’appuie sur des pratiques appliquées et améliorées, non uniquement sur des réussites isolées.","area":null,"difficulty":3},{"id":"F01-4","kind":"fondations","q":"Après l’introduction d’un nouveau modèle de compte rendu, les retards restent identiques. Quelle suite ?","options":["Analyser les causes opérationnelles des retards et mesurer les actions correctives.","Abandonner toute mesure.","Multiplier les comptes rendus.","Conclure que le niveau de maturité est nécessairement maximal."],"answer":0,"explanation":"Il faut se concentrer sur la cause et l’effet des améliorations, pas sur leur apparence administrative.","area":null,"difficulty":1},{"id":"F02-1","kind":"fondations","q":"Dans « catégorie → CA → PA → pratique », quel élément est le plus précis ?","options":["La catégorie.","La pratique.","Aucune démarche ni vérification n’est nécessaire.","La Capability Area."],"answer":1,"explanation":"La pratique est le niveau opérationnel. Le modèle complet détaille les exigences et leurs précisions, contrairement au guide résumé.","area":null,"difficulty":1},{"id":"F02-2","kind":"fondations","q":"Dans l’architecture .","area":null,"difficulty":1},{"id":"F04-2","kind":"fondations","q":"Quel élément correspond à une certification personnelle ?","options":["Un examen de connaissances assorti de conditions de formation.","Un résultat de maturité d’un service.","Un relevé de preuves opérationnelles de plusieurs projets.","Un constat de déploiement sur dix équipes."],"answer":0,"explanation":"Les conditions d’un credential portent sur l’individu ; elles ne donnent pas une note à l’entreprise.","area":null,"difficulty":2},{"id":"F04-3","kind":"fondations","q":"Que doit-on connaître avant de préparer une appraisal organisationnelle ?","options":["Le nombre de questions du quiz interne.","La couleur du certificat du responsable.","L’ancienneté du logo qualité.","L’unité organisationnelle, la portée, la méthode et la vue du modèle applicables."],"answer":3,"explanation":"Une évaluation dépend d’un périmètre et de règles officielles définies.","area":null,"difficulty":3},{"id":"F04-4","kind":"fondations","q":"Le responsable qualité obtient 98 % sur la plateforme mais ses équipes ne conservent aucune trace de revue. Quelle conclusion ?","options":["Le score montre la réussite au quiz ; il ne démontre pas la pratique des équipes.","Tous les projets sont couverts par défaut.","L’entreprise est certifiée ML3.","Une seule équipe non conforme est sans importance quelles que soient les règles."],"answer":0,"explanation":"Une performance individuelle à un exercice ne prouve ni un déploiement ni un appraisal officiel.","area":null,"difficulty":1},{"id":"F05-1","kind":"fondations","q":"Quelle combinaison soutient le mieux l’application d’un processus ?","options":["Aucune démarche ni vérification n’est nécessaire.","Des exemples datés sur plusieurs projets, des entretiens cohérents et des résultats.","Une procédure signée uniquement.","Une promesse de mise en place au trimestre prochain."],"answer":1,"explanation":"Le recoupement de traces et d’entretiens aide à distinguer les intentions, les usages et leurs effets.","area":null,"difficulty":1},{"id":"F05-2","kind":"fondations","q":"La procédure PQA est approuvée, mais personne ne peut montrer une revue réalisée. Comment qualifier la situation ?","options":["Note officielle maximale.","Mise en œuvre démontrée.","Aucune vérification d’entretien n’est nécessaire.","La procédure prouve l’intention, pas l’exécution : poursuivre l’examen des traces."],"answer":3,"explanation":"L’existence d’un dispositif est distincte de son application et de son efficacité.","area":null,"difficulty":2},{"id":"F05-3","kind":"fondations","q":"Quel trio offre le meilleur recoupement sur des revues de pairs ?","options":["Procédure seule, sans échantillon.","Fiches de revues datées, entretiens cohérents et suivi des défauts.","Une capture d’écran isolée non datée.","Déclaration du directeur, affiche et slogan."],"answer":1,"explanation":"Les traces réelles recoupées avec les explications des acteurs offrent une meilleure base de jugement.","area":null,"difficulty":3},{"id":"F05-4","kind":"fondations","q":"Pourquoi comparer plusieurs projets dans une préparation ?","options":["Pour multiplier le nombre d’onglets.","Pour vérifier si la pratique existe au-delà d’un seul exemple trié.","Pour obtenir automatiquement une note.","Pour éviter de rencontrer les équipes."],"answer":1,"explanation":"La représentativité d’un ensemble de preuves compte autant que la qualité d’un document isolé.","area":null,"difficulty":1},{"id":"F06-1","kind":"fondations","q":"Le projet pilote est irréprochable. Quelle suite est la plus judicieuse ?","options":["Retirer les projets difficiles de l’inventaire sans justification.","Examiner la représentativité du pilote et les autres parties du périmètre.","Conclure à la maturité de toutes les équipes.","Aucune démarche ni vérification n’est nécessaire."],"answer":1,"explanation":"Une pratique solide isolée n’est pas une preuve de déploiement organisationnel.","area":null,"difficulty":1},{"id":"F06-2","kind":"fondations","q":"Une entreprise possède trois agences et seule l’agence pilote suit ses processus. Peut-on généraliser ?","options":["Non, il faut définir la portée et évaluer un ensemble représentatif selon la méthode.","Oui, le pilote prouve la maîtrise des trois agences.","Oui, si le pilote est rentable.","Oui, si le directeur confirme les résultats oralement."],"answer":0,"explanation":"Une unité et un échantillonnage doivent être définis : un exemple isolé ne couvre pas nécessairement le reste.","area":null,"difficulty":2},{"id":"F06-3","kind":"fondations","q":"Quel élément fait partie du cadrage du périmètre ?","options":["Uniquement l’adresse du siège.","Les équipes, activités et projets inclus dans l’unité organisationnelle.","Le nombre de pages du guide de formation.","Uniquement le budget marketing."],"answer":1,"explanation":"Le périmètre se définit par les activités organisationnelles réellement comprises dans l’évaluation.","area":null,"difficulty":3},{"id":"F06-4","kind":"fondations","q":"Que signifie « échantillon représentatif » pour un exercice pédagogique ?","options":["Sélectionner exclusivement les documents créés la veille.","Sélectionner au hasard sans aucune justification.","Choisir le projet le plus réussi uniquement.","Examiner des exemples variés pertinents pour la portée étudiée."],"answer":3,"explanation":"Le choix d’éléments doit permettre une conclusion défendable au regard du périmètre.","area":null,"difficulty":1},{"id":"F07-1","kind":"fondations","q":"Quand une action corrective peut-elle être considérée comme efficace ?","options":["Lorsqu’un responsable dit qu’elle est terminée.","Aucune démarche ni vérification n’est nécessaire.","Quand son effet a été vérifié selon des critères appropriés.","Dès qu’une réunion a eu lieu."],"answer":2,"explanation":"Une action appliquée doit encore être évaluée ; sinon elle peut simplement déplacer ou masquer l’écart.","area":null,"difficulty":1},{"id":"F07-2","kind":"fondations","q":"Le même incident function train(){const kinds=['Tous','concept','preuves','situation','piège','cartographie','audit','fondations','cas'];const track=S.settings.track==='enterprise';return heading('ENTRAÎNEMENT INTELLIGENT','Quiz et examens blancs',`${D.questions.length} questions originales, feedback explicatif et historique des scores.`)+`<div class="trainingTiles" style="margin-bottom:19px"><button class="trainTile" data-train-type="practice"><span class="tileIcon">🎯</span><b>Entraînement libre</b><p>Réponses et explications immédiatement. Travaille tes faiblesses.</p></button><button class="trainTile" data-train-type="exam"><span class="tileIcon">⏱️</span><b>Examen blanc</b><p>Temps limité, sans correction avant la fin. Score et bilan détaillés.</p></button><button class="trainTile" data-route="audit"><span class="tileIcon">🔎</span><b>Mission d’évaluateur</b><p>Examiner des dossiers, qualifier les preuves et décider d’actions.</p></button></div><div class="quizSetup"><div class="card"><div class="sectionbar"><h3>Configurer une session</h3><span class="tag">${training.type==='exam'?'Examen blanc':'Entraînement'}</span></div><div class="field"><label>Mode de session</label><div class="difficultyGrid"><button class="selectable ${training.type==='practice'?'active':''}" data-train-type="practice"><strong>🎯</strong><small>Quiz</small></button><button class="selectable ${training.type==='exam'?'active':''}" data-train-type="exam"><strong>⏱️</strong><small>Examen</small></button><button class="selectable" data-action="errors"><strong>🔁</strong><small>Mes erreurs</small></button></div></div><div class="field"><label>Questions par session</label><div class="difficultyGrid">${[10,20,40].map(n=>`<button class="selectable ${training.num===n?'active':''}" data-num="${n}"><strong>${n}</strong><small>questions</small></button>`).join('')}</div></div><div class="field"><label>Domaine à travailler</label><select class="select" id="trainScope"><option ${training.scope==='Tous'?'selected':''}>Tous< function shuffle(xs){let a=[...xs];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(opts={}){const type=opts.type||training.type,scope=opts.scope||training.scope,kind=opts.kind||training.kind;let pool=D.questions.filter(q=>(scope==='Tous'||(areaFor(q.area)?.domain===scope)||q.area===scope||q.id.startsWith(scope+'-'))&&(kind==='Tous'||q.kind===kind));if(opts.ids)pool=D.questions.filter(q=>opts.ids.includes(q.id));if(!pool.length){toast('Aucune question disponible pour ce filtre.');return}const n=Math.min(opts.num||training.num,pool.length);session={type,pool:shuffle(pool).slice(0,n),idx:0,answers:[],selection:null,locked:false,started:Date.now(),deadline:type==='exam'?Date.now()+Math.round(n*1.3)*60000:null,done:false,source:opts.source||'session'};route='quiz';render();}
function sessionQuestion(){if(!session)return train();if(session.done)return quizResult();const q=session.pool[session.idx],a=session.answers.find(x=>x.i===session.idx),exam=session.type==='exam';const time=exam?Math.max(0,Math.ceil((session.deadline-Date.now())/1000)):null;return `<div class="quizLayout"><button class="detailBack" data-action="exitquiz">${ico('back')} Quitter la session</button><div class="card quizShell"><div class="quizProgress"><span><b>${exam?'EXAMEN BLANC':'ENTRAÎNEMENT'}</b> · Question ${session.idx+1} sur ${session.pool.length}</span><span>${exam?`⏱ <b id="timer">${Math.floor(time/60)}:${String(time%60).padStart(2,'0')}</b>`:`${Math.round((session.idx+1)/session.pool.length*100)} %`}</span></div>${pbar(session.idx/session.pool.length*100)}<div class="filterrow" style="margin:20px 0 2px"><span class="tag">${esc(q.kind)}</span><span class="muted small">Difficulté ${q.difficulty}/3</span>${q.area?`<span class="tag">${esc(q.area)}</span>`:''}</div><h2 class="quizQuestion">${esc(q.q)}</h2><div class="answers">${q.options.map((o,j)=>`<button class="answer ${session.selection===j?'chosen':''} ${a&&!exam&&j===q.answer?'correct':''} ${a&&!exam&&j===a.choice&&j!==q.answer?'wrong':''}" data-choose="${j}" ${a?'disabled':''}><span class="letter">${'ABCD'[j]}</span><span>${esc(o)}</span>${a&&!exam&&j===q.answer?'<span style="margin-left:auto;color:#148c64">✓</span>':''}</button>`).join('')}</div>${a&&!exam?`<div class="feedback ${a.correct?'':'bad'}"><b>${a.correct?'✓ Bonne réponse !':'✕ À revoir'}</b><div style="margin-top:5px">${esc(q.explanation)}</div></div>`:''}<div class="quizActions"><span class="muted small">${exam?'Correction à la fin':a?'Réponse enregistrée':'Choisis une seule réponse'}</span>${btn('nextquestion',session.idx===session.pool.length-1?'Terminer la session '+ico('check'):'Question suivante '+ico('arrow'),`primary ${session.selection===null?'disabledbutton':''}`)}</div></div><div class="muted" style="font-size:11px;text-align:center;margin-top:16px">Raccourcis : touches 1 à 4 pour répondre, Entrée pour continuer.</div></div>`}
function finishSession(){if(!session||session.done)return;session.done=true;const out=[];session.pool.forEach((q,i)=>{let a=session.answers.find(x=>x.i===i);if(!a)return;const answer={date:Date.now(),correct:a.correct,choice:a.choice};S.attempts[q.id]??=[];S.attempts[q.id].push(answer);if(S.attempts[q.id].length>25)S.attempts[q.id].shift();out.push({q,answer});if(q.area){const card=S.flash[q.area]||{ease:2.5,interval:0,due:0,streak:0};if(!a.correct){card.due=Date.now();card.streak=0}else if(!card.due){card.due=Date.now()+86400000}S.flash[q.area]=card}});let score=out.filter(x=>x.answer.correct).length,number=session.pool.length;S.scores.push({at:Date.now(),correct:score,total:number,type:session.type});S.scores=S.scores.slice(-200);activity(score*5+Math.round(score/Math.max(1,number)*20));session.finalRows=out;save();render()}
function quizResult(){const answered=session.finalRows||[],correct=answered.filter(x=>x.answer.correct).length,all=session.pool.length,percent=Math.round(correct/all*100);let wrong=answered.filter(x=>!x.answer.correct);return `<div class="quizLayout"><div class="card" style="text-align:center;padding:35px 25px"><div class="eyebrow">SESSION TERMINÉE</div><div class="resultScore">${percent}%</div><h2 style="margin:0 0 5px;font-size:24px">${percent>=85?'Excellent travail !':percent>=60?'Bonne progression !':'Continue à t’entraîner'}</h2><p class="muted" style="font-size:13px">${correct} bonnes réponses sur ${all} · ${session.type==='exam'?'Examen simulé':'Session libre'}</p>${pbar(percent)}<div class="buttonsInline" style="justify-content:center;margin:24px 0 12px">${btn('restart','Nouvelle session '+ico('arrow'))}${btn('toflash','Réviser mes erreurs','secondary')}${btn('exitquiz','Retour au tableau de bord','secondary')}</div></div><div class="card" style="margin-top:18px"><div class="sectionbar"><h3>Correction commentée</h3><span class="pill">${wrong.length} erreurs</span></div>${answered.length?answered.map(({q,answer},i)=>`<div class="review"><div style="display:flex;justify-content:space-between;gap:12px"><b>${i+1}. ${esc(q.q)}</b><span style="color:${answer.correct?'#22996e':'#c66b62'};font-weight:900">${answer.correct?'✓':'✕'}</span></div><p>Ta réponse : ${esc(q.options[answer.choice])}</p>${!answer.correct?`<p><b>Réponse attendue :</b> ${esc(q.options[q.answer])}</p>`:''}<p style="color:#33796b">${esc(q.explanation)}</p></div>`).join(''):'<div class="empty">Aucune réponse.</div>'}</div></div>`}

function flash(){currentDeck=cardsForReview();if(deckIndex>=currentDeck.length)deckIndex=0;const a=currentDeck[deckIndex],due=dueAreas().length;return heading('RÉPÉTITION ESPACÉE','Flashcards intelligentes','Mémorise durablement les 31 pratiques grâce aux rappels programmés.')+`<div class="grid2"><div><div class="card" style="margin-bottom:15px"><div class="sectionbar"><h3>Carte ${deckIndex+1} / ${currentDeck.length}</h3><span class="pill">${due} à revoir aujourd’hui</span></div><p class="muted small" style="margin:0">Récite l’objectif, les preuves et l’erreur à éviter avant de retourner la carte.</p></div><div class="deck ${deckReveal?'revealed':''}" data-action="flip" role="button" tabindex="0"><div class="deckLabel">${deckReveal?'RÉPONSE':'À TOI DE JOUER'}</div>${deckReveal?`<div><h2>${esc(a.title)}</h2><p style="font-size:14px;line-height:1.7">${esc(a.goal)}</p><p style="font-size:12px;color:#bde5dd">Preuves : ${esc(a.expected)}</p></div>`:`<h2>Que signifie <b style="color:#8be2d1">${esc(a.id)}</b> et comment le démontrer lors d’un audit ?</h2>`}<small>Cliquer pour retourner la carte</small></div>${deckReveal?`<div class="flashcontrols"><button class="secondary" data-review="again">🔁 À revoir</button><button class="secondary" data-review="good">👍 Bien</button><button class="primary" data-review="easy">✨ Facile</button></div>`:`<div class="flashcontrols"><button class="primary" data-action="flip">Voir la réponse ${ico('arrow')}</button></div>`}</div><div class="card"><h3 style="margin-top:0">Comment ça fonctionne ?</h3><p class="small muted" style="line-height:1.75">Tu évalues ton souvenir. Les cartes difficiles reviennent plus tôt ; les cartes bien assimilées sont espacées automatiquement. Les erreurs aux quiz les réactivent.</p><div class="journeyItem"><div class="journeyMarker">1</div><div><b>À revoir</b><p>La carte réapparaît très bientôt.</p></div></div><div class="journeyItem"><div class="journeyMarker">2</div><div><b>Bien</b><p>Intervalle progressivement plus long.</p></div></div><div class="journeyItem"><div class="journeyMarker">3</div><div><b>Facile</b><p>Échéance plus éloignée.</p></div></div><div class="notice">Cette répétition espacée est pédagogique ; elle ne remplace pas la pratique en entreprise.</div></div></div>`}
function reviewCard(grade){const a=currentDeck[deckIndex];if(!a)return;let x=S.flash[a.id]||{ease:2.5,interval:0,due:0,streak:0};if(grade==='again'){x.interval=0;x.streak=0;x.ease=Math.max(1.3,x.ease-.2);x.due=Date.now()+10*60000}else{ x.streak++;x.interval=x.streak===1?(grade==='easy'?3:1):x.streak===2?(grade==='easy'?8:3):Math.max(4,Math.round(x.interval*(grade==='easy'?x.ease*1.25:x.ease)));x.ease=Math.max(1.3,x.ease+(grade==='easy'?.12:0));x.due=Date.now()+x.interval*86400000;}S.flash[a.id]=x;activity(grade==='again'?1:grade==='easy'?6:4);deckReveal=false;deckIndex=(deckIndex+1)%currentDeck.length;render();toast('Carte programmée pour révision.')}
