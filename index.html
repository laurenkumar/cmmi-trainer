ve ni consulter les équipes.","Valider la conformité uniquement sur la base du document existant.","Valider l’actualisation du plan et son périmètre opérationnel.","Attribuer automatiquement le niveau de maturité 5."],"answer":2,"explanation":"Les exercices et corrections testées montrent une préparation opérationnelle.","area":null,"difficulty":3},{"id":"C20-S","kind":"cas","q":"Cas « La revue effective » : Les revues de pairs sont échantillonnées sur plusieurs équipes avec critères, défauts repérés et vérification des corrections avant approbation. Quelle est la meilleure décision ?","options":["Conserver ces traces et examiner leur efficacité dans le temps.","Attribuer automatiquement le niveau de maturité 5.","Valider la conformité uniquement sur la base du document existant.","Classer le point sans conserver de preuve ni consulter les équipes."],"answer":0,"explanation":"Les revues sont décrites, exécutées et suivies sur plusieurs échantillons.","area":null,"difficulty":3},{"id":"F01-1","kind":"fondations","q":"Une direction annonce « atteindre ML3 » comme seul objectif. Quel premier changement proposes-tu ?","options":["Rédiger trente procédures avant de consulter les équipes.","Afficher un badge ML3 dans les présentations internes.","Fixer un objectif de performance et relier les pratiques à ce résultat.","Aucune démarche ni vérification n’est nécessaire."],"answer":2,"explanation":"Une ambition de maturité doit être soutenue par des objectifs métier, des pratiques réellement utilisées et des résultats vérifiés.","area":null,"difficulty":1},{"id":"F01-2","kind":"fondations","q":"Quel indicateur aiderait le mieux Solis à évaluer une amélioration de sa fiabilité de livraison ?","options":["Le nombre de présentations mentionnant CMMI.","La durée du comité de pilotage.","Le pourcentage de livraisons respectant l’engagement sur plusieurs cycles.","Le nombre de nouvelles procédures téléchargées."],"answer":2,"explanation":"Un indicateur est utile lorsqu’il mesure le résultat métier visé ; il doit être défini et comparable.","area":null,"difficulty":2},{"id":"F01-3","kind":"fondations","q":"Que cherche-t-on à pérenniser grâce à l’amélioration des processus ?","options":["Le nombre de signatures sur les rapports.","La dépendance à une seule personne experte.","La capacité de reproduire de bons résultats entre équipes et projets.","La rapidité d’obtention d’un badge, indépendamment des résultats."],"answer":2,"explanation":"La capacité durable s’appuie sur des pratiques appliquées et améliorées, non uniquement sur des réussites isolées.","area":null,"difficulty":3},{"id":"F01-4","kind":"fondations","q":"Après l’introduction d’un nouveau modèle de compte rendu, les retards restent identiques. Quelle suite ?","options":["Analyser les causes opérationnelles des retards et mesurer les actions correctives.","Abandonner toute mesure.","Multiplier les comptes rendus.","Conclure que le niveau de maturité est nécessairement maximal."],"answer":0,"explanation":"Il faut se concentrer sur la cause et l’effet des améliorations, pas sur leur apparence administrative.","area":null,"difficulty":1},{"id":"F02-1","kind":"fondations","q":"Dans « catégorie → CA → PA → pratique », quel élément est le plus précis ?","options":["La catégorie.","La pratique.","Aucune démarche ni vérification n’est nécessaire.","La Capability Area."],"answer":1,"explanation":"La pratique est le niveau opérationnel. Le modèle complet détaille les exigences et leurs précisions, contrairement au guide résumé.","area":null,"difficulty":1},{"id":"F02-2","kind":"fondations","q":"Dans l’architecture CMMI, quelle relation est correcte ?","options":["La Capability Area rassemble des Practice Areas.","La Practice Area rassemble des catégories.","Le niveau de maturité désigne un seul outil.","La Practice Area remplace toute la documentation du modèle."],"answer":0,"explanation":"Une Capability Area rassemble des Practice Areas, chacune comportant des pratiques.","area":null,"difficulty":2},{"id":"F02-3","kind":"fondations","q":"Pourquoi le nombre de 31 PA ne suffit-il pas à décrire le périmètre d’un appraisal ?","options":["La liste des noms permet de noter une organisation.","Seules les PA dont le nom est court comptent.","Toutes les organisations ont la même vue de modèle.","Il faut choisir la vue et les pratiques applicables au domaine et au périmètre."],"answer":3,"explanation":"La sélection du modèle et le contexte opérationnel déterminent ce qui doit être examiné.","area":null,"difficulty":3},{"id":"F02-4","kind":"fondations","q":"Un tableau Excel contient « PLAN = oui ». Quelle information reste indispensable ?","options":["Les pratiques applicables, leurs traces de mise en œuvre et les projets concernés.","Le nombre de colonnes.","La couleur de la cellule.","La taille du classeur."],"answer":0,"explanation":"Une étiquette n’est ni une explication de la pratique ni une démonstration de son application.","area":null,"difficulty":1},{"id":"F03-1","kind":"fondations","q":"Une entreprise possède 40 KPI et publie un reporting mensuel. Peut-on en déduire ML4 ?","options":["Oui, tout reporting chiffré prouve la maîtrise quantitative.","Non, il faut examiner méthodes quantitatives, décisions, processus et périmètre.","Aucune démarche ni vérification n’est nécessaire.","Oui, si les KPI sont en couleur."],"answer":1,"explanation":"Le niveau 4 demande davantage que des graphiques : une gestion quantitative liée aux objectifs et aux pratiques concernées.","area":null,"difficulty":1},{"id":"F03-2","kind":"fondations","q":"Que signifient les Practice Group levels au sein d’une PA ?","options":["Un classement des membres d’équipe.","Une liste de cinq documents obligatoires identiques pour toute PA.","Des grades individuels de formation.","Des niveaux évolutifs dont les pratiques des niveaux supérieurs s’appuient sur les précédentes."],"answer":3,"explanation":"Les PG sont évolutifs et successifs ; la couverture de chaque PA dépend de sa structure réelle.","area":null,"difficulty":2},{"id":"F03-3","kind":"fondations","q":"Quel signe permet davantage de soutenir une capacité de niveau 3 ?","options":["Un processus standard, adapté aux projets et effectivement appliqué.","Un schéma préparé uniquement pour la visite.","Une seule formation suivie par le directeur.","Un calendrier de présentation au client."],"answer":0,"explanation":"Au niveau 3, l’usage cohérent des actifs et standards organisationnels est central.","area":null,"difficulty":3},{"id":"F03-4","kind":"fondations","q":"Pourquoi les KPI seuls ne prouvent-ils pas le haut niveau de maturité ?","options":["Parce que toute mesure est interdite.","Parce qu’il faut établir les méthodes quantitatives, leur utilisation et le périmètre examiné.","Parce que seul le nom des indicateurs est important.","Parce que les niveaux 4 et 5 ignorent les statistiques."],"answer":1,"explanation":"Le contrôle quantitatif exige des méthodes appropriées et une interprétation fondée sur les objectifs.","area":null,"difficulty":1},{"id":"F04-1","kind":"fondations","q":"L’entreprise veut annoncer « Nous sommes ML3 » après le succès du responsable qualité à un examen. Quel est le diagnostic ?","options":["Aucune démarche ni vérification n’est nécessaire.","Annonce valable : un examen individuel suffit.","Annonce valable après avoir rempli une auto-grille interne.","Annonce non justifiée : il faut une appraisal officielle du périmètre retenu."],"answer":3,"explanation":"Un examen valide des connaissances individuelles ; un appraisal reconnu évalue une unité organisationnelle selon les modalités officielles.","area":null,"difficulty":1},{"id":"F04-2","kind":"fondations","q":"Quel élément correspond à une certification personnelle ?","options":["Un examen de connaissances assorti de conditions de formation.","Un résultat de maturité d’un service.","Un relevé de preuves opérationnelles de plusieurs projets.","Un constat de déploiement sur dix équipes."],"answer":0,"explanation":"Les conditions d’un credential portent sur l’individu ; elles ne donnent pas une note à l’entreprise.","area":null,"difficulty":2},{"id":"F04-3","kind":"fondations","q":"Que doit-on connaître avant de préparer une appraisal organisationnelle ?","options":["Le nombre de questions du quiz interne.","La couleur du certificat du responsable.","L’ancienneté du logo qualité.","L’unité organisationnelle, la portée, la méthode et la vue du modèle applicables."],"answer":3,"explanation":"Une évaluation dépend d’un périmètre et de règles officielles définies.","area":null,"difficulty":3},{"id":"F04-4","kind":"fondations","q":"Le responsable qualité obtient 98 % sur la plateforme mais ses équipes ne conservent aucune trace de revue. Quelle conclusion ?","options":["Le score montre la réussite au quiz ; il ne démontre pas la pratique des équipes.","Tous les projets sont couverts par défaut.","L’entreprise est certifiée ML3.","Une seule équipe non conforme est sans importance quelles que soient les règles."],"answer":0,"explanation":"Une performance individuelle à un exercice ne prouve ni un déploiement ni un appraisal officiel.","area":null,"difficulty":1},{"id":"F05-1","kind":"fondations","q":"Quelle combinaison soutient le mieux l’application d’un processus ?","options":["Aucune démarche ni vérification n’est nécessaire.","Des exemples datés sur plusieurs projets, des entretiens cohérents et des résultats.","Une procédure signée uniquement.","Une promesse de mise en place au trimestre prochain."],"answer":1,"explanation":"Le recoupement de traces et d’entretiens aide à distinguer les intentions, les usages et leurs effets.","area":null,"difficulty":1},{"id":"F05-2","kind":"fondations","q":"La procédure PQA est approuvée, mais personne ne peut montrer une revue réalisée. Comment qualifier la situation ?","options":["Note officielle maximale.","Mise en œuvre démontrée.","Aucune vérification d’entretien n’est nécessaire.","La procédure prouve l’intention, pas l’exécution : poursuivre l’examen des traces."],"answer":3,"explanation":"L’existence d’un dispositif est distincte de son application et de son efficacité.","area":null,"difficulty":2},{"id":"F05-3","kind":"fondations","q":"Quel trio offre le meilleur recoupement sur des revues de pairs ?","options":["Procédure seule, sans échantillon.","Fiches de revues datées, entretiens cohérents et suivi des défauts.","Une capture d’écran isolée non datée.","Déclaration du directeur, affiche et slogan."],"answer":1,"explanation":"Les traces réelles recoupées avec les explications des acteurs offrent une meilleure base de jugement.","area":null,"difficulty":3},{"id":"F05-4","kind":"fondations","q":"Pourquoi comparer plusieurs projets dans une préparation ?","options":["Pour multiplier le nombre d’onglets.","Pour vérifier si la pratique existe au-delà d’un seul exemple trié.","Pour obtenir automatiquement une note.","Pour éviter de rencontrer les équipes."],"answer":1,"explanation":"La représentativité d’un ensemble de preuves compte autant que la qualité d’un document isolé.","area":null,"difficulty":1},{"id":"F06-1","kind":"fondations","q":"Le projet pilote est irréprochable. Quelle suite est la plus judicieuse ?","options":["Retirer les projets difficiles de l’inventaire sans justification.","Examiner la représentativité du pilote et les autres parties du périmètre.","Conclure à la maturité de toutes les équipes.","Aucune démarche ni vérification n’est nécessaire."],"answer":1,"explanation":"Une pratique solide isolée n’est pas une preuve de déploiement organisationnel.","area":null,"difficulty":1},{"id":"F06-2","kind":"fondations","q":"Une entreprise possède trois agences et seule l’agence pilote suit ses processus. Peut-on généraliser ?","options":["Non, il faut définir la portée et évaluer un ensemble représentatif selon la méthode.","Oui, le pilote prouve la maîtrise des trois agences.","Oui, si le pilote est rentable.","Oui, si le directeur confirme les résultats oralement."],"answer":0,"explanation":"Une unité et un échantillonnage doivent être définis : un exemple isolé ne couvre pas nécessairement le reste.","area":null,"difficulty":2},{"id":"F06-3","kind":"fondations","q":"Quel élément fait partie du cadrage du périmètre ?","options":["Uniquement l’adresse du siège.","Les équipes, activités et projets inclus dans l’unité organisationnelle.","Le nombre de pages du guide de formation.","Uniquement le budget marketing."],"answer":1,"explanation":"Le périmètre se définit par les activités organisationnelles réellement comprises dans l’évaluation.","area":null,"difficulty":3},{"id":"F06-4","kind":"fondations","q":"Que signifie « échantillon représentatif » pour un exercice pédagogique ?","options":["Sélectionner exclusivement les documents créés la veille.","Sélectionner au hasard sans aucune justification.","Choisir le projet le plus réussi uniquement.","Examiner des exemples variés pertinents pour la portée étudiée."],"answer":3,"explanation":"Le choix d’éléments doit permettre une conclusion défendable au regard du périmètre.","area":null,"difficulty":1},{"id":"F07-1","kind":"fondations","q":"Quand une action corrective peut-elle être considérée comme efficace ?","options":["Lorsqu’un responsable dit qu’elle est terminée.","Aucune démarche ni vérification n’est nécessaire.","Quand son effet a été vérifié selon des critères appropriés.","Dès qu’une réunion a eu lieu."],"answer":2,"explanation":"Une action appliquée doit encore être évaluée ; sinon elle peut simplement déplacer ou masquer l’écart.","area":null,"difficulty":1},{"id":"F07-2","kind":"fondations","q":"Le même incident de configuration revient après trois « résolutions ». Quelle approche ?","options":["Fermer les tickets plus vite.","Étudier les causes, mettre en œuvre une prévention et vérifier la récurrence.","Changer le libellé de l’incident.","Supprimer la catégorie concernée des statistiques."],"answer":1,"explanation":"Résoudre l’incident sans traiter sa cause peut laisser intact le mécanisme de répétition.","area":null,"difficulty":2},{"id":"F07-3","kind":"fondations","q":"Que doit comporter une action corrective exploitable ?","options":["Un responsable, une échéance, un résultat attendu et une vérification.","Une approbation anonyme.","Uniquement une phrase d’intention.","Un statut « terminé » attribué avant tout travail."],"answer":0,"explanation":"Une action doit pouvoir être exécutée, suivie et vérifiée selon une méthode adaptée.","area":null,"difficulty":3},{"id":"F07-4","kind":"fondations","q":"Quel fait indique le mieux l’efficacité d’une action ?","options":["Une mesure ultérieure montrant que le problème est évité dans le contexte examiné.","La présence à une réunion.","La date de signature de la procédure.","Une déclaration générale « plus de problème »."],"answer":0,"explanation":"La vérification des effets va au-delà de la simple clôture administrative.","area":null,"difficulty":1},{"id":"F08-1","kind":"fondations","q":"Quel élément distingue le mieux un pilotage quantitatif d’un reporting décoratif ?","options":["Des mesures définies, des analyses adaptées et des décisions reliées à des objectifs.","Des tableaux colorés mis à jour chaque heure.","Aucune démarche ni vérification n’est nécessaire.","Au moins trente indicateurs quelle que soit leur utilité."],"answer":0,"explanation":"Des méthodes quantitatives pertinentes servent à comprendre et améliorer des processus au regard d’objectifs de performance.","area":null,"difficulty":1},{"id":"F08-2","kind":"fondations","q":"Pourquoi une définition opérationnelle stable est-elle importante ?","options":["Elle remplace toute analyse.","Elle permet de comparer des observations sans changer silencieusement ce qui est compté.","Elle interdit tout changement de processus.","Elle impose d’avoir exactement 50 KPI."],"answer":1,"explanation":"Une série ne devient interprétable que si le sens des données et les règles de collecte sont connus.","area":null,"difficulty":2},{"id":"F08-3","kind":"fondations","q":"Une baisse de 40 % du temps de résolution vient de l’exclusion des dossiers difficiles. Que conclure ?","options":["La performance a nécessairement augmenté.","La comparaison est biaisée tant que la définition et le périmètre ne sont pas clarifiés.","L’entreprise a automatiquement atteint ML4.","Les chiffres sont sans valeur dans tous les cas."],"answer":1,"explanation":"L’amélioration apparente peut résulter d’un changement de population.","area":null,"difficulty":3},{"id":"F08-4","kind":"fondations","q":"Quel usage correspond à un pilotage quantitatif utile ?","options":["Décider sans consulter les résultats.","Mesurer uniquement ce qui est facile à compter.","Relier un objectif de performance à des mesures, analyses et actions évaluées.","Afficher des KPI sans les lire."],"answer":2,"explanation":"Les mesures et méthodes quantitatives servent aux décisions et à la maîtrise de la performance.","area":null,"difficulty":1},{"id":"F09-1","kind":"fondations","q":"Quelle est la durée indiquée pour l’examen Practitioner 2026 ?","options":["4 heures","2 heures","60 minutes","Sans limite de temps"],"answer":0,"explanation":"Le guide officiel de 2026 indique 4 heures.","area":"F09","difficulty":2},{"id":"F09-2","kind":"fondations","q":"Combien de questions comporte l’examen Practitioner officiel de 2026 ?","options":["60","120","40","200"],"answer":1,"explanation":"L’examen officiel comprend 120 questions.","area":"F09","difficulty":2},{"id":"F09-3","kind":"fondations","q":"Quel domaine représente la plus grande proportion du Practitioner ?","options":["People","Suppliers","Core et Virtual","Data"],"answer":2,"explanation":"Core + Virtual représente 50 %.","area":"F09","difficulty":2},{"id":"F09-4","kind":"fondations","q":"Quel préalable est requis pour le Practitioner ?","options":["Un emploi chez un partenaire","La formation Building Organizational Capability","Un Master","Aucun prérequis"],"answer":1,"explanation":"Le guide précise un préalable de formation BOC.","area":"F09","difficulty":2},{"id":"F09-5","kind":"fondations","q":"Que signifie « open-model » dans le règlement 2026 ?","options":["Internet libre","Autorisation de l’IA générative","Accès encadré au modèle sous licence et à ses notes","Communication avec un collègue"],"answer":2,"explanation":"L’accès au modèle et aux notes personnelles est encadré, d’autres ressources sont interdites.","area":"F09","difficulty":2},{"id":"F09-6","kind":"fondations","q":"Un simulateur prédit-il un succès garanti ?","options":["Oui à partir de 80 %","Non, il sert à identifier les lacunes","Oui si 120 questions","Oui s’il est en anglais"],"answer":1,"explanation":"Le résultat à un entraînement indépendant ne prédit pas la certification.","area":"F09","difficulty":2}],"domainNames":{"CORE":"Fondamentaux","DEV":"Développement","SVC":"Services","DATA":"Données","SEC":"Sécurité","SAF":"Sûreté","VRT":"Travail virtuel","SPM":"Fournisseurs","PPL":"Personnes"},"glossary":[{"term":"Appraisal","fr":"Évaluation organisationnelle","definition":"Structured examination of practices within a defined organizational unit."},{"term":"Appraisal scope","fr":"Périmètre de l’évaluation","definition":"The organizational and model boundaries to which conclusions apply."},{"term":"Organizational Unit (OU)","fr":"Unité organisationnelle","definition":"Part of an organization whose practices are evaluated."},{"term":"Maturity Level (ML)","fr":"Niveau de maturité","definition":"A rating concerning a defined set of process practices across an OU."},{"term":"Practice Area (PA)","fr":"Domaine de pratique","definition":"A collection of related practices with a common intent."},{"term":"Capability Area (CA)","fr":"Domaine de capacité","definition":"A logical group of Practice Areas supporting a common capability."},{"term":"Practice Group (PG)","fr":"Groupe de pratiques","definition":"Progressive practices within a Practice Area."},{"term":"Model view","fr":"Vue du modèle","definition":"A context-specific selection of relevant model content."},{"term":"Process asset","fr":"Actif de processus","definition":"Reusable organizational process guidance, examples, or templates."},{"term":"Tailoring","fr":"Adaptation contrôlée","definition":"Adapting a standard process according to defined rules."},{"term":"Objective evidence","fr":"Preuve objective","definition":"Verifiable information supporting a specific assessment claim."},{"term":"Corroboration","fr":"Recoupement","definition":"Agreement between distinct, independently checked evidence sources."},{"term":"Work product","fr":"Produit du travail","definition":"An artifact produced or maintained while work is performed."},{"term":"Finding","fr":"Constat","definition":"An evidence-supported conclusion about observed practice."},{"term":"Noncompliance","fr":"Non-conformité","definition":"A deviation from applicable process expectations."},{"term":"Corrective action","fr":"Action corrective","definition":"Action taken to correct a problem and avoid recurrence."},{"term":"Root cause","fr":"Cause racine","definition":"A fundamental reason contributing to an observed outcome."},{"term":"Baseline","fr":"Version de référence","definition":"An approved configuration that forms a controlled reference."},{"term":"Change control","fr":"Maîtrise des changements","definition":"Method for assessing and authorizing changes to controlled work."},{"term":"Requirements traceability","fr":"Traçabilité des exigences","definition":"Links showing how requirements connect to downstream work."},{"term":"Acceptance criteria","fr":"Critères d’acceptation","definition":"Explicit conditions for accepting a deliverable."},{"term":"Verification","fr":"Vérification","definition":"Checking a work product against specified requirements."},{"term":"Validation","fr":"Validation","definition":"Checking a solution against its intended use and stakeholder needs."},{"term":"Peer review","fr":"Revue par les pairs","definition":"Structured examination by qualified c function train(){const kinds=['Tous','concept','preuves','situation','piège','cartographie','audit','fondations','cas'];const track=S.settings.track==='enterprise';return heading('ENTRAÎNEMENT INTELLIGENT','Quiz et examens blancs',`${bank().length} ${E('questions originales, feedback explicatif et historique des scores.','original practice questions, feedback and tracked results.')}`)+`<div class="trainingTiles" style="margin-bottom:19px"><button class="trainTile" data-train-type="practice"><span class="tileIcon">🎯</span><b>Entraînement libre</b><p>Réponses et explications immédiatement. Travaille tes faiblesses.</p></button><button class="trainTile" data-train-type="exam"><span class="tileIcon">⏱️</span><b>Examen blanc</b><p>Temps limité, sans correction avant la fin. Score et bilan détaillés.</p></button><button class="trainTile" data-route="audit"><span class="tileIcon">🔎</span><b>Mission d’évaluateur</b><p>Examiner des dossiers, qualifier les preuves et décider d’actions.</p></button></div><div class="notice examBlueprint"><b>${E('Format officiel Practitioner (2026)','Official Practitioner format (2026)')}:</b> 120 questions · 240 min · Core/Virtual 50% · Development 15% · Services 15% · Security/Safety 5% · Suppliers 5% · Data 5% · People 5%. ${E('Les sessions de cette plateforme sont indépendantes et ne prédisent pas le score officiel.','These independent sessions do not predict your official score.')}</div><div class="quizSetup"><div class="card"><div class="sectionbar"><h3>Configurer une session</h3><span class="tag">${training.type==='exam'?'Examen blanc':'Entraînement'}</span></div><div class="field"><label>Mode de session</label><div class="difficultyGrid"><button class="selectable ${training.type==='practice'?'active':''}" data-train-type="practice"><strong>🎯</strong><small>Quiz</small></button><button class="selectable ${training.type==='exam'?'active':''}" data-train-type="exam"><strong>⏱️</strong><small>Examen</small></button><button class="selectable 20px">${track?'Parcours conseillé : analyse des preuves et préparation à un appraisal réel.':'Parcours conseillé : compréhension des concepts et examens blancs individuels.'}</div><button class="secondary" style="width:100%;margin-top:17px" data-route="flash">Voir les cartes à réviser ${ico('arrow')}</button></div></div>`}
function shuffle(xs){let a=[...xs];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(opts={}){
 const type=opts.type||training.type,scope=opts.scope||training.scope,kind=opts.kind||training.kind;
 let pool=bank().filter(q=>(scope==='Tous'||(areaFor(q.area)?.domain===scope)||q.area===scope||q.id.startsWith(scope+'-')||q.examDomain===scope)&&(kind==='Tous'||q.kind===kind));
 if(opts.ids)pool=bank().filter(q=>opts.ids.includes(q.id));
 if(!pool.length){toast(E('Aucune question disponible pour ce filtre.','No questions match this filter.'));return}
 const n=Math.min(opts.num||training.num,pool.length);
 let selected=shuffle(pool).slice(0,n);
 if(type==='exam'&&n===120&&scope==='Tous'&&kind==='Tous'&&!opts.ids){
   const domains=[['CORE',60],['DEV',18],['SVC',18],['SEC',6],['SPM',6],['DATA',6],['PPL',6]];
   const picked=new Set(),result=[];
   for(const [dom,count] of domains){
     const matches=shuffle(pool.filter(q=>{
       if(q.examDomain)return q.examDomain===dom;
       const a=areaFor(q.area);if(!a)return dom==='CORE';
       return dom==='CORE'?(a.domain==='CORE'||a.domain==='VRT'):dom==='SEC'?(a.domain==='SEC'||a.domain==='SAF'):a.domain===dom;
     }));
     for(const q of matches){if(result.filter(v=>v.examDomain===dom).length>=count)break;if(!picked.has(q.id)){result.push({...q,examDomain:dom});picked.add(q.id)}}
   }
   selected=shuffle([...result,...shuffle(pool.filter(q=>!picked.has(q.id))).slice(0,120-result.length)]).slice(0,120);
 }
 session={type,pool:selected,idx:0,answers:[],selection:null,locked:false,started:Date.now(),deadline:type==='exam'?Date.now()+Math.round(n*2)*60000:null,done:false,source:opts.source||'session',language:english()?'en':'fr'};
 route='quiz';render();
}
function sessionQuestion(){if(!session)return train();if(session.done)return quizResult();const q=session.pool[session.idx],a=session.answers.find(x=>x.i===session.idx),exam=session.type==='exam';const time=exam?Math.max(0,Math.ceil((session.deadline-Date.now())/1000)):null;return `<div class="quizLayout"><button class="detailBack" data-action="exitquiz">${ico('back')} Quitter la session</button><div class="card quizShell"><div class="quizProgress"><span><b>${exam?'EXAMEN BLANC':'ENTRAÎNEMENT'}</b> · Question ${session.idx+1} ${E('sur','of')} ${session.pool.length}</span><span>${exam?`⏱ <b id="timer">${Math.floor(time/60)}:${String(time%60).padStart(2,'0')}</b>`:`${Math.round((session.idx+1)/session.pool.length*100)} %`}</span></div>${pbar(session.idx/session.pool.length*100)}<div class="filterrow" style="margin:20px 0 2px"><span class="tag">${esc(q.kind)}</span><span class="muted small">${E('Difficulté','Difficulty')} ${q.difficulty}/3</span>${q.area?`<span class="tag">${esc(q.area)}</span>`:''}</div><h2 class="quizQuestion">${esc(q.q)}</h2><div class="answers">${q.options.map((o,j)=>`<button class="answer ${session.selection===j?'chosen':''} ${a&&!exam&&j===q.answer?'correct':''} ${a&&!exam&&j===a.choice&&j!==q.answer?'wrong':''}" data-choose="${j}" ${a?'disabled':''}><span class="letter">${'ABCD'[j]}</span><span>${esc(o)}</span>${a&&!exam&&j===q.answer?'<span style="margin-left:auto;color:#148c64">✓</span>':''}</button>`).join('')}</div>${a&&!exam?`<div class="feedback ${a.correct?'':'bad'}"><b>${a.correct?'✓ Bonne réponse !':'✕ À revoir'}</b><div style="margin-top:5px">${esc(q.explanation)}</div></div>`:''}<div class="quizActions"><span class="muted small">${exam?E('Correction à la fin','Correction after submitting'):a?E('Réponse enregistrée','Answer saved'):E('Choisis une seule réponse','Choose one answer')}</span>${btn('nextquestion',session.idx===session.pool.length-1?'Terminer la session '+ico('check'):'Question suivante '+ico('arrow'),`primary ${session.selection===null?'disabledbutton':''}`)}</div></div><div class="muted" style="font-size:11px;text-align:center;margin-top:16px">${E('Raccourcis : touches 1 à 4 pour répondre, Entrée pour continuer.','Keyboard shortcuts: 1–4 to answer, Enter to continue.')}</div></div>`}
function finishSession(){if(!session||session.done)return;session.done=true;const out=[];session.pool.forEach((q,i)=>{let a=session.answers.find(x=>x.i===i);if(!a)return;const answer={date:Date.now(),correct:a.correct,choice:a.choice};S.attempts[q.id]??=[];S.attempts[q.id].push(answer);if(S.attempts[q.id].length>25)S.attempts[q.id].shift();out.push({q,answer});if(q.area){const card=S.flash[q.area]||{ease:2.5,interval:0,due:0,streak:0};if(!a.correct){card.due=Date.now();card.streak=0}else if(!card.due){card.due=Date.now()+86400000}S.flash[q.area]=card}});let score=out.filter(x=>x.answer.correct).length,number=session.pool.length;S.scores.push({at:Date.now(),correct:score,total:number,type:session.type});S.scores=S.scores.slice(-200);activity(score*5+Math.round(score/Math.max(1,number)*20));session.finalRows=out;save();render()}
function quizResult(){const answered=session.finalRows||[],correct=answered.filter(x=>x.answer.correct).length,all=session.pool.length,percent=Math.round(correct/all*100);let wrong=answered.filter(x=>!x.answer.correct);return `<div class="quizLayout"><div class="card" style="text-align:center;padding:35px 25px"><div class="eyebrow">SESSION TERMINÉE</div><div class="resultScore">${percent}%</div><h2 style="margin:0 0 5px;font-size:24px">${percent>=85?'Excellent travail !':percent>=60?'Bonne progression !':'Continue à t’entraîner'}</h2><p class="muted" style="font-size:13px">${correct} bonnes réponses sur ${all} · ${session.type==='exam'?'Examen simulé':'Session libre'}</p>${pbar(percent)}<div class="buttonsInline" style="justify-content:center;margin:24px 0 12px">${btn('restart','Nouvelle session '+ico('arrow'))}${btn('toflash','Réviser mes erreurs','secondary')}${btn('exitquiz','Retour au tableau de bord','secondary')}</div></div><div class="card" style="margin-top:18px"><div class="sectionbar"><h3>Correction commentée</h3><span class="pill">${wrong.length} erreurs</span></div>${answered.length?answered.map(({q,answer},i)=>`<div class="review"><div style="display:flex;justify-content:space-between;gap:12px"><b>${i+1}. ${esc(q.q)}</b><span style="color:${answer.correct?'#22996e':'#c66b62'};font-weight:900">${answer.correct?'✓':'✕'}</span></div><p>Ta réponse : ${esc(q.options[answer.choice])}</p>${!answer.correct?`<p><b>Réponse attendue :</b> ${esc(q.options[q.answer])}</p>`:''}<p style="color:#33796b">${esc(q.explanation)}</p></div>`).join(''):'<div class="empty">Aucune réponse.</div>'}</div></div>`}
const dueAreas=()=>D.areas.filter(a=>!S.flash[a.id]||S.flash[a.id].due<=Date.now());
let currentDeck=[];
function cardsForReview(){return [...dueAreas(),...D.areas.filter(a=>S.flash[a.id]&&S.flash[a.id].due>Date.now())]}
function flash(){currentDeck=cardsForReview();if(deckIndex>=currentDeck.length)deckIndex=0;const a=currentDeck[deckIndex],due=dueAreas().length;return heading('RÉPÉTITION ESPACÉE','Flashcards intelligentes','Mémorise durablement les 31 pratiques grâce aux rappels programmés.')+`<div class="grid2"><div><div class="card" style="margin-bottom:15px"><div class="sectionbar"><h3>Carte ${deckIndex+1} / ${currentDeck.length}</h3><span class="pill">${due} à revoir aujourd’hui</span></div><p class="muted small" style="margin:0">Récite l’objectif, les preuves et l’erreur à éviter avant de retourner la carte.</p></div><div class="deck ${deckReveal?'revealed':''}" data-action="flip" role="button" tabindex="0"><div class="deckLabel">${deckReveal?'RÉPONSE':'À TOI DE JOUER'}</div>${deckReveal?`<div><h2>${esc(lessonName(a))}</h2><p style="font-size:14px;line-height:1.7">${esc(lessonSummary(a))}</p><p style="font-size:12px;color:#bde5dd">Preuves : ${esc(a.expected)}</p></div>`:`<h2>Que signifie <b style="color:#8be2d1">${esc(a.id)}</b> et comment le démontrer lors d’un audit ?</h2>`}<small>Cliquer pour retourner la carte</small></div>${deckReveal?`<div class="flashcontrols"><button class="secondary" data-review="again">🔁 À revoir</button><button class="secondary" data-review="good">👍 Bien</button><button class="primary" data-review="easy">✨ Facile</button></div>`:`<div class="flashcontrols"><button class="primary" data-action="flip">Voir la réponse ${ico('arrow')}</button></div>`}</div><div class="card"><h3 style="margin-top:0">Comment ça fonctionne ?</h3><p class="small muted" style="line-height:1.75">Tu évalues ton souvenir. Les cartes difficiles reviennent plus tôt ; les cartes bien assimilées sont espacées automatiquement. Les erreurs aux quiz les réactivent.</p><div class="journeyItem"><div class="journeyMarker">1</div><div><b>À revoir</b><p>La carte réapparaît très bientôt.</p></div></div><div class="journeyItem"><div class="journeyMarker">2</div><div><b>Bien</b><p>Intervalle p  const lt=e.target.closest('[data-lesson-tab]');if(lt){lessonTab=Number(lt.dataset.lessonTab);if(selectedLesson){S.lessonVisited=S.lessonVisited||{};S.lessonVisited[selectedLesson]=[...new Set([...(S.lessonVisited[selectedLesson]||[0]),lessonTab])];save()}render();window.scrollTo({top:200,behavior:'smooth'});return}
 const ls=e.target.closest('[data-lesson-stage]');if(ls){lessonStage=Number(ls.dataset.lessonStage);render();return}
 const lc=e.target.closest('[data-lesson-choice]');if(lc){const v=Number(lc.dataset.lessonChoice);const k=selectedLesson;const l=allLessons.find(x=>x.id===k);const ok=v===l.deep.correct;S.lessonMissions=S.lessonMissions||{};const previous=S.lessonMissions[k]?.passed;if(ok&&!previous)activity(15);S.lessonMissions[k]={choice:v,passed:ok||previous||false};save();render();return}
 const nn=e.target.closest('[data-num]');if(nn){training.num=Number(nn.dataset.num);render();return}
 const choose=e.target.closest('[data-choose]');if(choose){answerQuiz(Number(choose.dataset.choose));return}
 const rating=e.target.closest('[data-audit-rate]');if(rating&&!auditRevealed){auditSelection=rating.dataset.auditRate;render();return}
 const rev=e.target.closest('[data-review]');if(rev){reviewCard(rev.dataset.review);return}
 const action=e.target.closest('[data-action]');if(!action)return;const a=action.dataset.action;
 if(a==='prevtab'){lessonTab=Math.max(0,lessonTab-1);if(selectedLesson){S.lessonVisited=S.lessonVisited||{};S.lessonVisited[selectedLesson]=[...new Set([...(S.lessonVisited[selectedLesson]||[0]),lessonTab])];save()}render();window.scrollTo({top:200,behavior:'smooth'});return}
 if(a==='nexttab'){lessonTab=Math.min(3,lessonTab+1);if(selectedLesson){S.lessonVisited=S.lessonVisited||{};S.lessonVisited[selectedLesson]=[...new Set([...(S.lessonVisited[selectedLesson]||[0]),lessonTab])];save()}render();window.scrollTo({top:200,behavior:'smooth'});return}
 if(a==='prevstage'){lessonStage=Math.max(0,lessonStage-1);render();return}
 if(a==='nextstage'){lessonStage=Math.min(3,lessonStage+1);render();return}
 if(a==='resetmission'){if(selectedLesson&&S.lessonMissions?.[selectedLesson]){delete S.lessonMissions[selectedLesson].choice;save();render()}return}
 if(a==='glossquiz'){vocabularyQuiz();return}
 if(a==='menu'){mobileMenu=!mobileMenu;render();return}
 if(a==='continue'){const n=allLessons.find(l=>!isMastered(l.id))||allLessons[0];selectedLesson=n.id;lessonTab=0;lessonStage=0;route='learn';render();return}
 if(a==='complete'){let id=action.dataset.id;if(!S.lessonMissions?.[id]?.passed){toast('Réussis d’abord l’atelier interactif de cette leçon.');return}if(!S.completed.includes(id)){S.completed.push(id);activity(20);toast('Leçon terminée ! +20 XP')}else toast('Leçon déjà terminée.');render();return}
 if(a==='lessonquiz'){let ar=action.dataset.area;startQuiz({scope:ar,num:ar.startsWith('F')?4:7,type:'practice'});return}
 if(a==='start'){training.scope=$('#trainScope')?.value||'Tous';training.kind=$('#trainKind')?.value||'Tous';startQuiz();return}
 if(a==='quick'){startQuiz({type:'practice',num:10,scope:'Tous',kind:'Tous'});return}
 if(a==='errors'){const ids=bank().filter(q=>(S.attempts[q.id]||[]).some(a=>!a.correct)).map(q=>q.id);if(!ids.length){toast('Aucune erreur enregistrée pour le moment.');return}startQuiz({ids,num:Math.min(20,ids.length),type:'practice'});return}
 if(a==='nextquestion'){prevNextQuiz();return}
 if(a==='exitquiz'){routeTo('train');return}
 if(a==='restart'){routeTo('train');return}
 if(a==='toflash'){routeTo('flash');return}
 if(a==='flip'){deckReveal=!deckReveal;render();return}
 if(a==='validatecase'){if(!auditSelection)return;let c=D.cases[auditIndex%D.cases.length];let note=$('#auditNote')?.value||'';S.auditNotes[c.id]=note;const first=!S.auditAnswers[c.id];S.auditAnswers[c.id]=auditSelection;auditRevealed=true;if(first)activity(auditSelection===c.rating?10:3);save();render();return}
 if(a==='nextcase'){auditIndex=(auditIndex+1)%D.cases.length;auditSelection=null;auditRevealed=false;render();return}
 if(a==='prevcase'){auditIndex=Math.max(0,auditIndex-1);auditSelection=null;auditRevealed=false;render();return}
 if(a==='matrixcsv'){let lines=['Code,Practice Area,Domaine,Evaluation',...D.areas.map(x=>[x.id,'"'+x.title.replaceAll('"','""')+'"',x.domainName,S.auditMatrix[x.id]||'Non évalué'].join(','))];dl('cmmi-grille-preuves.csv','\ufeff'+lines.join('\n'),'text/csv;charset=utf-8');toast('Grille CSV téléchargée.');return}
 if(a==='savesettings'){S.settings.track=$('#track').value;S.settings.level=$('#level').value;S.settings.target=$('#goaldate').value||'';save();toast('Préférences enregistrées.');render();return}
 if(a==='export'){dl('cmmi-academy-progression.json',JSON.stringify({app:'CMMI Academy',version:1,exportedAt:new Date().toISOString(),progress:S},null,2));return}
 if(a==='reset'){if(confirm('Supprimer toute ta progression dans ce navigateur ?')){S=defaultState();save();routeTo('home');toast('Progression réinitialisée.')}return}
});
document.addEventListener('input',e=>{if(e.target.id==='auditNote'){S.auditNotes[D.cases[auditIndex%D.cases.length].id]=e.target.value;save();return}if(e.target.id==='glossarysearch'){glossaryFilter=e.target.value;let pos=e.target.selectionStart;render();let el=$('#glossarysearch');if(el){el.focus();el.setSelectionRange(pos,pos)}return}if(e.target.id==='lessonsearch'||e.target.id==='librarysearch'){const val=e.target.value;query=val;let fieldId=e.target.id;let pos=e.target.selectionStart;render();const f=document.getElementById(fieldId);if(f){f.focus();f.setSelectionRange(pos,pos)}}});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.matrix){S.auditMatrix[t.dataset.matrix]=t.value;save();render()}if(t.id==='trainScope')training.scope=t.value;if(t.id==='trainKind')training.kind=t.value;if(t.id==='importfile'&&t.files?.[0]){try{let v=JSON.parse(await t.files[0].text());if(v.app!=='CMMI Academy'||!v.progress||!Array.isArray(v.progress.completed))throw Error('Fichier non reconnu');S={...defaultState(),...v.progress,settings:{...defaultState().settings,...v.progress.settings}};save();render();toast('Progression importée.')}catch(err){toast('Import impossible : '+err.message)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mobileMenu){mobileMenu=false;render();return}if(e.target.matches('input,textarea,select'))return;if(route==='quiz'&&session&&!session.done){if(['1','2','3','4'].includes(e.key))answerQuiz(Number(e.key)-1);if(e.key==='Enter')prevNextQuiz()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-lesson],[data-action="flip"]')){e.preventDefault();e.target.click()}});
render();
})();
</script></body></html>
