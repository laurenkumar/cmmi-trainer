vre développement des actifs de processus dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — absence de capitalisation entre projets — elle doit aller au-delà des intentions. Cette Practice Area aide à produire et maintenir les standards, modèles et outils communs de travail.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA PAD n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour PAD, on attend notamment des traces telles que : bibliothèque de processus, gabarits, guides de personnalisation et mises à jour.","**La distinction importante.** Un risque typique serait de faire de chaque nouveau projet un processus entièrement différent. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Définir les actifs communs utiles"],["02 · Organiser","Produire standards et modèles"],["03 · Appliquer","Publier et rendre accessibles les actifs"],["04 · Vérifier","Améliorer selon les retours terrain"]],"story":"**Mission terrain.** Quatre équipes produisent chacune leur propre modèle de revue. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Créer un actif commun, le maintenir et permettre une adaptation maîtrisée. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Quatre équipes produisent chacune leur propre modèle de revue. » Quelle réponse est la plus défendable ?","choices":["Créer un actif commun, le maintenir et permettre une adaptation maîtrisée.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Faire de chaque nouveau projet un processus entièrement différent."],"correct":0,"why":"La bonne décision répond au problème constaté : Créer un actif commun, le maintenir et permettre une adaptation maîtrisée. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["PAD","Développement des actifs de processus"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Référentiel de processus et historique de ses versions","Traces d'exécution : Bibliothèque de processus, gabarits, guides de personnalisation et mises à jour.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":20,"evidenceContrast":["Les modèles et méthodes communs sont accessibles, adaptés et enrichis par les retours.","Une bibliothèque figée ne sert pas aux projets."],"levelFr":{"1":"Identifier les besoins d’actifs de processus","2":"Concevoir et mettre à disposition les actifs utiles aux équipes","3":"Déployer, actualiser et enrichir une bibliothèque organisationnelle d’actifs"}},"duration":25,"isExpanded":true,"en":{"title":"Process Asset Development","summary":"Create and maintain reusable organizational process assets","kicker":"From process intent to verifiable outcomes: Process Asset Development","paragraphs":["**The business problem.** Create and maintain reusable organizational process assets. In a realistic organization, this means deciding which outcomes must improve and which people or teams are responsible. The goal is not to produce paperwork for an auditor: it is to make the activity reliable when circumstances change.","**A concrete example.** Four teams independently build their own review templates. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** Identify common needs, publish controlled templates, support tailoring and collect improvements. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for process library, template history, tailoring guidance. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** inventing every process from scratch for each project."],"steps":[["01 · Define","Discover reusable process needs"],["02 · Prepare","Develop common guidance and templates"],["03 · Perform","Publish and control assets"],["04 · Review","Collect feedback and maintain assets"]],"story":"**Case file — fictional organization.** Four teams independently build their own review templates. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to identify common needs, publish controlled templates, support tailoring and collect improvements. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the PAD problem described in the case?","choices":["Document the intention without changing how the team works.","Identify common needs, publish controlled templates, support tailoring and collect improvements","Declare full maturity because the process has an owner."],"correct":1,"why":"Process Asset Development requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["process asset","Reusable organizational guidance, data or template"],["tailoring","Controlled adaptation of a standard process to a context"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual PAD process.","Dated artifacts show the practice performed: Process library, template history, tailoring guidance.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous process library, template history, tailoring guidance tied to real work.","Weaker: inventing every process from scratch for each project; no trace of consistent use."],"levelFr":{"1":"Begin addressing process asset development, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable process asset development work. For example: Develop common guidance and templates; publish and control assets.","3":"Use a shared organizational approach to process asset development; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets."},"scenario":"Four teams independently build their own review templates","pitfall":"Inventing every process from scratch for each project","action":"Identify common needs, publish controlled templates, support tailoring and collect improvements","evidence":"Process library, template history, tailoring guidance"}},{"id":"PCM","title":"Gestion des processus","domain":"CORE","page":21,"goal":"Piloter l'amélioration des processus selon les besoins de l'organisation.","evidence":"Plan d'amélioration, évaluations, priorités, déploiements, effets mesurés.","pitfall":"Confondre mise en conformité et amélioration de la performance.","scenario":"Des suggestions d'amélioration restent sans décision pendant un an.","response":"Prioriser, expérimenter, déployer et mesurer les résultats.","symptom":"Améliorations sans pilotage ni bénéfices","expected":"Backlog d'amélioration et évaluations d'impact","domainName":"Fondamentaux","lesson":["Pourquoi : Piloter l'amélioration des processus selon les besoins de l'organisation.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Plan d'amélioration, évaluations, priorités, déploiements, effets mesurés.","Erreur fréquente : Confondre mise en conformité et amélioration de la performance.","Situation pratique : Des suggestions d'amélioration restent sans décision pendant un an. Réponse attendue : Prioriser, expérimenter, déployer et mesurer les résultats."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces.","3":"La pratique s’appuie sur un standard organisationnel adapté et capitalisé.","4":"Pilotage avancé de la pratique à partir de résultats et de méthodes quantitatives, selon le modèle officiel."},"officialPracticeCount":12,"source":"Guide CMMI v4.0 (2026), p. 21","deep":{"kicker":"Apprendre à faire vivre gestion des processus dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — améliorations sans pilotage ni bénéfices — elle doit aller au-delà des intentions. Cette Practice Area aide à piloter l'amélioration des processus selon les besoins de l'organisation.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA PCM n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour PCM, on attend notamment des traces telles que : plan d'amélioration, évaluations, priorités, déploiements, effets mesurés.","**La distinction importante.** Un risque typique serait de confondre mise en conformité et amélioration de la performance. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Identifier les besoins de processus"],["02 · Organiser","Déployer la stratégie organisationnelle"],["03 · Appliquer","Évaluer efficacité et cohérence"],["04 · Vérifier","Piloter les évolutions de processus"]],"story":"**Mission terrain.** Des suggestions d'amélioration restent sans décision pendant un an. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Prioriser, expérimenter, déployer et mesurer les résultats. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Des suggestions d'amélioration restent sans décision pendant un an. » Quelle réponse est la plus défendable ?","choices":["Prioriser, expérimenter, déployer et mesurer les résultats.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Confondre mise en conformité et amélioration de la performance."],"correct":0,"why":"La bonne décision répond au problème constaté : Prioriser, expérimenter, déployer et mesurer les résultats. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["PCM","Gestion des processus"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Backlog d'amélioration et évaluations d'impact","Traces d'exécution : Plan d'amélioration, évaluations, priorités, déploiements, effets mesurés.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":21,"evidenceContrast":["Une stratégie de processus est déployée puis évaluée et améliorée selon les résultats.","Un chantier de processus s’arrête dès la publication du manuel."],"levelFr":{"1":"Mettre en place un appui aux processus, identifier points forts, limites et améliorations","2":"Planifier et conduire des améliorations des processus et des actifs","3":"Aligner objectifs et déploiement des processus communs, puis mesurer les effets","4":"Valider les améliorations à l’aide de techniques statistiques et quantitatives"}},"duration":25,"isExpanded":true,"en":{"title":"Process Management","summary":"Steer organizational process improvement using evidence and business priorities","kicker":"From process intent to verifiable outcomes: Process Management","paragraphs":["**The business problem.** Steer organizational process improvement using evidence and business priorities. In a realistic organization, this means deciding which outcomes must improve and which people or teams are responsible. The goal is not to produce paperwork for an auditor: it is to make the activity reliable when circumstances change.","**A concrete example.** Improvement suggestions remain unreviewed for a year. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** Prioritize process needs, assign improvement owners, deploy changes and measure benefits. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for improvement backlog, decisions, effectiveness results. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** treating compliance checklists as the whole improvement strategy."],"steps":[["01 · Define","Identify performance gaps"],["02 · Prepare","Prioritize improvements"],["03 · Perform","Pilot and deploy changes"],["04 · Review","Measure benefits and refine"]],"story":"**Case file — fictional organization.** Improvement suggestions remain unreviewed for a year. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to prioritize process needs, assign improvement owners, deploy changes and measure benefits. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the PCM problem described in the case?","choices":["Document the intention without changing how the team works.","Prioritize process needs, assign improvement owners, deploy changes and measure benefits","Declare full maturity because the process has an owner."],"correct":1,"why":"Process Management requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["process improvement","A deliberate change intended to improve a process result"],["improvement backlog","A prioritized list of proposed process changes"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual PCM process.","Dated artifacts show the practice performed: Improvement backlog, decisions, effectiveness results.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous improvement backlog, decisions, effectiveness results tied to real work.","Weaker: treating compliance checklists as the whole improvement strategy; no trace of consistent use."],"levelFr":{"1":"Begin addressing process management, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable process management work. For example: Prioritize improvements; pilot and deploy changes.","3":"Use a shared organizational approach to process management; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets.","4":"Apply suitable quantitative or statistical methods to understand and control performance of process management activities."},"scenario":"Improvement suggestions remain unreviewed for a year","pitfall":"Treating compliance checklists as the whole improvement strategy","action":"Prioritize process needs, assign improvement owners, deploy changes and measure benefits","evidence":"Improvement backlog, decisions, effectiveness results"}},{"id":"PQA","title":"Assurance qualité des processus","domain":"CORE","page":22,"goal":"Vérifier objectivement l'application des processus et remonter les écarts.","evidence":"Plans d'assurance qualité, audits, non-conformités, preuves de résolution.","pitfall":"Laisser l'équipe juger seule de sa conformité sans regard objectif.","scenario":"Les procédures sont publiées mais aucune vérification n'est faite.","response":"Réaliser des vérifications objectives, enregistrer les écarts et les escalader.","symptom":"Écarts processus invisibles à la direction","expected":"Rapports objectifs de conformité et clôture des écarts","domainName":"Fondamentaux","lesson":["Pourquoi : Vérifier objectivement l'application des processus et remonter les écarts.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Plans d'assurance qualité, audits, non-conformités, preuves de résolution.","Erreur fréquente : Laisser l'équipe juger seule de sa conformité sans regard objectif.","Situation pratique : Les procédures sont publiées mais aucune vérification n'est faite. Réponse attendue : Réaliser des vérifications objectives, enregistrer les écarts et les escalader."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces.","3":"La pratique s’appuie sur un standard organisationnel adapté et capitalisé."},"officialPracticeCount":6,"source":"Guide CMMI v4.0 (2026), p. 22","deep":{"kicker":"Apprendre à faire vivre assurance qualité des processus dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — écarts processus invisibles à la direction — elle doit aller au-delà des intentions. Cette Practice Area aide à vérifier objectivement l'application des processus et remonter les écarts.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA PQA n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour PQA, on attend notamment des traces telles que : plans d'assurance qualité, audits, non-conformités, preuves de résolution.","**La distinction importante.** Un risque typique serait de laisser l'équipe juger seule de sa conformité sans regard objectif. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Définir critères d’assurance qualité"],["02 · Organiser","Évaluer objectivement les pratiques"],["03 · Appliquer","Faire traiter les écarts relevés"],["04 · Vérifier","Vérifier l’efficacité et communiquer"]],"story":"**Mission terrain.** Les procédures sont publiées mais aucune vérification n'est faite. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Réaliser des vérifications objectives, enregistrer les écarts et les escalader. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Les procédures sont publiées mais aucune vérification n'est faite. » Quelle réponse est la plus défendable ?","choices":["Réaliser des vérifications objectives, enregistrer les écarts et les escalader.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Laisser l'équipe juger seule de sa conformité sans regard objectif."],"correct":0,"why":"La bonne décision répond au problème constaté : Réaliser des vérifications objectives, enregistrer les écarts et les escalader. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["PQA","Assurance qualité des processus"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Rapports objectifs de conformité et clôture des écarts","Traces d'exécution : Plans d'assurance qualité, audits, non-conformités, preuves de résolution.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":22,"evidenceContrast":["Un examen indépendant relève un écart et suit le traitement jusqu’à vérification.","Le propriétaire du processus s’auto-déclare conforme sans examen."],"levelFr":{"1":"Évaluer certains produits ou processus","2":"Évaluer objectivement le travail, signaler les écarts et suivre leur résolution","3":"Déployer une démarche d’assurance qualité cohérente à l’échelle de l’organisation"}},"duration":25,"isExpanded":true,"en":{"title":"Process Quality Assurance","summary":"Evaluate process use objectively and resolve process noncompliance","kicker":"From process intent to verifiable outcomes: Process Quality Assurance","paragraphs":["**The business problem.** Evaluate process use objectively and resolve process noncompliance. In a realistic organization, this means deciding which outcomes must improve and which people or teams are responsible. The goal is not to produce paperwork for an auditor: it is to make the activity reliable when circumstances change.","**A concrete example.** Procedures are published but no one checks actual use. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** Plan objective checks, record findings, communicate them and track resolution. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for evaluation criteria, noncompliance log, closure evidence. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** letting the same team be its only independent assurance."],"steps":[["01 · Define","Define objective evaluation criteria"],["02 · Prepare","Examine actual practice"],["03 · Perform","Communicate findings"],["04 · Review","Track corrective resolution"]],"story":"**Case file — fictional organization.** Procedures are published but no one checks actual use. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to plan objective checks, record findings, communicate them and track resolution. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the PQA problem described in the case?","choices":["Document the intention without changing how the team works.","Plan objective checks, record findings, communicate them and track resolution","Declare full maturity because the process has an owner."],"correct":1,"why":"Process Quality Assurance requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["noncompliance","Failure to meet an applicable process expectation"],["objectivity","Evaluating evidence against known criteria without bias"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual PQA process.","Dated artifacts show the practice performed: Evaluation criteria, noncompliance log, closure evidence.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous evaluation criteria, noncompliance log, closure evidence tied to real work.","Weaker: letting the same team be its only independent assurance; no trace of consistent use."],"levelFr":{"1":"Begin addressing process quality assurance, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable process quality assurance work. For example: Examine actual practice; communicate findings.","3":"Use a shared organizational approach to process quality assurance; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets."},"scenario":"Procedures are published but no one checks actual use","pitfall":"Letting the same team be its only independent assurance","action":"Plan objective checks, record findings, communicate them and track resolution","evidence":"Evaluation criteria, noncompliance log, closure evidence"}},{"id":"PI","title":"Intégration du produit","domain":"DEV","page":23,"goal":"Assembler des composants cohérents pour livrer une solution opérationnelle.","evidence":"Plan d'intégration, interfaces, builds reproductibles, résultats d'intégration.","pitfall":"Attendre la fin pour tester la compatibilité des composants.","scenario":"Deux modules fonctionnent séparément mais échouent lorsqu'on les assemble.","response":"Planifier les intégrations, tester les interfaces et gérer les défauts.","symptom":"Échecs répétés lors des assemblages","expected":"Journal d'intégration et tests d'interface","domainName":"Développement","lesson":["Pourquoi : Assembler des composants cohérents pour livrer une solution opérationnelle.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Plan d'intégration, interfaces, builds reproductibles, résultats d'intégration.","Erreur fréquente : Attendre la fin pour tester la compatibilité des composants.","Situation pratique : Deux modules fonctionnent séparément mais échouent lorsqu'on les assemble. Réponse attendue : Planifier les intégrations, tester les interfaces et gérer les défauts."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces.","3":"La pratique s’appuie sur un standard organisationnel adapté et capitalisé."},"officialPracticeCount":10,"source":"Guide CMMI v4.0 (2026), p. 23","deep":{"kicker":"Apprendre à faire vivre intégration du produit dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — échecs répétés lors des assemblages — elle doit aller au-delà des intentions. Cette Practice Area aide à assembler des composants cohérents pour livrer une solution opérationnelle.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA PI n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour PI, on attend notamment des traces telles que : plan d'intégration, interfaces, builds reproductibles, résultats d'intégration.","**La distinction importante.** Un risque typique serait de attendre la fin pour tester la compatibilité des composants. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Définir la stratégie d’intégration"],["02 · Organiser","Préparer les interfaces et composants"],["03 · Appliquer","Assembler et tester les ensembles"],["04 · Vérifier","Livrer avec des critères d’acceptation"]],"story":"**Mission terrain.** Deux modules fonctionnent séparément mais échouent lorsqu'on les assemble. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Planifier les intégrations, tester les interfaces et gérer les défauts. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Deux modules fonctionnent séparément mais échouent lorsqu'on les assemble. » Quelle réponse est la plus défendable ?","choices":["Planifier les intégrations, tester les interfaces et gérer les défauts.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Attendre la fin pour tester la compatibilité des composants."],"correct":0,"why":"La bonne décision répond au problème constaté : Planifier les intégrations, tester les interfaces et gérer les défauts. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["PI","Intégration du produit"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Journal d'intégration et tests d'interface","Traces d'exécution : Plan d'intégration, interfaces, builds reproductibles, résultats d'intégration.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":23,"evidenceContrast":["L’intégration suit des règles d’interface, des essais progressifs et une validation du livrable.","Les composants passent leurs tests isolés mais échouent ensemble."],"levelFr":{"1":"Assembler la solution et la remettre au destinataire","2":"Préparer environnements, composants et règles, puis intégrer et évaluer la solution","3":"Maîtriser les interfaces, leur cohérence et la compatibilité des composants"}},"duration":25,"isExpanded":true,"en":{"title":"Product Integration","summary":"Assemble components into a functioning solution while managing interfaces","kicker":"From process intent to verifiable outcomes: Product Integration","paragraphs":["**The business problem.** Assemble components into a functioning solution while managing interfaces. In a realistic organization, this means deciding which outcomes must improve and which people or teams are responsible. The goal is not to produce paperwork for an auditor: it is to make the activity reliable when circumstances change.","**A concrete example.** Two modules pass independent tests but fail when combined. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** Plan integration order, define interface contracts, build increments and test interactions. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for integration plan, interface specifications, build test results. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** postponing interface validation until release week."],"steps":[["01 · Define","Map components and interfaces"],["02 · Prepare","Plan integration sequence"],["03 · Perform","Integrate incrementally"],["04 · Review","Verify combined behavior"]],"story":"**Case file — fictional organization.** Two modules pass independent tests but fail when combined. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to plan integration order, define interface contracts, build increments and test interactions. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the PI problem described in the case?","choices":["Document the intention without changing how the team works.","Plan integration order, define interface contracts, build increments and test interactions","Declare full maturity because the process has an owner."],"correct":1,"why":"Product Integration requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["interface","A defined point of interaction between components"],["integration environment","A controlled setup used to combine and test components"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual PI process.","Dated artifacts show the practice performed: Integration plan, interface specifications, build test results.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous integration plan, interface specifications, build test results tied to real work.","Weaker: postponing interface validation until release week; no trace of consistent use."],"levelFr":{"1":"Begin addressing product integration, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable product integration work. For example: Plan integration sequence; integrate incrementally.","3":"Use a shared organizational approach to product integration; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets."},"scenario":"Two modules pass independent tests but fail when combined","pitfall":"Postponing interface validation until release week","action":"Plan integration order, define interface contracts, build increments and test interactions","evidence":"Integration plan, interface specifications, build test results"}},{"id":"RDM","title":"Développement et gestion des exigences","domain":"CORE","page":24,"goal":"Recueillir, clarifier, maintenir et tracer les exigences et leurs changements.","evidence":"Backlog validé, critères d'acceptation, traçabilité et historique des modifications.","pitfall":"Coder immédiatement une demande orale non clarifiée.","scenario":"Un client change une règle métier et l'équipe n'en mesure pas l'effet.","response":"Analyser, négocier, tracer et communiquer le changement d'exigence.","symptom":"Besoins ambigus et changements non maîtrisés","expected":"Exigences approuvées et matrice de traçabilité","domainName":"Fondamentaux","lesson":["Pourquoi : Recueillir, clarifier, maintenir et tracer les exigences et leurs changements.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Backlog validé, critères d'acceptation, traçabilité et historique des modifications.","Erreur fréquente : Coder immédiatement une demande orale non clarifiée.","Situation pratique : Un client change une règle métier et l'équipe n'en mesure pas l'effet. Réponse attendue : Analyser, négocier, tracer et communiquer le changement d'exigence."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces.","3":"La pratique s’appuie sur un standard organisationnel adapté et capitalisé."},"officialPracticeCount":13,"source":"Guide CMMI v4.0 (2026), p. 24","deep":{"kicker":"Apprendre à faire vivre développement et gestion des exigences dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — besoins ambigus et changements non maîtrisés — elle doit aller au-delà des intentions. Cette Practice Area aide à recueillir, clarifier, maintenir et tracer les exigences et leurs changements.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA RDM n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour RDM, on attend notamment des traces telles que : backlog validé, critères d'acceptation, traçabilité et historique des modifications.","**La distinction importante.** Un risque typique serait de coder immédiatement une demande orale non clarifiée. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Recueillir les besoins des parties prenantes"],["02 · Organiser","Analyser et clarifier les exigences"],["03 · Appliquer","Maîtriser les changements et la trace"],["04 · Vérifier","Vérifier l’accord sur les exigences"]],"story":"**Mission terrain.** Un client change une règle métier et l'équipe n'en mesure pas l'effet. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Analyser, négocier, tracer et communiquer le changement d'exigence. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Un client change une règle métier et l'équipe n'en mesure pas l'effet. » Quelle réponse est la plus défendable ?","choices":["Analyser, négocier, tracer et communiquer le changement d'exigence.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Coder immédiatement une demande orale non clarifiée."],"correct":0,"why":"La bonne décision répond au problème constaté : Analyser, négocier, tracer et communiquer le changement d'exigence. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["RDM","Développement et gestion des exigences"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Exigences approuvées et matrice de traçabilité","Traces d'exécution : Backlog validé, critères d'acceptation, traçabilité et historique des modifications.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":24,"evidenceContrast":["Les exigences sont clarifiées, tracées et mises à jour après décisions de changement.","Un besoin oral évolue sans historique ni accord."],"levelFr":{"1":"Recueillir et comprendre les exigences","2":"Élaborer, maintenir, négocier et tracer les exigences avec les parties prenantes","3":"Déployer une approche organisationnelle de gestion et développement des exigences"}},"duration":25,"isExpanded":true,"en":{"title":"Requirements Development and Management","summary":"Elicit, analyze, maintain and trace stakeholder requirements","kicker":"From process intent to verifiable outcomes: Requirements Development and Management","paragr rs.","question":"Which response best addresses the RDM problem described in the case?","choices":["Document the intention without changing how the team works.","Clarify stakeholder needs, set acceptance conditions, trace changes and assess downstream effects","Declare full maturity because the process has an owner."],"correct":1,"why":"Requirements Development and Management requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["traceability","Ability to link a requirement to its source and downstream work"],["acceptance criterion","A testable condition used to judge whether a need is satisfied"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual RDM process.","Dated artifacts show the practice performed: Approved requirements, traceability links, change analysis.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous approved requirements, traceability links, change analysis tied to real work.","Weaker: implementing an ambiguous verbal request immediately; no trace of consistent use."],"levelFr":{"1":"Begin addressing requirements development and management, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable requirements development and management work. For example: Refine and agree requirements; trace and control changes.","3":"Use a shared organizational approach to requirements development and management; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets."},"scenario":"A customer requests a rule change with no impact analysis","pitfall":"Implementing an ambiguous verbal request immediately","action":"Clarify stakeholder needs, set accept
