nsufficient on its own.","glossary":[["risk exposure","Potential consequence of an uncertain event"],["risk trigger","An observable signal that a risk may be occurring"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual RSK process.","Dated artifacts show the practice performed: Risk register, response plan, review log.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous risk register, response plan, review log tied to real work.","Weaker: completing a risk register once and never revisiting it; no trace of consistent use."],"levelFr":{"1":"Begin addressing risk and opportunity management, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable risk and opportunity management work. For example: Estimate likelihood and impact; choose owners and response actions.","3":"Use a shared organizational approach to risk and opportunity management; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets."},"scenario":"A supplier dependency endangers the delivery date","pitfall":"Completing a risk register once and never revisiting it","action":"Assess probability and impact, select responses, assign owners and review triggers","evidence":"Risk register, response plan, review log"}},{"id":"SDM","title":"Gestion de la prestation de services","domain":"SVC","page":26,"goal":"Assurer un service conforme aux engagements et à ses conditions d'exploitation.","evidence":"Contrats de service, catalogue, procédures opérationnelles, mesures des SLA.","pitfall":"Livrer un service sans accord sur ses niveaux attendus.","scenario":"Les utilisateurs contestent les délais de résolution faute d'engagement.","response":"Formaliser les niveaux de service et suivre la prestation contre ces accords.","symptom":"Service fourni mais qualité non mesurable","expected":"Accords de service et résultats de suivi des engagements","domainName":"Services","lesson":["Pourquoi : Assurer un service conforme aux engagements et à ses conditions d'exploitation.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Contrats de service, catalogue, procédures opérationnelles, mesures des SLA.","Erreur fréquente : Livrer un service sans accord sur ses niveaux attendus.","Situation pratique : Les utilisateurs contestent les délais de résolution faute d'engagement. Réponse attendue : Formaliser les niveaux de service et suivre la prestation contre ces accords."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces.","3":"La pratique s’appuie sur un standard organisationnel adapté et capitalisé."},"officialPracticeCount":8,"source":"Guide CMMI v4.0 (2026), p. 26","deep":{"kicker":"Apprendre à faire vivre gestion de la prestation de services dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — service fourni mais qualité non mesurable — elle doit aller au-delà des intentions. Cette Practice Area aide à assurer un service conforme aux engagements et à ses conditions d'exploitation.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA SDM n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour SDM, on attend notamment des traces telles que : contrats de service, catalogue, procédures opérationnelles, mesures des SLA.","**La distinction importante.** Un risque typique serait de livrer un service sans accord sur ses niveaux attendus. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Définir les engagements de service"],["02 · Organiser","Organiser la fourniture opérationnelle"],["03 · Appliquer","Suivre l’expérience et les écarts"],["04 · Vérifier","Améliorer la prestation"]],"story":"**Mission terrain.** Les utilisateurs contestent les délais de résolution faute d'engagement. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Formaliser les niveaux de service et suivre la prestation contre ces accords. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Les utilisateurs contestent les délais de résolution faute d'engagement. » Quelle réponse est la plus défendable ?","choices":["Formaliser les niveaux de service et suivre la prestation contre ces accords.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Livrer un service sans accord sur ses niveaux attendus."],"correct":0,"why":"La bonne décision répond au problème constaté : Formaliser les niveaux de service et suivre la prestation contre ces accords. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["SDM","Gestion de la prestation de services"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Accords de service et résultats de suivi des engagements","Traces d'exécution : Contrats de service, catalogue, procédures opérationnelles, mesures des SLA.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":26,"evidenceContrast":["La qualité de service est pilotée au regard d’engagements connus et des écarts traités.","Les équipes pensent que la fermeture des tickets équivaut à la satisfaction des utilisateurs."],"levelFr":{"1":"Fournir les services demandés","2":"Organiser et gérer la prestation selon des engagements de service","3":"Piloter les services selon une méthode et des actifs organisationnels"}},"duration":25,"isExpanded":true,"en":{"title":"Service Delivery Management","summary":"Deliver services that meet operational commitments and stakeholder needs","kicker":"From process intent to verifiable outcomes: Service Delivery Management","paragraphs":["**The business problem.** Deliver services that meet operational commitments and stakeholder needs. In a realistic organization, this means deciding which outcomes must improve and which people or teams are responsible. The goal is not to produce paperwork for an auditor: it is to make the activity reliable when circumstances change.","**A concrete example.** Users dispute response times because no targets were agreed. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** Set service targets, monitor delivery, manage demand and address deviations. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for service-level targets, operating reports, escalation records. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** running a service without explicit service expectations."],"steps":[["01 · Define","Clarify service requirements"],["02 · Prepare","Set delivery and support arrangements"],["03 · Perform","Monitor actual service levels"],["04 · Review","Improve service outcomes"]],"story":"**Case file — fictional organization.** Users dispute response times because no targets were agreed. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to set service targets, monitor delivery, manage demand and address deviations. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the SDM problem described in the case?","choices":["Document the intention without changing how the team works.","Set service targets, monitor delivery, manage demand and address deviations","Declare full maturity because the process has an owner."],"correct":1,"why":"Service Delivery Management requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["service level","An agreed measurable expectation for service delivery"],["service request","A user request handled through an established service process"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual SDM process.","Dated artifacts show the practice performed: Service-level targets, operating reports, escalation records.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous service-level targets, operating reports, escalation records tied to real work.","Weaker: running a service without explicit service expectations; no trace of consistent use."],"levelFr":{"1":"Begin addressing service delivery management, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable service delivery management work. For example: Set delivery and support arrangements; monitor actual service levels.","3":"Use a shared organizational approach to service delivery management; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets."},"scenario":"Users dispute response times because no targets were agreed","pitfall":"Running a service without explicit service expectations","action":"Set service targets, monitor delivery, manage demand and address deviations","evidence":"Service-level targets, operating reports, escalation records"}},{"id":"STSM","title":"Gestion stratégique des services","domain":"SVC","page":27,"goal":"Définir un portefeuille de services cohérent avec les besoins et capacités métiers.","evidence":"Stratégie de services, portefeuille, standards, décisions de conception.","pitfall":"Ajouter des services sans analyser la demande ni les moyens.","scenario":"L'entreprise lance trois offres sans étude de capacité.","response":"Définir l'offre cible, les capacités et la stratégie de service.","symptom":"Portefeuille de services incohérent","expected":"Stratégie et portefeuille de services validés","domainName":"Services","lesson":["Pourquoi : Définir un portefeuille de services cohérent avec les besoins et capacités métiers.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Stratégie de services, portefeuille, standards, décisions de conception.","Erreur fréquente : Ajouter des services sans analyser la demande ni les moyens.","Situation pratique : L'entreprise lance trois offres sans étude de capacité. Réponse attendue : Définir l'offre cible, les capacités et la stratégie de service."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces.","3":"La pratique s’appuie sur un standard organisationnel adapté et capitalisé."},"officialPracticeCount":5,"source":"Guide CMMI v4.0 (2026), p. 27","deep":{"kicker":"Apprendre à faire vivre gestion stratégique des services dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — portefeuille de services incohérent — elle doit aller au-delà des intentions. Cette Practice Area aide à définir un portefeuille de services cohérent avec les besoins et capacités métiers.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA STSM n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour STSM, on attend notamment des traces telles que : stratégie de services, portefeuille, standards, décisions de conception.","**La distinction importante.** Un risque typique serait de ajouter des services sans analyser la demande ni les moyens. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Comprendre besoins et marchés de service"],["02 · Organiser","Définir catalogue et engagements"],["03 · Appliquer","Ajuster la stratégie des services"],["04 · Vérifier","Examiner résultats et pertinence"]],"story":"**Mission terrain.** L'entreprise lance trois offres sans étude de capacité. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Définir l'offre cible, les capacités et la stratégie de service. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « L'entreprise lance trois offres sans étude de capacité. » Quelle réponse est la plus défendable ?","choices":["Définir l'offre cible, les capacités et la stratégie de service.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Ajouter des services sans analyser la demande ni les moyens."],"correct":0,"why":"La bonne décision répond au problème constaté : Définir l'offre cible, les capacités et la stratégie de service. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["STSM","Gestion stratégique des services"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Stratégie et portefeuille de services validés","Traces d'exécution : Stratégie de services, portefeuille, standards, décisions de conception.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":27,"evidenceContrast":["Le catalogue de services est aligné sur la demande et réexaminé selon l’usage.","Le portefeuille évolue sans critères ni attentes clients."],"levelFr":{"1":"Repérer des opportunités ou demandes de service","2":"Définir et gérer une stratégie de services en tenant compte des besoins","3":"Institutionnaliser l’approche de gestion stratégique des services"}},"duration":25,"isExpanded":true,"en":{"title":"Strategic Service Management","summary":"Manage the service portfolio in line with needs and organizational capabilities","kicker":"From process intent to verifiable outcomes: Strategic Service Management","paragraphs":["**The business problem.** Manage the service portfolio in line with needs and organizational capabilities. In a realistic organization, this means deciding which outcomes must improve and which people or teams are responsible. The goal is not to produce paperwork for an auditor: it is to make the activity reliable when circumstances change.","**A concrete example.** A company launches three offers without checking operating capacity. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** Understand demand, describe offerings, model capacity and periodically review the portfolio. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for service catalog, demand forecast, portfolio decisions. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** adding services without validating demand, cost and capability."],"steps":[["01 · Define","Analyze needs and market demand"],["02 · Prepare","Define the service portfolio"],["03 · Perform","Align capacity and capabilities"],["04 · Review","Review service value and fit"]],"story":"**Case file — fictional organization.** A company launches three offers without checking operating capacity. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to understand demand, describe offerings, model capacity and periodically review the portfolio. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the STSM problem described in the case?","choices":["Document the intention without changing how the team works.","Understand demand, describe offerings, model capacity and periodically review the portfolio","Declare full maturity because the process has an owner."],"correct":1,"why":"Strategic Service Management requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["service catalog","A maintained description of services available to consumers"],["service portfolio","The collection of proposed, live and retired services"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual STSM process.","Dated artifacts show the practice performed: Service catalog, demand forecast, portfolio decisions.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous service catalog, demand forecast, portfolio decisions tied to real work.","Weaker: adding services without validating demand, cost and capability; no trace of consistent use."],"levelFr":{"1":"Begin addressing strategic service management, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable strategic service management work. For example: Define the service portfolio; align capacity and capabilities.","3":"Use a shared organizational approach to strategic service management; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets."},"scenario":"A company launches three offers without checking operating capacity","pitfall":"Adding services without validating demand, cost and capability","action":"Understand demand, describe offerings, model capacity and periodically review the portfolio","evidence":"Service catalog, demand forecast, portfolio decisions"}},{"id":"SAM","title":"Gestion des accords fournisseurs","domain":"SPM","page":28,"goal":"Sélectionner des fournisseurs fiables et contrôler les engagements réciproques.","evidence":"Critères de sélection, contrats, évaluations, revues de prestation et acceptations.","pitfall":"Penser que la signature du contrat suffit à gérer le fournisseur.","scenario":"Un sous-traitant livre régulièrement des composants hors spécification.","response":"Mettre en place critères d'acceptation, suivi fournisseur et actions correctives.","symptom":"Fournisseurs non pilotés après sélection","expected":"Accords approuvés et revues de performance fournisseur","domainName":"Fournisseurs","lesson":["Pourquoi : Sélectionner des fournisseurs fiables et contrôler les engagements réciproques.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Critères de sélection, contrats, évaluations, revues de prestation et acceptations.","Erreur fréquente : Penser que la signature du contrat suffit à gérer le fournisseur.","Situation pratique : Un sous-traitant livre régulièrement des composants hors spécification. Réponse attendue : Mettre en place critères d'acceptation, suivi fournisseur et actions correctives."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces.","3":"La pratique s’appuie sur un standard organisationnel adapté et capitalisé.","4":"Pilotage avancé de la pratique à partir de résultats et de méthodes quantitatives, selon le modèle officiel."},"officialPracticeCount":12,"source":"Guide CMMI v4.0 (2026), p. 28","deep":{"kicker":"Apprendre à faire vivre gestion des accords fournisseurs dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — fournisseurs non pilotés après sélection — elle doit aller au-delà des intentions. Cette Practice Area aide à sélectionner des fournisseurs fiables et contrôler les engagements réciproques.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA SAM n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour SAM, on attend notamment des traces telles que : critères de sélection, contrats, évaluations, revues de prestation et acceptations.","**La distinction importante.** Un risque typique serait de penser que la signature du contrat suffit à gérer le fournisseur. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Sélectionner et contractualiser"],["02 · Organiser","Définir livrables et acceptation"],["03 · Appliquer","Suivre les engagements du fournisseur"],["04 · Vérifier","Traiter écarts et clôturer"]],"story":"**Mission terrain.** Un sous-traitant livre régulièrement des composants hors spécification. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Mettre en place critères d'acceptation, suivi fournisseur et actions correctives. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Un sous-traitant livre régulièrement des composants hors spécification. » Quelle réponse est la plus défendable ?","choices":["Mettre en place critères d'acceptation, suivi fournisseur et actions correctives.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Penser que la signature du contrat suffit à gérer le fournisseur."],"correct":0,"why":"La bonne décision répond au problème constaté : Mettre en place critères d'acceptation, suivi fournisseur et actions correctives. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["SAM","Gestion des accords fournisseurs"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Accords approuvés et revues de performance fournisseur","Traces d'exécution : Critères de sélection, contrats, évaluations, revues de prestation et acceptations.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":28,"evidenceContrast":["L’accord fournisseur décrit réception, suivi, modifications et décisions d’écart.","Un contrat est archivé puis aucun livrable n’est vérifié."],"levelFr":{"1":"Choisir des fournisseurs, formaliser les accords, réceptionner les livrables et traiter les factures","2":"Définir des critères de choix, piloter les fournisseurs et vérifier les accords avant acceptation","3":"Effectuer des revues techniques et suivre leurs prestations selon les critères contractuels","4":"Gérer quantitativement la performance des fournisseurs avec des mesures et analyses"}},"duration":25,"isExpanded":true,"en":{"title":"Supplier Agreement Management","summary":"Select, contract with and actively manage external suppliers","kicker":"From process intent to verifiable outcomes: Supplier Agreement Management","paragraphs":["**The business problem.** Select, contract with and actively manage external suppliers. In a realistic organization, this means deciding which outcomes must improve and which people or teams are responsible. The goal is not to produce paperwork for an auditor: it is to make the activity reliable when circumstances change.","**A concrete example.** A subcontractor repeatedly supplies components outside specification. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** Set selection criteria, define measurable agreements, review delivery and resolve breaches. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for selection scores, signed agreements, supplier performance reviews. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** assuming a signed contract guarantees supplier performance."],"steps":[["01 · Define","Define supplier requirements"],["02 · Prepare","Assess and select candidates"],["03 · Perform","Agree responsibilities and acceptance"],["04 · Review","Monitor supplier obligations"]],"story":"**Case file — fictional organization.** A subcontractor repeatedly supplies components outside specification. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to set selection criteria, define measurable agreements, review delivery and resolve breaches. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the SAM problem described in the case?","choices":["Document the intention without changing how the team works.","Set selection criteria, define measurable agreements, review delivery and resolve breaches","Declare full maturity because the process has an owner."],"correct":1,"why":"Supplier Agreement Management requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["supplier agreement","Mutual obligations defining supplier deliverables and controls"],["acceptance evidence","Records showing whether delivered work meets agreed criteria"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual SAM process.","Dated artifacts show the practice performed: Selection scores, signed agreements, supplier performance reviews.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous selection scores, signed agreements, supplier performance reviews tied to real work.","Weaker: assuming a signed contract guarantees supplier performance; no trace of consistent use."],"levelFr":{"1":"Begin addressing supplier agreement management, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable supplier agreement management work. For example: Assess and select candidates; agree responsibilities and acceptance.","3":"Use a shared organizational approach to supplier agreement management; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets.","4":"Apply suitable quantitative or statistical methods to understand and control performance of supplier agreement management activities."},"scenario":"A subcontractor repeatedly supplies components outside specification","pitfall":"Assuming a signed contract guarantees supplier performance","action":"Set selection criteria, define measurable agreements, review delivery and resolve breaches","evidence":"Selection scores, signed agreements, supplier performance reviews"}},{"id":"TS","title":"Solution technique","domain":"DEV","page":29,"goal":"Concevoir et réaliser une solution répondant aux exigences.","evidence":"Choix d'architecture, études d'alternatives, conceptions, prototypes, code.","pitfall":"Choisir une architecture sans analyser exigences et contraintes.","scenario":"Une solution performante ne répond pas aux exigences de maintenance.","response":"Comparer les options de conception et vérifier leur adéquation au besoin.","symptom":"Choix technique inadéquat ou non argumenté","expected":"Dossier de conception relié aux exigences","domainName":"Développement","lesson":["Pourquoi : Concevoir et réaliser une solution répondant aux exigences.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Choix d'architecture, études d'alternatives, conceptions, prototypes, code.","Erreur fréquente : Choisir une architecture sans analyser exigences et contraintes.","Situation pratique : Une solution performante ne répond pas aux exigences de maintenance. Réponse attendue : Comparer les options de conception et vérifier leur adéquation au besoin."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces.","3":"La pratique s’appuie sur un standard organisationnel adapté et capitalisé."},"officialPracticeCount":10,"source":"Guide CMMI v4.0 (2026), p. 29","deep":{"kicker":"Apprendre à faire vivre solution technique dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — choix technique inadéquat ou non argumenté — elle doit aller au-delà des intentions. Cette Practice Area aide à concevoir et réaliser une solution répondant aux exigences.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA TS n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour TS, on attend notamment des traces telles que : choix d'architecture, études d'alternatives, conceptions, prototypes, code.","**La distinction importante.** Un risque typique serait de choisir une architecture sans analyser exigences et contraintes. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Explorer les choix de solution"],["02 · Organiser","Concevoir composants et interfaces"],["03 · Appliquer","Produire selon les exigences"],["04 · Vérifier","Examiner qualité technique et impacts"]],"story":"**Mission terrain.** Une solution performante ne répond pas aux exigences de maintenance. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Comparer les options de conception et vérifier leur adéquation au besoin. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Une solution performante ne répond pas aux exigences de maintenance. » Quelle réponse est la plus défendable ?","choices":["Comparer les options de conception et vérifier leur adéquation au besoin.","Faire signer une nouvelle procédure sans vérifier son utilisation.","Choisir une architecture sans analyser exigences et contraintes."],"correct":0,"why":"La bonne décision répond au problème constaté : Comparer les options de conception et vérifier leur adéquation au besoin. En revanche, un document isolé ou la mauvaise pratique signalée ne prouvent pas une application durable.","glossary":[["TS","Solution technique"],["Preuve de déploiement","Élément tangible qui illustre comment une pratique est réellement appliquée."]],"evidenceExamples":["Règles / préparation : Dossier de conception relié aux exigences","Traces d'exécution : Choix d'architecture, études d'alternatives, conceptions, prototypes, code.","Recoupement : exemples datés de plusieurs activités et explications des responsables.","Suivi : écarts détectés, décisions prises et résultats observables."],"sourcePage":29,"evidenceContrast":["Les options techniques sont confrontées aux exigences et les décisions sont documentées.","Une technologie est choisie avant de comprendre le besoin."],"levelFr":{"1":"Créer ou acquérir une solution technique","2":"Choisir, développer et documenter des solutions compatibles avec les exigences","3":"Organiser la conception et la solution technique selon les standards de l’organisation"}},"duration":25,"isExpanded":true,"en":{"title":"Technical Solution","summary":"Design and implement a solution that satisfies constraints and requirements","kicker":"From process intent to verifiable outcomes: Technical Solution","paragraphs":["**The business problem.** Design and implement a solution that satisfies constraints and requirements. In a realistic organization, this means deciding which outcomes must improve and which people or teams are responsible. The goal is not to produce paperwork for an auditor: it is to make the activity reliable when circumstances change.","**A concrete example.** A fast system cannot meet maintenance and support needs. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** Compare feasible architectures, document design decisions, develop components and verify constraints. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for design records, trade-off evidence, component tests. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** choosing an architecture before analyzing design trade-offs."],"steps":[["01 · Define","Assess technical options"],["02 · Prepare","Select justified design approaches"],["03 · Perform","Develop the solution components"],["04 · Review","Confirm constraints are addressed"]],"story":"**Case file — fictional organization.** A fast system cannot meet maintenance and support needs. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to compare feasible architectures, document design decisions, develop components and verify constraints. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the TS problem described in the case?","choices":["Document the intention without changing how the team works.","Compare feasible architectures, document design decisions, develop components and verify constraints","Declare full maturity because the process has an owner."],"correct":1,"why":"Technical Solution requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["design constraint","A condition limiting acceptable technical choices"],["architecture trade-off","A comparison of alternative technical designs"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual TS process.","Dated artifacts show the practice performed: Design records, trade-off evidence, component tests.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous design records, trade-off evidence, component tests tied to real work.","Weaker: choosing an architecture before analyzing design trade-offs; no trace of consistent use."],"levelFr":{"1":"Begin addressing technical solution, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable technical solution work. For example: Select justified design approaches; develop the solution components.","3":"Use a shared organizational approach to technical solution; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets."},"scenario":"A fast system cannot meet maintenance and support needs","pitfall":"Choosing an architecture before analyzing design trade-offs","action":"Compare feasible architectures, document design decisions, develop components and verify constraints","evidence":"Design records, trade-off evidence, component tests"}},{"id":"VV","title":"Vérification et validation","domain":"CORE","page":30,"goal":"Établir que le livrable respecte ses exigences et répond au besoin d'usage.","evidence":"Plans et résultats de tests, critères, essais utilisateurs, anomalies résolues.","pitfall":"Confondre conforme à la spécification et utile pour l'utilisateur.","scenario":"Le logiciel passe tous les tests unitaires mais ne couvre pas le parcours client.","response":"Combiner vérification des spécifications et validation du besoin réel.","symptom":"Produit conforme techniquement mais inutilisable","expected":"Tests de conformité et validation par les utilisateurs","domainName":"Fondamentaux","lesson":["Pourquoi : Établir que le livrable respecte ses exigences et répond au besoin d'usage.","Dans un audit : demande des traces datées, appliquées à plusieurs projets et explicables par les personnes interrogées.","Preuves à chercher : Plans et résultats de tests, critères, essais utilisateurs, anomalies résolues.","Erreur fréquente : Confondre conforme à la spécification et utile pour l'utilisateur.","Situation pratique : Le logiciel passe tous les tests unitaires mais ne couvre pas le parcours client. Réponse attendue : Combiner vérification des spécifications et validation du besoin réel."],"levelNotes":{"1":"Une initiative existe, encore partielle ou dépendante des personnes.","2":"La pratique est gérée au niveau du projet avec responsabilités, suivi et traces.","3":"La pratique s’appuie sur un standard organisationnel adapté et capitalisé."},"officialPracticeCount":7,"source":"Guide CMMI v4.0 (2026), p. 30","deep":{"kicker":"Apprendre à faire vivre vérification et validation dans une organisation","paragraphs":["**Le problème à résoudre.** Quand une organisation rencontre le symptôme suivant — produit conforme techniquement mais inutilisable — elle doit aller au-delà des intentions. Cette Practice Area aide à établir que le livrable respecte ses exigences et répond au besoin d'usage.","**Ce qui change concrètement.** Une mise en œuvre crédible transforme le problème en activité répétable. La PA VV n'est pas démontrée simplement parce que l'entreprise possède un outil, une procédure ou une politique : il faut montrer comment les équipes appliquent des décisions, suivent des résultats et corrigent les écarts.","**Ce qu'un responsable doit savoir expliquer.** Qui décide ? Quand l'activité se déclenche-t-elle ? Quelles informations sont produites et conservées ? Comment voit-on que cela fonctionne ? Pour VV, on attend notamment des traces telles que : plans et résultats de tests, critères, essais utilisateurs, anomalies résolues.","**La distinction importante.** Un risque typique serait de confondre conforme à la spécification et utile pour l'utilisateur. Pour raisonner en évaluateur, confronte la méthode écrite à des situations réellement exécutées, et ne conclus que sur ce que les éléments examinés permettent de soutenir."],"steps":[["01 · Cadrer","Définir critères de vérification"],["02 · Organiser","Vérifier la conformité de la solution"],["03 · Appliquer","Valider en contexte réel d’utilisation"],["04 · Vérifier","Tracer défauts et décisions"]],"story":"**Mission terrain.** Le logiciel passe tous les tests unitaires mais ne couvre pas le parcours client. Tu es responsable de la préparation de l'évaluation. Ton objectif est de diagnostiquer le problème, choisir une réponse appropriée et réunir des traces de sa mise en œuvre.","lesson":"**Intervention proposée :** Combiner vérification des spécifications et validation du besoin réel. **Ce qui manquerait à une simple déclaration :** des éléments datés, des responsables identifiés, et une vérification de l'utilisation réelle de la pratique.","question":"La situation est : « Le logiciel passe tous les tests unitaires mais ne couvre pas le parcours client. » Quelle réponse est la plus défendable ?","choices":["Combiner ample.** Unit tests pass while the customer journey still fails. This situation should lead to investigation rather than to an unsupported assumption. Ask what happened, what was planned, who acted, which decisions were recorded and whether results improved.","**How to put it into practice.** Trace checks to requirements, test intended use with stakeholders and act on mismatches. Treat the process as an operational loop: agree how work is performed, create usable records, measure whether the approach works and improve it when evidence reveals a gap.","**How to reason during an appraisal.** Look for verification reports, validation feedback, acceptance results. Corroborate records with the people performing the work and avoid generalizing from a single team or isolated example. **Common trap:** using verification evidence as proof of real-world usefulness."],"steps":[["01 · Define","Plan checks and acceptance"],["02 · Prepare","Verify outputs against requirements"],["03 · Perform","Validate use in intended conditions"],["04 · Review","Investigate gaps and retest"]],"story":"**Case file — fictional organization.** Unit tests pass while the customer journey still fails. The appraisal preparation team needs to decide whether current evidence demonstrates a repeatable practice, identify missing support and propose the next improvement.","lesson":"A sound response would be to trace checks to requirements, test intended use with stakeholders and act on mismatches. The conclusion must be limited to what the evidence actually establishes. Look for current, attributable records and consistent explanations from relevant practitioners.","question":"Which response best addresses the VV problem described in the case?","choices":["Document the intention without changing how the team works.","Trace checks to requirements, test intended use with stakeholders and act on mismatches","Declare full maturity because the process has an owner."],"correct":1,"why":"Verification and Validation requires actions and evidence relevant to its purpose. A claim, a template, or an isolated successful outcome is insufficient on its own.","glossary":[["verification","Evidence that a work product meets specified requirements"],["validation","Evidence that a solution meets its intended use and stakeholder needs"],["objective evidence","Information that can be checked and corroborated rather than merely asserted."]],"evidenceExamples":["An accountable owner can explain the actual VV process.","Dated artifacts show the practice performed: Verification reports, validation feedback, acceptance results.","Different participants give consistent accounts of how work is done.","Results and deviations lead to tracked improvement actions."],"evidenceContrast":["Stronger: contemporaneous verification reports, validation feedback, acceptance results tied to real work.","Weaker: using verification evidence as proof of real-world usefulness; no trace of consistent use."],"levelFr":{"1":"Begin addressing verification and validation, even if early actions are incomplete or person-dependent.","2":"Manage and record repeatable verification and validation work. For example: Verify outputs against requirements; validate use in intended conditions.","3":"Use a shared organizational approach to verification and validation; tailor it appropriately, review outcomes, and feed learning into organization-wide process assets."},"scenario":"Unit tests pass while the customer journey still fails","pitfall":"Using verification evidence as proof of real-world usefulness","action":"Trace checks to requirements, test intended use with stakeholders and act on mismatches","evidence":"Verification reports, validation feedback, acceptance results"}},{"id":"WE","title":"Autonomisation des équipes","domain":"PPL","page":31,"goal":"Adapter compétences, responsabilités et coordination aux objectifs métiers.","evidence":"Cartographie des compétences, affectations, organisation d'équipes, mécanismes d'écha
