name: Cartesian — render 80 silent bilingual CMMI videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data.json
      - generate_hyperframes.py
      - .github/workflows/render-videos.yml

permissions:
  contents: write

concurrency:
  group: cmmi-cartesian-render
  cancel-in-progress: false

jobs:
  render:
    name: Cartesian render ${{ matrix.shard }}/7
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install open-source HyperFrames and FFmpeg (no TTS)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm install --global hyperframes
      - name: Generate 10 Cartesian compositions and captions, NO audio
        run: python3 generate_hyperframes.py --shard '${{ matrix.shard }}'
      - name: Render actual silent MP4 with HyperFrames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p videos
          rm -f videos/*.mp4 videos/*.vtt
          mapfile -t compositions < <(find video_compositions -maxdepth 1 -name '*.html' -type f | sort)
          test "${#compositions[@]}" -eq 10
          for file in "${compositions[@]}"; do
            stem="$(basename "$file" .html)"
            echo "Rendering $stem in Cartesian, silent..."
            hyperframes render --composition "$file" --fps 18 --quality looks --output "videos/$stem.mp4" </dev/null
            # HyperFrames may mux an empty audio stream; strip it losslessly to enforce silence.
            ffmpeg -hide_banner -loglevel error -y -i "videos/$stem.mp4" -map 0:v:0 -c:v copy -an "videos/$stem.silent.mp4"
            mv "videos/$stem.silent.mp4" "videos/$stem.mp4"
            cp "video_compositions/$stem.vtt" "videos/$stem.vtt"
            test -s "videos/$stem.mp4"
            video_stream="$(ffprobe -v error -select_streams v:0 -show_entries stream=index -of csv=p=0 "videos/$stem.mp4")"
            audio_stream="$(ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 "videos/$stem.mp4")"
            echo "VERIFIED $stem video=$video_stream audio=$audio_stream"
            test -n "$video_stream"
            test -z "$audio_stream"
          done
          test "$(find videos -maxdepth 1 -name '*.mp4' | wc -l)" -eq 10
          test "$(find videos -maxdepth 1 -name '*.vtt' | wc -l)" -eq 10
      - uses: actions/upload-artifact@v4
        with:
          name: cartesian-silent-${{ matrix.shard }}
          path: videos/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Verify and commit 80 silent videos to main
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: cartesian-silent-*
          path: videos/
          merge-multiple: true
      - name: Verify all 80 playable MP4, all 80 VTT and absolutely no audio
        shell: bash
        run: |
          set -euo pipefail
          echo "Videos: $(find videos -maxdepth 1 -name '*.mp4' | wc -l)"
          echo "Captions: $(find videos -maxdepth 1 -name '*.vtt' | wc -l)"
          test "$(find videos -maxdepth 1 -name '*.mp4' | wc -l)" -eq 80
          test "$(find videos -maxdepth 1 -name '*.vtt' | wc -l)" -eq 80
          for f in videos/*.mp4; do
            test -s "$f"
            ffprobe -v error -select_streams v:0 -show_entries stream=index -of csv=p=0 "$f" | grep -q .
            test -z "$(ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 "$f")"
          done
      - name: Publish to main (triggers Vercel)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          git add -f videos/*.mp4 videos/*.vtt
          if git diff --cached --quiet; then
            echo 'Already published'
          else
            git commit -m 'assets: 80 silent Cartesian educational videos via HyperFrames'
            git push origin HEAD:main
          fi