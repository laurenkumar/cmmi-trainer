name: Publish completed HyperFrames video artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-rendered-videos.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Download all successfully rendered files from verified generation
        uses: actions/download-artifact@v4
        with:
          run-id: 38604221230
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: hyperframes-videos-*
          path: videos/
          merge-multiple: true
      - name: Validate 80 MP4 + 80 VTT with audio
        run: |
          set -euo pipefail
          test "$(find videos -maxdepth 1 -name '*.mp4' | wc -l)" -eq 80
          test "$(find videos -maxdepth 1 -name '*.vtt' | wc -l)" -eq 80
          for f in videos/*.mp4; do
            test -s "$f"
            ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 "$f" | grep -q .
          done
      - name: Push validated videos to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add videos/*.mp4 videos/*.vtt
          if ! git diff --cached --quiet; then
            git commit -m 'assets: publish all 80 narrated CMMI HyperFrames lessons'
            git push origin HEAD:main
          fi
