name: Academy quality gates
on:
  push:
    branches: [main]
    paths-ignore: ['videos/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  academy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python3 audit_release.py
      - run: python3 build.py && git diff --exit-code -- index.html
      - run: node --check app.js
      - run: python3 validate_release.py --git-ref HEAD
      - run: npm test
        env:
          QA_OUTPUT: qa-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academy-quality-results
          path: qa-results.json
          if-no-files-found: warn
